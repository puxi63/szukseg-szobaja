<style>
:root {
  color-scheme: dark;
  --bg: #0b0a0d; --text: #f1e8d6; --dim: #bdb098; --gold: #f2dca2; --panel: rgba(18, 13, 10, 0.88);
  --line: rgba(201, 163, 92, 0.6); --btn: #2a1c10; --btn-on: #c99a4a; --ink: #140d06; --shadow: #000;
  --warn: #ffb08a;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.35 "Source Sans 3", "Segoe UI", Arial, sans-serif; }
#pvCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#pvLabels { position: fixed; inset: 0; pointer-events: none; }
.pv-label { position: absolute; transform: translate(-50%, 0); font-size: 11px; line-height: 1.15; text-align: center; color: var(--text); text-shadow: 0 1px 2px var(--shadow), 0 0 4px var(--shadow); white-space: nowrap; }
.pv-label b { color: var(--gold); font-weight: 600; font-size: 12px; }
.pv-label i { color: var(--dim); font-style: normal; }
.pv-label .pv-flag { color: var(--warn); }
#pvInfo { position: fixed; left: 12px; top: 12px; width: min(400px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; box-sizing: border-box; }
#pvInfo h1 { margin: 0 0 6px; font: 600 24px/1 "Cormorant Garamond", Garamond, serif; color: var(--gold); }
#pvInfo h2 { margin: 10px 0 4px; font: 600 16px/1 "Cormorant Garamond", Garamond, serif; color: var(--gold); }
#pvInfo table { border-collapse: collapse; width: 100%; font-size: 12px; }
#pvInfo td { padding: 1px 4px 1px 0; vertical-align: top; }
#pvInfo td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
#pvInfo ul { margin: 2px 0 0; padding-left: 16px; color: var(--dim); font-size: 12px; }
#pvButtons button { margin: 6px 6px 0 0; padding: 4px 10px; background: var(--btn); color: var(--text); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; font: inherit; }
#pvButtons button[aria-pressed="true"] { background: var(--btn-on); color: var(--ink); }
#pvButtons button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#pvFocus { position: fixed; right: 12px; bottom: 12px; max-width: min(420px, calc(100vw - 24px)); padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
#pvFocus h2 { margin: 0 0 4px; font: 600 22px/1.1 "Cormorant Garamond", Garamond, serif; color: var(--gold); }
#pvFocus p { margin: 0; color: var(--dim); font-size: 13px; }
body.pv-shot #pvInfo, body.pv-shot #pvFocus { display: none; }
</style>
</head>

/* ---- 22-figures-geo.js ---- */
/* ==== 22-figures-geo.js — figure geometry: packed vertex layout, baked-figure decoding, placeholders, the round display
   base (three LODs), metrics and the category symbols. Figures are sculpted and baked offline (tools/figbake, see
   figura-minta/TECHNIQUE.md); the page only decodes assets/figures-baked/<id>.json. ==== */

/*
 * Packed vertex layout shared by every figure and base (TECHNIQUE.md 8 and 10):
 *   position  u16x4 normalised, w unused (dequantised by the per-LOD local matrix; four components are a native
 *             D3D11 vertex format, three made ANGLE keep a converted copy of every buffer, XB-7) or float32x3
 *             (code-built meshes)
 *   aOct      i16x2 octahedral normal          aCol  u8x4 sRGB paint + front AO
 *   aPbr      u8x4 roughness, metalness, clearcoat, back-face AO (bases: a = 255 enamel ring, 128 medallion field)
 */

/** Level-of-detail indices and switching distances in metres (scaled per design size and quality preset). */
const FIG_LOD = { NEAR: 0, MID: 1, FAR: 2, nearDist: 1.45, midDist: 4.6, hysteresis: 0.12 };
const FIG_BAKED_URL = 'assets/figures-baked/';
/** Base geometry in bake cm: radius 3.0, height 1.5 (FIG_BASE_H), medallion centre on the front. */
const FIG_BASE_DIM = { r: 3.0, h: 1.5, medY: 0.72, medZ: 2.93, medR: 0.43 };

function figOctEncode(x, y, z, out, o) {
  const l1 = Math.abs(x) + Math.abs(y) + Math.abs(z) || 1;
  let u = x / l1;
  let v = y / l1;
  if (z < 0) {
    const ou = u;
    u = (1 - Math.abs(v)) * (ou >= 0 ? 1 : -1);
    v = (1 - Math.abs(ou)) * (v >= 0 ? 1 : -1);
  }
  out[o] = Math.round(Math.max(-1, Math.min(1, u)) * 32767);
  out[o + 1] = Math.round(Math.max(-1, Math.min(1, v)) * 32767);
}

function figOctDecode(a, b, out, o) {
  let x = a / 32767;
  let y = b / 32767;
  const z = 1 - Math.abs(x) - Math.abs(y);
  if (z < 0) {
    const ox = x;
    x = (1 - Math.abs(y)) * (ox >= 0 ? 1 : -1);
    y = (1 - Math.abs(ox)) * (y >= 0 ? 1 : -1);
  }
  const l = Math.hypot(x, y, z) || 1;
  out[o] = x / l;
  out[o + 1] = y / l;
  out[o + 2] = z / l;
}

/** Builds a packed BufferGeometry from typed arrays (posSize 4: the padded u16x4 position of the baked figures). */
function figPackedGeometry(position, posNormalized, oct, col, pbr, index, posSize = 3) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(position, posSize, posNormalized));
  g.setAttribute('aOct', new THREE.BufferAttribute(oct, 2, true));
  g.setAttribute('aCol', new THREE.BufferAttribute(col, 4, true));
  g.setAttribute('aPbr', new THREE.BufferAttribute(pbr, 4, true));
  g.setIndex(new THREE.BufferAttribute(index, 1));
  for (const k of Object.keys(g.attributes)) g.attributes[k].onUpload(figMarkUploaded);
  g.index.onUpload(figMarkUploaded);
  return g;
}

function figB64(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/**
 * Decodes one mesh block of the sdf-figure format. Returns { geometry, dequant (cm -> cm matrix), tris, verts,
 * far (float copy for the far batch, only when keepFloat) }.
 */
function figDecodeBlock(block, materials, keepFloat) {
  const nV = block.counts.vertices;
  const { min, max } = block.bounds;
  const pos = new Uint16Array(figB64(block.attributes.position.data).buffer);
  const oct = new Int16Array(figB64(block.attributes.normal.data).buffer);
  const col = figB64(block.attributes.color.data);
  const mat = figB64(block.attributes.material.data);
  const back = block.attributes.aoBack ? figB64(block.attributes.aoBack.data) : new Uint8Array(nV);
  const idxBytes = figB64(block.index.data);
  const index = block.index.type === 'u16' ? new Uint16Array(idxBytes.buffer) : new Uint32Array(idxBytes.buffer);
  const pbr = new Uint8Array(nV * 4);
  for (let i = 0; i < nV; i++) {
    const m = materials[mat[i]] || materials[0];
    pbr[i * 4] = Math.round(m.rough * 255);
    pbr[i * 4 + 1] = Math.round((m.metal || 0) * 255);
    pbr[i * 4 + 2] = Math.round((m.coat ?? 0.5) * 255);
    pbr[i * 4 + 3] = figPbrByte(m, back[i]);
  }
  // Padded to u16x4 for the GPU (XB-7); the stride-3 array is only read below and then dropped.
  const pos4 = new Uint16Array(nV * 4);
  for (let v = 0; v < nV; v++) {
    pos4[v * 4] = pos[v * 3];
    pos4[v * 4 + 1] = pos[v * 3 + 1];
    pos4[v * 4 + 2] = pos[v * 3 + 2];
  }
  const geometry = figPackedGeometry(pos4, true, oct, col, pbr, index, 4);
  const dequant = new THREE.Matrix4().makeTranslation(min[0], min[1], min[2]).multiply(new THREE.Matrix4().makeScale(max[0] - min[0], max[1] - min[1], max[2] - min[2]));
  const out = { geometry, dequant, tris: index.length / 3, verts: nV, far: null };
  if (keepFloat) {
    const fp = new Float32Array(nV * 3);
    const fn = new Float32Array(nV * 3);
    for (let v = 0; v < nV; v++) {
      for (let c = 0; c < 3; c++) fp[v * 3 + c] = min[c] + (pos[v * 3 + c] / 65535) * (max[c] - min[c]);
      figOctDecode(oct[v * 2], oct[v * 2 + 1], fn, v * 3);
    }
    out.far = { pos: fp, nrm: fn, col, pbr, index };
  }
  return out;
}

/**
 * Code-built meshes (bases, placeholders) packed into the shared layout. Positions in cm. `indexed` keeps the index of
 * every part (shared vertices: about a third of the vertices of the non-indexed form, same smooth normals).
 */
class FigPaint {
  constructor(indexed = false) {
    this.items = [];
    this.indexed = indexed;
  }

  /** flag goes to aPbr.a (bases: 255 = enamel ring, 128 = medallion field). */
  add(geo, hex, rough = 0.5, metal = 0, coat = 0.5, flag = 0) {
    const g = geo.index && !this.indexed ? geo.toNonIndexed() : geo;
    if (!g.attributes.normal) g.computeVertexNormals();
    const c = new THREE.Color(hex);
    this.items.push({ g, rgb: [Math.round(c.r * 255), Math.round(c.g * 255), Math.round(c.b * 255)], rough, metal, coat, flag });
    if (g !== geo) geo.dispose();
    return this;
  }

  /** Returns { geometry, far } with float positions (dequant = identity). */
  build() {
    let n = 0;
    let ni = 0;
    for (const it of this.items) {
      n += it.g.attributes.position.count;
      ni += it.g.index ? it.g.index.count : it.g.attributes.position.count;
    }
    const pos = new Float32Array(n * 3);
    const nrm = new Float32Array(n * 3);
    const oct = new Int16Array(n * 2);
    const col = new Uint8Array(n * 4);
    const pbr = new Uint8Array(n * 4);
    const index = n < 65536 ? new Uint16Array(ni) : new Uint32Array(ni);
    let o = 0;
    let io = 0;
    for (const it of this.items) {
      const p = it.g.attributes.position;
      const nn = it.g.attributes.normal;
      const base = o;
      if (it.g.index) {
        const src = it.g.index.array;
        for (let i = 0; i < src.length; i++) index[io++] = src[i] + base;
      } else {
        for (let i = 0; i < p.count; i++) index[io++] = base + i;
      }
      for (let i = 0; i < p.count; i++, o++) {
        pos[o * 3] = p.getX(i);
        pos[o * 3 + 1] = p.getY(i);
        pos[o * 3 + 2] = p.getZ(i);
        nrm[o * 3] = nn.getX(i);
        nrm[o * 3 + 1] = nn.getY(i);
        nrm[o * 3 + 2] = nn.getZ(i);
        figOctEncode(nn.getX(i), nn.getY(i), nn.getZ(i), oct, o * 2);
        col[o * 4] = it.rgb[0];
        col[o * 4 + 1] = it.rgb[1];
        col[o * 4 + 2] = it.rgb[2];
        col[o * 4 + 3] = 255;
        pbr[o * 4] = it.rough * 255;
        pbr[o * 4 + 1] = it.metal * 255;
        pbr[o * 4 + 2] = it.coat * 255;
        pbr[o * 4 + 3] = it.flag;
      }
      it.g.dispose();
    }
    this.items = [];
    const geometry = figPackedGeometry(pos, false, oct, col, pbr, index);
    return { geometry, dequant: new THREE.Matrix4(), tris: ni / 3, verts: n, far: { pos, nrm, col, pbr, index } };
  }
}

function figXf(g, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1]) {
  const m = new THREE.Matrix4().compose(new THREE.Vector3(p[0], p[1], p[2]), new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0], r[1], r[2])), new THREE.Vector3(s[0], s[1], s[2]));
  g.applyMatrix4(m);
  return g;
}

function figLathe(points, segs) {
  const g = new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(Math.max(r, 0), y)), segs);
  g.computeVertexNormals();
  return g;
}

/* ---- the round display base ------------------------------------------------------------------- */

const FIG_GOLD = 0xe2b866;
const FIG_LACQUER = 0x1b120c;
const figBaseCache = [null, null, null];

/**
 * The shared base in bake cm (origin at the bottom centre, radius 3.0, height 1.5): black lacquered walnut, gilt
 * bezels, the enamel band (flag 255, coloured per category in the shader) and the front medallion (flag 128, the
 * category symbol from the atlas). Indexed lathes (PERF-PLAN F9): lod 0 32 segments with the full profile (about 1.3k
 * triangles), lod 1 24 segments with a simplified profile and a flat medallion (about 650; 16 segments showed a
 * polygonal rim and underside on the covered pile figurines that stay at LOD1 when zoomed in, integration), lod 2 10
 * segments without the medallion (about 140; the same silhouette as the old far base).
 */
function figBuildBase(lod) {
  if (figBaseCache[lod]) return figBaseCache[lod];
  const segs = [32, 24, 10][lod];
  const P = new FigPaint(true);
  const D = FIG_BASE_DIM;
  const k = D.r / 3.53;
  const ky = D.h / 1.8;
  const S = (pts) => pts.map(([r, y]) => [r * k, y * ky]);
  let bands;
  if (lod === 2) {
    bands = [
      [FIG_LACQUER, 0.24, 0, 0.8, 0, [[3.3, 0.0], [3.5, 0.08], [3.53, 0.5]]],
      [0xffffff, 0.15, 0, 1, 255, [[3.53, 0.5], [3.45, 1.2]]],
      [FIG_LACQUER, 0.24, 0, 0.8, 0, [[3.45, 1.2], [3.3, 1.65], [2.9, 1.8], [0.0, 1.8]]],
    ];
  } else if (lod === 1) {
    // The gilt bezels become flat gold bands (2-3 px at this distance), the enamel band keeps its bulge.
    bands = [
      [FIG_LACQUER, 0.22, 0, 1, 0, [[3.3, 0.0], [3.5, 0.08], [3.53, 0.42], [3.38, 0.535]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[3.38, 0.535], [3.41, 0.625]]],
      [0xffffff, 0.12, 0, 1, 255, [[3.41, 0.625], [3.44, 0.9], [3.41, 1.175]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[3.41, 1.175], [3.39, 1.265]]],
      [FIG_LACQUER, 0.22, 0, 1, 0, [[3.39, 1.265], [3.32, 1.55], [2.96, 1.8], [2.78, 1.8]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[2.78, 1.8], [2.72, 1.836], [2.66, 1.8]]],
      [FIG_LACQUER, 0.22, 0, 1, 0, [[2.66, 1.8], [0.0, 1.8]]],
    ];
  } else {
    bands = [
      [FIG_LACQUER, 0.22, 0, 1, 0, [[3.3, 0.0], [3.5, 0.08], [3.53, 0.42], [3.36, 0.535]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[3.36, 0.535], [3.425, 0.58], [3.36, 0.625]]],
      [0xffffff, 0.12, 0, 1, 255, [[3.36, 0.625], [3.43, 0.75], [3.43, 1.05], [3.36, 1.175]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[3.36, 1.175], [3.425, 1.22], [3.36, 1.265]]],
      [FIG_LACQUER, 0.22, 0, 1, 0, [[3.36, 1.265], [3.37, 1.42], [3.24, 1.68], [2.96, 1.8], [2.78, 1.8]]],
      [FIG_GOLD, 0.26, 1, 0, 0, [[2.78, 1.8], [2.72, 1.836], [2.66, 1.8]]],
      [FIG_LACQUER, 0.22, 0, 1, 0, [[2.66, 1.8], [0.0, 1.8]]],
    ];
  }
  for (const [hex, rough, metal, coat, flag, pts] of bands) P.add(figLathe(S(pts), segs), hex, rough, metal, coat, flag);
  // Underside in the category's enamel colour (flag 255, like the ring band): seen end-on in the figurine piles it is a
  // bright, sortable colour cue instead of a dark hole.
  P.add(figLathe(S([[0.0, 0.0], [3.3, 0.0]]), segs), 0xffffff, 0.6, 0, 0, 255);
  if (lod === 0) {
    /* Medallion: gilt rim and a lacquer field whose symbol comes from the atlas (flag 128) */
    const ms = 24;
    P.add(figXf(new THREE.TorusGeometry(D.medR, 0.06, 5, ms), [0, D.medY, D.medZ]), FIG_GOLD, 0.24, 1, 0, 0);
    P.add(figXf(new THREE.CircleGeometry(D.medR, ms), [0, D.medY, D.medZ + 0.025]), 0x16100c, 0.2, 0, 1, 128);
    P.add(figXf(new THREE.CylinderGeometry(D.medR, D.medR, 0.1, ms, 1, true), [0, D.medY, D.medZ - 0.03], [Math.PI / 2, 0, 0]), FIG_GOLD, 0.3, 1, 0, 0);
  } else if (lod === 1) {
    /* Mid-distance medallion: a gilt disc just behind the symbol field (the rim reads as a thin gold ring) */
    const ms = 12;
    P.add(figXf(new THREE.CircleGeometry(D.medR + 0.07, ms), [0, D.medY, D.medZ + 0.005]), FIG_GOLD, 0.24, 1, 0, 0);
    P.add(figXf(new THREE.CircleGeometry(D.medR, ms), [0, D.medY, D.medZ + 0.03]), 0x16100c, 0.2, 0, 1, 128);
  }
  figBaseCache[lod] = P.build();
  return figBaseCache[lod];
}

/** DESIGN.md 16.5: shared round base (lod 0), origin at the base bottom centre, in metres. */
function buildBaseGeometry() {
  const b = figBuildBase(0);
  if (!b.geometryM) {
    b.geometryM = b.geometry.clone();
    b.geometryM.scale(FIG_CM, FIG_CM, FIG_CM);
  }
  return b.geometryM;
}

/* ---- placeholders (shown only until the baked file of a design has arrived, or if it fails) ------- */

function figPlaceholder(d) {
  const P = new FigPaint();
  const h = d.nominalH;
  const tint = d.category === 'tower' ? FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.house]]?.color || '#d4a84a'
    : d.category === 'special' ? '#6b5a48' : FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]].color;
  const houses = ['gryffindor', 'slytherin', 'ravenclaw', 'hufflepuff', 'special'];
  if (houses.includes(d.category) || d.category === 'ghosts_elves') {
    P.add(figLathe([[0, 0], [1.6, 0], [1.4, h * 0.35], [1.0, h * 0.72], [0.4, h * 0.8], [0, h * 0.8]], 14), 0x1d1d23, 0.7, 0, 0);
    P.add(figXf(new THREE.SphereGeometry(h * 0.075, 12, 8), [0, h * 0.89, 0]), 0xeab896, 0.6, 0, 0);
    P.add(figXf(new THREE.TorusGeometry(1.2, 0.18, 6, 16), [0, h * 0.74, 0], [Math.PI / 2, 0, 0]), tint, 0.6, 0, 0);
  } else if (d.category === 'creatures' || d.category === 'pets') {
    P.add(figXf(new THREE.SphereGeometry(1, 14, 10), [0, h * 0.45, 0], [0, 0, 0], [h * 0.28, h * 0.42, h * 0.4]), tint, 0.6, 0, 0.2);
    P.add(figXf(new THREE.SphereGeometry(h * 0.18, 12, 8), [0, h * 0.85, h * 0.12]), tint, 0.6, 0, 0.2);
  } else {
    P.add(figLathe([[0, 0], [1.4, 0], [1.2, h * 0.2], [0.6, h * 0.5], [1.3, h * 0.85], [0, h]], 14), tint, 0.35, 0.6, 0.5);
  }
  return P.build();
}

/* ---- per-design geometry store ------------------------------------------------------------------ */

/** id -> { lods: [entry, entry, entry], baked, ghost, materials }; entry = figDecodeBlock() result. */
const FIG_GEO = {};
const FIG_LOAD = { started: false, done: false, loaded: 0, failed: [], total: 0, listeners: new Set(), promise: null, resolve: null, ms: 0 };

function figGeo(id) {
  let g = FIG_GEO[id];
  if (!g) {
    const ph = figPlaceholderFor(id);
    g = FIG_GEO[id] = { lods: [ph, ph, ph], baked: false, ghost: !!FIG_BY_ID[id].translucent, level: '' };
  }
  return g;
}

const figPlaceholderCache = new Map();

/** The placeholder of a design, shared by every content type of the same mesh (500 stress types, 96 meshes). */
function figPlaceholderFor(id) {
  const d = FIG_BY_ID[id];
  const key = d.mesh || id;
  let ph = figPlaceholderCache.get(key);
  if (!ph) {
    ph = figPlaceholder(FIG_BY_ID[key] || d);
    figPlaceholderCache.set(key, ph);
  }
  return ph;
}

/**
 * Starts fetching every baked design (3 at a time, cheapest-first by shelf order). Never rejects. In pack mode
 * (figUseStream, 28-figures-stream.js) the district packs are loaded through the decode worker instead.
 */
function figStartLoading() {
  if (FIG_LOAD.started) return FIG_LOAD.promise;
  if (typeof FIG_STREAM !== 'undefined' && FIG_STREAM.mode === 'packs') return figStreamStart();
  FIG_LOAD.started = true;
  FIG_LOAD.promise = new Promise((res) => {
    FIG_LOAD.resolve = res;
  });
  const ids = FIG_DESIGNS.map((d) => d.id).filter((id) => typeof FIG_BAKED_META !== 'undefined' && FIG_BAKED_META[id]);
  FIG_LOAD.total = ids.length;
  const t0 = performance.now();
  let next = 0;
  let active = 0;
  const finish = () => {
    if (FIG_LOAD.done) return;
    FIG_LOAD.done = true;
    FIG_LOAD.ms = Math.round(performance.now() - t0);
    for (const l of FIG_LOAD.listeners) l.onAllLoaded?.();
    FIG_LOAD.resolve(FIG_LOAD.loaded);
  };
  const pump = () => {
    while (active < 3 && next < ids.length) {
      const id = ids[next++];
      active++;
      fetch(FIG_BAKED_URL + id + '.json')
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then((json) => figAcceptBaked(id, json))
        .catch((err) => {
          FIG_LOAD.failed.push(id);
          console.warn('[figures] baked figure failed', id, err);
        })
        .finally(() => {
          active--;
          if (next >= ids.length && active === 0) finish();
          else pump();
        });
    }
  };
  if (!ids.length) finish();
  else pump();
  return FIG_LOAD.promise;
}

/** Resolves (never rejects) once every baked figure has arrived or failed; the page may await it while loading. */
function figWhenLoaded() {
  return figStartLoading();
}

function figAcceptBaked(id, json) {
  const lods = [figDecodeBlock(json, json.materials, false)];
  const blocks = json.lods || [];
  lods.push(blocks[0] ? figDecodeBlock(blocks[0], json.materials, false) : lods[0]);
  lods.push(blocks[1] ? figDecodeBlock(blocks[1], json.materials, true) : figDecodeBlock(blocks[0] || json, json.materials, true));
  // A tier without CPU copies (PERF-PLAN F3): the full-detail arrays are only needed for the first upload. Nothing that shares
  // them is ever disposed (figDisposeOwn), and the batches build from the mid and far LODs, which stay in memory.
  if (lods[0] !== lods[1] && lods[0] !== lods[2] && !figKeepCpu()) figReleaseAfterUpload(lods[0].geometry);
  const g = figGeo(id);
  g.lods = lods;
  g.baked = true;
  FIG_LOAD.loaded++;
  for (const l of FIG_LOAD.listeners) l.onDesignLoaded?.(id);
}

/** True when CPU copies of uploaded buffers must stay (PC tiers: in-place context restore). W decides per tier. */
function figKeepCpu() {
  try {
    return typeof keepCpuCopies === 'function' ? keepCpuCopies() !== false : true;
  } catch {
    return true;
  }
}

/**
 * Frees a dropped typed array's memory at once (XB-1): a view that spans its whole ArrayBuffer is detached with
 * ArrayBuffer.prototype.transfer(0), so its backing store is released now instead of at the next garbage collection
 * (the world and full-detail figure arrays became tens of MB of dead buffers right at the load peak). Only for arrays
 * nothing else reads any more; where transfer() is missing, the collector frees it as before.
 */
function figFreeArray(a) {
  try {
    const b = a && a.buffer;
    if (b && typeof b.transfer === 'function' && a.byteOffset === 0 && a.byteLength === b.byteLength) b.transfer(0);
  } catch {
    /* left to the garbage collector */
  }
}

/** onUpload callback: drops the CPU array of an attribute once the GPU has it (its byte size is remembered). */
function figReleaseArray() {
  this.figUp = true;
  if (this.array) {
    this.figBytes = this.array.byteLength;
    figFreeArray(this.array);
  }
  this.array = null;
}

/** onUpload callback: marks an attribute as living on the GPU (the figure memory statistics count only those). */
function figMarkUploaded() {
  this.figUp = true;
}

function figReleaseAfterUpload(geometry) {
  for (const k of Object.keys(geometry.attributes)) {
    const a = geometry.attributes[k];
    // Interleaved attributes share their buffer (the region batches' position + handle record).
    (a.isInterleavedBufferAttribute ? a.data : a).onUpload(figReleaseArray);
  }
  if (geometry.index) geometry.index.onUpload(figReleaseArray);
}

/** GPU bytes of an attribute (also after its CPU array was released; 0 while it was never uploaded). */
function figAttrBytes(a) {
  const d = a && a.isInterleavedBufferAttribute ? a.data : a;
  if (!d || !d.figUp) return 0;
  return d.array ? d.array.byteLength : d.figBytes || 0;
}

/**
 * Disposes a geometry's GPU state except what it shares with other geometries: the named attributes (and the index
 * when shareIndex) are detached first, so three.js deletes only this geometry's own buffers and vertex arrays.
 */
function figDisposeOwn(geometry, shared, shareIndex = true) {
  for (const k of shared) if (geometry.attributes[k]) geometry.deleteAttribute(k);
  if (shareIndex) geometry.setIndex(null);
  geometry.dispose();
}

/**
 * DESIGN.md 16.5: geometry of one design without the base, in metres, origin at the base top. Never throws. The metre
 * geometry is made only when `opaque` / `translucent` is read (the loader only needs the side effect of starting the
 * download); it is null when the full-detail arrays were already released after upload.
 */
function buildFigureGeometry(designId) {
  figStartLoading();
  const d = FIG_BY_ID[designId];
  if (!d) throw new Error(`[figures] unknown design ${designId}`);
  const g = figGeo(designId);
  const e = g.lods[0];
  const met = getFigureMetrics(designId);
  const metre = () => {
    if (!e.geometryM) {
      const p = e.geometry.attributes.position;
      if (!p.array) return null;
      const src = e.geometry;
      const geo = new THREE.BufferGeometry();
      const fp = new Float32Array(p.count * 3);
      const m = new THREE.Matrix4().makeScale(FIG_CM, FIG_CM, FIG_CM).multiply(e.dequant);
      for (let v = 0; v < p.count; v++) {
        figV1.set(p.getX(v), p.getY(v), p.getZ(v)).applyMatrix4(m);
        fp[v * 3] = figV1.x;
        fp[v * 3 + 1] = figV1.y;
        fp[v * 3 + 2] = figV1.z;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(fp, 3));
      for (const k of ['aOct', 'aCol', 'aPbr']) geo.setAttribute(k, src.attributes[k]);
      geo.setIndex(src.index);
      geo.computeBoundingSphere();
      e.geometryM = geo;
    }
    return e.geometryM;
  };
  return {
    get opaque() {
      return g.ghost ? null : metre();
    },
    get translucent() {
      return g.ghost ? metre() : null;
    },
    height: met.figH, radius: met.radius, tris: e.tris, baked: g.baked,
  };
}

const figMetricsCache = {};

/** DESIGN.md 16.5: layout and picking metrics in pose space (metres, relative to the base bottom centre). */
function getFigureMetrics(designId) {
  const c = figMetricsCache[designId];
  if (c) return c;
  const d = FIG_BY_ID[designId];
  // Content types (28-figures-stream.js) measure like their mesh design.
  const m = typeof FIG_BAKED_META !== 'undefined' ? FIG_BAKED_META[d.mesh || designId] : null;
  const hCm = m ? m.h : d.nominalH;
  const rCm = m ? Math.min(m.r, Math.max(m.rx, m.rz)) : d.nominalH * 0.22;
  const baseH = d.ownBase ? 0 : FIG_BASE_H;
  const baseR = d.ownBase ? 0 : d.baseR * FIG_MM;
  const figH = hCm * FIG_CM;
  const totalH = baseH + figH;
  const radius = Math.max(baseR, rCm * FIG_CM);
  const pickR = Math.max(0.05 * FIG_SCALE, Math.min(0.12 * FIG_SCALE, 0.5 * Math.hypot(totalH, radius * 2)));
  const res = { totalH, figH, baseR, baseH, radius, centerY: totalH * 0.5, pickR };
  figMetricsCache[designId] = res;
  return res;
}

/**
 * Enamel ring colour (hex), medallion atlas cell and shimmer slot of a design: a content type shows its district's
 * colour and symbol (28-figures-stream.js), a shop design its legacy category (towers and specials: cell and slot 0,
 * as before).
 */
function figBaseLook(d) {
  if (d.districtLook !== undefined && d.districtLook !== null && typeof FIG_DISTRICTS !== 'undefined' && FIG_DISTRICTS[d.districtLook]) {
    const k = FIG_DISTRICTS[d.districtLook];
    return { color: k.color, cell: k.atlas, shimmer: 16 + k.index };
  }
  const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]];
  if (cat) return { color: cat.color, cell: cat.index, shimmer: cat.index };
  const house = d.house ? FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.house]] : null;
  return { color: house ? house.color : '#8e8169', cell: 0, shimmer: 0 };
}

/* ---- category symbols ------------------------------------------------------------------------- */

/** Draws a category symbol into a 2D canvas: (x, y) = top-left corner, size = edge length in px. */
function drawCategorySymbol(ctx, key, x, y, size, opts = {}) {
  const path = FIG_SYMBOL_PATHS[key];
  if (!path) return;
  const pad = opts.padding || 0;
  const s = (size - pad * 2) / 24;
  ctx.save();
  ctx.translate(x + pad, y + pad);
  ctx.scale(s, s);
  const p = new Path2D(path);
  const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[key]];
  if (cat && cat.symbolStyle === 'stroke') {
    ctx.strokeStyle = opts.color || '#ffffff';
    ctx.lineWidth = (opts.lineWidth || size / 15) / s;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke(p);
  } else {
    ctx.fillStyle = opts.color || '#ffffff';
    ctx.fill(p, 'evenodd');
  }
  ctx.restore();
}

let figAtlasTex = null;

/**
 * 1024 x 512 symbol atlas: 8 x 4 cells of 128 px, white symbols on black: cells 0-9 the legacy shop categories (cell =
 * category index), cells 16-25 the districts (FIG_DISTRICTS[].atlas). Stored as a
 * single-channel R8 texture (the shader reads .r; 0.7 MB with mipmaps instead of 2.8 MB) whose rows are flipped like
 * a canvas upload; the drawing canvas is released right away (PERF-PLAN F3).
 */
function figSymbolAtlas() {
  if (figAtlasTex) return figAtlasTex;
  const W = 1024;
  const H = 512;
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  for (const cat of FIG_CATEGORIES) {
    const cx = (cat.index % 8) * 128;
    const cy = Math.floor(cat.index / 8) * 128;
    drawCategorySymbol(ctx, cat.key, cx, cy, 128, { color: '#fff', padding: 14, lineWidth: 128 / 11 });
  }
  if (typeof FIG_DISTRICTS !== 'undefined') {
    for (const d of FIG_DISTRICTS) drawCategorySymbol(ctx, `district_${d.key}`, (d.atlas % 8) * 128, Math.floor(d.atlas / 8) * 128, 128, { color: '#fff', padding: 14 });
  }
  const rgba = ctx.getImageData(0, 0, W, H).data;
  const r8 = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    const src = (H - 1 - y) * W * 4;
    const dst = y * W;
    for (let x = 0; x < W; x++) r8[dst + x] = rgba[src + x * 4];
  }
  c.width = 0;
  c.height = 0;
  figAtlasTex = new THREE.DataTexture(r8, W, H, THREE.RedFormat, THREE.UnsignedByteType);
  figAtlasTex.name = 'fig:symbol-atlas';
  figAtlasTex.colorSpace = THREE.NoColorSpace;
  figAtlasTex.anisotropy = 4;
  figAtlasTex.generateMipmaps = true;
  figAtlasTex.minFilter = THREE.LinearMipmapLinearFilter;
  figAtlasTex.magFilter = THREE.LinearFilter;
  figAtlasTex.needsUpdate = true;
  figAtlasTex.figBytes = Math.round(W * H * 4 / 3);
  if (!figKeepCpu()) {
    figAtlasTex.onUpdate = (t) => {
      t.image = { data: null, width: W, height: H };
    };
  }
  return figAtlasTex;
}

/* ---- 23-figures-mat.js ---- */
/* ==== 23-figures-mat.js — figure materials: the shared painted-resin material (TECHNIQUE.md 10), the ghost material
   and the base material (category enamel band + embossed-looking gold symbol from the atlas). All read the packed
   attributes; per instance `figInst` = (aim rim highlight, glow (unused since the Lumos removal: always 0), flash, shelf shimmer).

   Variants (PERF-PLAN F2 / F8, at most 10 programs per tier):
   - figure0  full detail (LOD0), double-sided (open cloth backs); clearcoat (Physical) only on the Magas tier
   - figureLod  mid and far LODs drawn instanced, front faces only, Standard
   - figureBatch  region batches (27-figures-perf.js): world-space transform and effects come from the per-handle
     transform texture (`aHid` per vertex); the batch also carries the bases (part 1) and draws them with the base look
   - base0 / baseStd  instanced bases (Physical on LOD0 only on Magas), glass / glassBatch for translucent figures,
     ghost depth pre-pass (instanced and batch) and the aim outline. ==== */

const FIG_MATERIALS = {};
/**
 * Shared uniforms: animation time (shimmer), the ghost opacity, the per-handle transform texture of the region batches
 * and the quantisation box of the batch base parts (bake cm), which the medallion symbol lookup needs.
 */
const FIG_UNIFORMS = {
  time: { value: 0 }, ghostAlpha: { value: 1 }, xf: { value: null },
  baseQMin: { value: new THREE.Vector3(0, 0, 0) }, baseQSize: { value: new THREE.Vector3(1, 1, 1) },
  /** Pixel height of the target the per-vertex lit batches are drawn into, and the factor on their geometry roughness
   *  (vertex curvature x pixel footprint; 0.7 matched three's per-pixel geometryRoughness best on the proxy). */
  pxH: { value: 1080 },
  geoK: { value: 0.7 },
};

/**
 * Aim highlight (figInst.x, 0..1): a warm fresnel rim that reads as a glowing outline, plus a slight overall lift so
 * the targeted figurine stands out in a heap. Inserted after <emissivemap_fragment>, where `normal` is final.
 */
const FIG_RIM_GLSL = [
  'if (vFigInst.x > 0.001) {',
  '  float figRimF = 1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0);',
  '  float figRim2 = figRimF * figRimF;',
  '  totalEmissiveRadiance += vFigInst.x * vec3(1.0, 0.74, 0.28) * (0.03 + 0.35 * figRim2 + 0.9 * figRim2 * figRim2);',
  '}',
].join('\n');

const FIG_SHADER_VERT_HEAD = [
  'attribute vec2 aOct;',
  'attribute vec4 aCol;',
  'attribute vec4 aPbr;',
  'varying vec4 vFigCol;',
  'varying vec4 vFigPbr;',
  'varying vec4 vFigInst;',
  'vec3 figOctDecode(vec2 e) {',
  '  vec3 v = vec3(e, 1.0 - abs(e.x) - abs(e.y));',
  '  if (v.z < 0.0) v.xy = (1.0 - abs(v.yx)) * vec2(v.x >= 0.0 ? 1.0 : -1.0, v.y >= 0.0 ? 1.0 : -1.0);',
  '  return normalize(v);',
  '}',
].join('\n');

/**
 * Batch vertex header: aHid = handle * 4 + part (0 far figure, 1 far base, 2 mid figure, 3 mid base; odd = base), read
 * as a normalised u16 (the w of the interleaved u16x4 position record, XB-7: a native vertex format on D3D11). The
 * transform texture holds per handle 16 texels in one row: the matrix rows of the 4 parts (part * 3 .. + 2), effects
 * (12: rim, glow, flash, shimmer) and the category (13: enamel ring colour linear rgb, category index). A zero matrix
 * collapses the part (the handle is drawn by another batch or instanced).
 */
const FIG_BATCH_VERT_HEAD = [
  'attribute float aHid;',
  'uniform highp sampler2D uFigXf;',
  'uniform vec3 uFigBaseQMin;',
  'uniform vec3 uFigBaseQSize;',
  'vec4 figXfTexel(int hnd, int k) {',
  '  return texelFetch(uFigXf, ivec2((hnd % 32) * 16 + k, hnd / 32), 0);',
  '}',
  'mat4 figXfMatrix(int hnd, int part) {',
  '  vec4 r0 = figXfTexel(hnd, part * 3);',
  '  vec4 r1 = figXfTexel(hnd, part * 3 + 1);',
  '  vec4 r2 = figXfTexel(hnd, part * 3 + 2);',
  '  return mat4(r0.x, r1.x, r2.x, 0.0, r0.y, r1.y, r2.y, 0.0, r0.z, r1.z, r2.z, 0.0, r0.w, r1.w, r2.w, 1.0);',
  '}',
].join('\n');

/** Batch transform of position (and of the normal, exactly like three.js does it for an instance matrix). */
const FIG_BATCH_NORMAL = [
  'int figId = int(aHid * 65535.0 + 0.5);',
  'int figHnd = figId / 4;',
  'int figPart = figId - figHnd * 4;',
  'mat4 figM = figXfMatrix(figHnd, figPart);',
  'mat3 figIm = mat3(figM);',
  'vec3 objectNormal = figOctDecode(aOct);',
  'objectNormal /= max(vec3(dot(figIm[0], figIm[0]), dot(figIm[1], figIm[1]), dot(figIm[2], figIm[2])), vec3(1e-20));',
  'objectNormal = figIm * objectNormal;',
].join('\n');

/**
 * Base look (enamel band in the category colour, medallion symbol from the atlas). `gate` selects base fragments:
 * 'true' for the instanced base material, the part varying for the batch material (figures and bases in one draw).
 */
function figBaseColorGlsl(gate) {
  const D = FIG_BASE_DIM;
  return [
    `if (${gate}) {`,
    '  figIsBase = 1.0;',
    '  figRing = step(0.9, vFigPbr.a);',
    '  figMed = step(0.4, vFigPbr.a) * (1.0 - figRing);',
    '  if (figMed > 0.5) {',
    `    vec2 lu = vec2(vFigLocal.x / ${(2 * D.medR).toFixed(4)} + 0.5, (vFigLocal.y - ${D.medY.toFixed(4)}) / ${(2 * D.medR).toFixed(4)} + 0.5);`,
    '    lu = clamp(lu, 0.02, 0.98);',
    '    float cell = floor(vFigBaseCat.w + 0.5);',
    '    vec2 au = vec2((mod(cell, 8.0) + lu.x) / 8.0, 1.0 - (floor(cell / 8.0) + 1.0) * 0.25 + lu.y * 0.25);',
    '    figSym = smoothstep(0.35, 0.65, texture2D(uFigAtlas, au).r);',
    '  }',
    '  figLin = mix(figLin, vFigBaseCat.rgb, figRing);',
    '  figLin = mix(figLin, vec3(0.80, 0.56, 0.24), figSym);',
    '}',
  ].join('\n');
}

/**
 * Patches a MeshStandardMaterial / MeshPhysicalMaterial for the packed layout. kind: 'figure' | 'ghost' | 'base';
 * batch: region-batch variant (transform texture). aPbr.a: figures = back-face AO (0..200) or glow (201..255);
 * bases = 1.0 enamel ring, 0.5 medallion field.
 */
function figPatchMaterial(mat, kind, batch = false) {
  const baseCode = kind === 'base' || (batch && kind === 'figure');
  const gate = kind === 'base' ? 'true' : 'vFigPart > 0.5';
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uFigTime = FIG_UNIFORMS.time;
    if (baseCode) sh.uniforms.uFigAtlas = { value: figSymbolAtlas() };
    if (batch) {
      sh.uniforms.uFigXf = FIG_UNIFORMS.xf;
      sh.uniforms.uFigBaseQMin = FIG_UNIFORMS.baseQMin;
      sh.uniforms.uFigBaseQSize = FIG_UNIFORMS.baseQSize;
    }
    let vHead = FIG_SHADER_VERT_HEAD;
    if (batch) vHead += `\n${FIG_BATCH_VERT_HEAD}`;
    else vHead += '\nattribute vec4 figInst;';
    if (kind === 'base') vHead += '\nattribute vec4 figBaseCat;\nvarying vec4 vFigBaseCat;\nvarying vec3 vFigLocal;';
    if (batch && kind === 'figure') vHead += '\nvarying vec4 vFigBaseCat;\nvarying vec3 vFigLocal;\nvarying float vFigPart;';
    const begin = [];
    if (batch) {
      begin.push('vec3 transformed = (figM * vec4(position, 1.0)).xyz;', 'vFigInst = figXfTexel(figHnd, 12);');
      if (kind === 'figure') {
        begin.push('vFigPart = float(figPart % 2);', 'vFigBaseCat = figXfTexel(figHnd, 13);', 'vFigLocal = uFigBaseQMin + position * uFigBaseQSize;');
      }
    } else {
      begin.push('#include <begin_vertex>', 'vFigInst = figInst;');
    }
    begin.push('vFigCol = aCol;', 'vFigPbr = aPbr;');
    if (kind === 'base') begin.push('vFigBaseCat = figBaseCat;', 'vFigLocal = position;');
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>\n${vHead}`)
      .replace('#include <beginnormal_vertex>', batch ? FIG_BATCH_NORMAL : 'vec3 objectNormal = figOctDecode(aOct);')
      .replace('#include <begin_vertex>', begin.join('\n'));
    const fHead = [
      'varying vec4 vFigCol;',
      'varying vec4 vFigPbr;',
      'varying vec4 vFigInst;',
      'uniform float uFigTime;',
    ];
    if (baseCode) fHead.push('varying vec4 vFigBaseCat;', 'varying vec3 vFigLocal;', 'uniform sampler2D uFigAtlas;');
    if (batch && kind === 'figure') fHead.push('varying float vFigPart;');
    const emissive = [];
    if (baseCode) {
      emissive.push(
        /* bases: a gentle self-lit lift on the enamel band so dark category colours (Ravenclaw blue, Hallows black)
           still read on the black lacquer at TV distance */
        'if (figIsBase > 0.5) totalEmissiveRadiance += vFigBaseCat.rgb * figRing * 0.45 + vec3(0.02) * figRing;',
        'else totalEmissiveRadiance += figLin * max(figPa - 200.0, 0.0) / 55.0 * 2.2;',
      );
    } else emissive.push('totalEmissiveRadiance += figLin * max(figPa - 200.0, 0.0) / 55.0 * 2.2;');
    if (kind === 'ghost') emissive.push('totalEmissiveRadiance += figLin * 0.22;');
    emissive.push('vec4 figFx = vFigInst;');
    // Batch bases take half the glow and flash of their figure and no shimmer (as the instanced bases are written).
    if (batch && kind === 'figure') emissive.push('figFx *= mix(vec4(1.0), vec4(1.0, 0.5, 0.5, 0.0), figIsBase);');
    // The gold marker (a glow above 1.2) is not a glow.
    emissive.push('figFx.y *= 1.0 - step(1.2, figFx.y);', 'totalEmissiveRadiance += diffuseColor.rgb * figGold * 0.2;');
    emissive.push(
      'totalEmissiveRadiance += figFx.y * vec3(1.0, 0.82, 0.45) * 0.55 + figFx.z * vec3(1.2);',
      'totalEmissiveRadiance += figFx.w * vec3(1.0, 0.78, 0.35) * 0.6 * (0.5 + 0.5 * sin(uFigTime * 6.0 + vViewPosition.y * 40.0));',
      FIG_RIM_GLSL,
    );
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', ['#include <common>', ...fHead].join('\n'))
      .replace('#include <color_fragment>', [
        '#include <color_fragment>',
        /* clamp: with MSAA the varyings are extrapolated at triangle edges, and pow() of a negative base gives NaN, which
           the bloom blur would then smear over the whole frame */
        'vec3 figSrgb = clamp(vFigCol.rgb, 0.0, 1.0);',
        'vec3 figLin = mix(figSrgb / 12.92, pow((figSrgb + 0.055) / 1.055, vec3(2.4)), step(0.04045, figSrgb));',
        'float figPa = vFigPbr.a * 255.0;',
        'float figIsBase = 0.0;',
        'float figRing = 0.0;',
        'float figMed = 0.0;',
        'float figSym = 0.0;',
        baseCode ? figBaseColorGlsl(gate) : '',
        kind === 'ghost' ? 'figLin = mix(figLin, vec3(0.62, 0.74, 1.0), 0.55);' : '',
        'diffuseColor.rgb *= figLin;',
        // Gold display edition (A Gyűjtő Csarnoka, NOTES-ending.md): a glow value above 1.2 marks the handle as solid gold.
        'float figGold = step(1.2, vFigInst.y);',
        'if (figGold > 0.5) { float figGl = dot(figLin, vec3(0.3, 0.55, 0.15)); diffuseColor.rgb = mix(vec3(0.32, 0.2, 0.05), vec3(1.0, 0.77, 0.34), clamp(pow(figGl, 0.42) * 1.35, 0.0, 1.0)); }',
      ].join('\n'))
      .replace('#include <roughnessmap_fragment>', [
        '#include <roughnessmap_fragment>',
        'roughnessFactor = max(vFigPbr.x, 0.04);',
        baseCode ? 'roughnessFactor = mix(roughnessFactor, 0.22, figSym);' : '',
        'roughnessFactor = mix(roughnessFactor, 0.3, figGold);',
      ].join('\n'))
      .replace('#include <metalnessmap_fragment>', [
        '#include <metalnessmap_fragment>',
        'metalnessFactor = vFigPbr.y;',
        baseCode ? 'metalnessFactor = mix(metalnessFactor, 1.0, figSym);' : '',
        'metalnessFactor = mix(metalnessFactor, 0.72, figGold);',
      ].join('\n'))
      .replace('#include <normal_fragment_maps>', [
        '#include <normal_fragment_maps>',
        baseCode ? 'if (figMed > 0.5) { vec2 g = vec2(dFdx(figSym), dFdy(figSym)); normal = normalize(normal - vec3(g * 1.4, 0.0)); }' : '',
      ].join('\n'))
      .replace('#include <lights_physical_fragment>', [
        '#include <lights_physical_fragment>',
        '#ifdef USE_CLEARCOAT',
        'material.clearcoat = vFigPbr.z * (1.0 - figSym);',
        '#endif',
      ].join('\n'))
      .replace('#include <aomap_fragment>', [
        '#include <aomap_fragment>',
        '{',
        '  float bakedAo = figIsBase > 0.5 ? 1.0 : clamp(gl_FrontFacing ? vFigCol.a : min(figPa / 200.0, 1.0), 0.0, 1.0);',
        '  reflectedLight.indirectDiffuse *= bakedAo;',
        '  float bakedNV = saturate(dot(geometryNormal, geometryViewDir));',
        '  reflectedLight.indirectSpecular *= computeSpecularOcclusion(bakedNV, bakedAo, material.roughness);',
        '  float bakedDirect = mix(1.0, bakedAo, 0.4);',
        '  reflectedLight.directDiffuse *= bakedDirect;',
        '  reflectedLight.directSpecular *= bakedDirect;',
        '  float matt = smoothstep(0.62, 0.9, vFigPbr.x);',
        '  reflectedLight.indirectSpecular *= mix(1.0, 0.2, matt);',
        '  reflectedLight.directSpecular *= mix(1.0, 0.4, matt);',
        '  #ifdef USE_CLEARCOAT',
        '    clearcoatSpecularIndirect *= mix(1.0, bakedAo, 0.85);',
        '    clearcoatSpecularDirect *= bakedDirect;',
        '  #endif',
        '}',
      ].join('\n'))
      .replace('#include <emissivemap_fragment>', ['#include <emissivemap_fragment>', ...emissive].join('\n'));
    if (kind === 'ghost') {
      sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', [
        '#include <opaque_fragment>',
        '{',
        '  float fr = pow(clamp(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 2.0);',
        '  gl_FragColor.rgb += vec3(0.45, 0.6, 1.0) * fr * 0.45;',
        '  gl_FragColor.a = clamp(0.34 + 0.6 * fr, 0.0, 0.92);',
        '}',
      ].join('\n'));
    }
  };
  mat.customProgramCacheKey = () => `fig-packed-${kind}${batch ? '-batch' : ''}-v3`;
  return mat;
}

/**
 * Region batches lit per vertex (integration, PERF-PLAN 2.2 GPU budgets). A batched figurine is drawn at the mid or far
 * LOD only while it is below the full-detail height (Könnyű 200 px), so its 600-2600 triangles cover 1-5 px each; the
 * per-pixel physical shading of those micro-triangles (quad overshading, IBL lookups) was about half of the figure GPU
 * time on the UHD 630 proxy. The same lighting (three's physical BRDF, point / spot / directional / hemisphere lights,
 * the PMREM, F's baked AO, the matt and emissive terms) is evaluated at the vertices; the fragment shader applies tone
 * mapping, colour space and fog, and keeps the medallion symbol of the mid base per pixel (the field and the gold
 * symbol are both lit at the vertex and the atlas mask mixes them). three's per-pixel specular anti-aliasing
 * (geometryRoughness, from normal derivatives) is estimated as the vertex curvature (figBatchCurvature) times the
 * world size of a pixel at the vertex. Large figurines (FIG_TIER ppMid / ppFar px) are drawn by the per-pixel twin
 * instead (figPatchPerPixelTwin), where per-vertex highlights and mirror reflections would show. No shadows: the
 * tiers that use it (Könnyű, Közepes) have no shadow casters; the others draw every batched figurine per pixel.
 */
const FIG_VLIT_VERT_HEAD = [
  'uniform vec3 diffuse;',
  'uniform vec3 emissive;',
  'uniform float uFigTime;',
  'uniform float uFigPxH;',
  'uniform float uFigGeoK;',
  'varying vec3 vFigLit;',
  'varying vec3 vFigLit2;',
  'varying float vFigMed;',
  '#include <lights_pars_begin>',
  '#include <lights_physical_pars_fragment>',
  '#include <cube_uv_reflection_fragment>',
  '#include <envmap_common_pars_fragment>',
  '#include <envmap_physical_pars_fragment>',
  /* Outgoing radiance of one surface point (view space) without emissive: albedo (linear), roughness including the
     geometry term, metalness, baked AO (1 = none) and the matt factor. */
  'vec3 figVertexLight(vec3 albedo, float rough, float metal, float bakedAo, float matt, vec3 geometryPosition, vec3 geometryNormal, vec3 geometryViewDir) {',
  '  PhysicalMaterial material;',
  '  material.diffuseColor = albedo * (1.0 - metal);',
  '  material.roughness = rough;',
  '  material.specularColor = mix(vec3(0.04), albedo, metal);',
  '  material.specularF90 = 1.0;',
  '  ReflectedLight reflectedLight = ReflectedLight(vec3(0.0), vec3(0.0), vec3(0.0), vec3(0.0));',
  '  vec3 geometryClearcoatNormal = vec3(0.0);',
  '  IncidentLight directLight;',
  '  #if NUM_POINT_LIGHTS > 0',
  '    PointLight pointLight;',
  '    #pragma unroll_loop_start',
  '    for ( int i = 0; i < NUM_POINT_LIGHTS; i ++ ) {',
  '      pointLight = pointLights[ i ];',
  '      getPointLightInfo( pointLight, geometryPosition, directLight );',
  '      RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );',
  '    }',
  '    #pragma unroll_loop_end',
  '  #endif',
  '  #if NUM_SPOT_LIGHTS > 0',
  '    SpotLight spotLight;',
  '    #pragma unroll_loop_start',
  '    for ( int i = 0; i < NUM_SPOT_LIGHTS; i ++ ) {',
  '      spotLight = spotLights[ i ];',
  '      getSpotLightInfo( spotLight, geometryPosition, directLight );',
  '      RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );',
  '    }',
  '    #pragma unroll_loop_end',
  '  #endif',
  '  #if NUM_DIR_LIGHTS > 0',
  '    DirectionalLight directionalLight;',
  '    #pragma unroll_loop_start',
  '    for ( int i = 0; i < NUM_DIR_LIGHTS; i ++ ) {',
  '      directionalLight = directionalLights[ i ];',
  '      getDirectionalLightInfo( directionalLight, directLight );',
  '      RE_Direct( directLight, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );',
  '    }',
  '    #pragma unroll_loop_end',
  '  #endif',
  '  vec3 irradiance = getAmbientLightIrradiance( ambientLightColor );',
  '  #if NUM_HEMI_LIGHTS > 0',
  '    #pragma unroll_loop_start',
  '    for ( int i = 0; i < NUM_HEMI_LIGHTS; i ++ ) {',
  '      irradiance += getHemisphereLightIrradiance( hemisphereLights[ i ], geometryNormal );',
  '    }',
  '    #pragma unroll_loop_end',
  '  #endif',
  '  vec3 iblIrradiance = vec3(0.0);',
  '  vec3 radiance = vec3(0.0);',
  '  #if defined( USE_ENVMAP ) && defined( ENVMAP_TYPE_CUBE_UV )',
  '    iblIrradiance += getIBLIrradiance( geometryNormal );',
  '    radiance += getIBLRadiance( geometryViewDir, geometryNormal, material.roughness );',
  '  #endif',
  '  RE_IndirectDiffuse( irradiance, geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );',
  '  RE_IndirectSpecular( radiance, iblIrradiance, vec3(0.0), geometryPosition, geometryNormal, geometryViewDir, geometryClearcoatNormal, material, reflectedLight );',
  // F's baked AO and matt terms (aomap_fragment of the per-pixel material; front faces only).
  '  reflectedLight.indirectDiffuse *= bakedAo;',
  '  float bakedNV = saturate(dot(geometryNormal, geometryViewDir));',
  '  reflectedLight.indirectSpecular *= computeSpecularOcclusion(bakedNV, bakedAo, material.roughness);',
  '  float bakedDirect = mix(1.0, bakedAo, 0.4);',
  '  reflectedLight.directDiffuse *= bakedDirect;',
  '  reflectedLight.directSpecular *= bakedDirect;',
  '  reflectedLight.indirectSpecular *= mix(1.0, 0.2, matt);',
  '  reflectedLight.directSpecular *= mix(1.0, 0.4, matt);',
  '  return reflectedLight.directDiffuse + reflectedLight.indirectDiffuse + reflectedLight.directSpecular + reflectedLight.indirectSpecular;',
  '}',
].join('\n');

const FIG_VLIT_VERT_MAIN = [
  '{',
  '  vec3 figN = normalize(transformedNormal);',
  '  vec3 figVd = normalize(-mvPosition.xyz);',
  '  vec3 figSrgb = clamp(aCol.rgb, 0.0, 1.0);',
  '  vec3 figLin = mix(figSrgb / 12.92, pow((figSrgb + 0.055) / 1.055, vec3(2.4)), step(0.04045, figSrgb));',
  '  float figIsBase = float(figPart - (figPart / 2) * 2);',
  '  float figRing = figIsBase * step(0.9, aPbr.a);',
  '  float figMedV = figIsBase * step(0.4, aPbr.a) * (1.0 - figRing);',
  '  vec4 figCat = figXfTexel(figHnd, 13);',
  '  figLin = mix(figLin, figCat.rgb, figRing);',
  '  float figPx = max(-mvPosition.z, 0.0) * 2.0 / (projectionMatrix[1][1] * max(uFigPxH, 1.0));',
  // three's geometryRoughness (normal change per pixel) = the vertex curvature (aPbr.z, rad per metre / 4) x footprint.
  '  float figGeoR = aPbr.z * 1020.0 * figPx * uFigGeoK;',
  '  float figAo = figIsBase > 0.5 ? 1.0 : clamp(aCol.a, 0.0, 1.0);',
  '  float figMatt = smoothstep(0.62, 0.9, aPbr.x);',
  '  float figRough = min(max(max(aPbr.x, 0.04), 0.0525) + figGeoR, 1.0);',
  // Gold display edition (a glow above 1.2, NOTES-ending.md): solid gold, polished metal.
  '  float figGold = step(1.2, vFigInst.y);',
  '  float figMetal = aPbr.y;',
  '  if (figGold > 0.5) { float figGl = dot(figLin, vec3(0.3, 0.55, 0.15)); figLin = mix(vec3(0.32, 0.2, 0.05), vec3(1.0, 0.77, 0.34), clamp(pow(figGl, 0.42) * 1.35, 0.0, 1.0)); figRough = 0.32; figMetal = 0.72; }',
  '  vFigLit = figVertexLight(diffuse * figLin, figRough, figMetal, figAo, figMatt, mvPosition.xyz, figN, figVd);',
  '  vFigMed = figMedV;',
  '  vFigLit2 = vFigLit;',
  // The medallion field also gets the gold symbol lit; the fragment shader mixes the two by the atlas mask.
  '  if (figMedV > 0.5) vFigLit2 = figVertexLight(diffuse * vec3(0.80, 0.56, 0.24), min(0.2725 + figGeoR, 1.0), 1.0, 1.0, figMatt, mvPosition.xyz, figN, figVd);',
  // Emissive terms (emissivemap_fragment of the per-pixel material).
  '  vec3 figEm = emissive;',
  '  if (figIsBase > 0.5) figEm += figCat.rgb * figRing * 0.45 + vec3(0.02) * figRing;',
  '  else figEm += figLin * max(aPbr.a * 255.0 - 200.0, 0.0) / 55.0 * 2.2;',
  '  vec4 figFx = vFigInst * mix(vec4(1.0), vec4(1.0, 0.5, 0.5, 0.0), figIsBase);',
  '  figFx.y *= 1.0 - step(1.2, figFx.y);',
  '  figEm += figLin * figGold * 0.2;',
  '  figEm += figFx.y * vec3(1.0, 0.82, 0.45) * 0.55 + figFx.z * vec3(1.2);',
  '  figEm += figFx.w * vec3(1.0, 0.78, 0.35) * 0.6 * (0.5 + 0.5 * sin(uFigTime * 6.0 - mvPosition.y * 40.0));',
  '  if (figFx.x > 0.001) {',
  '    float figRimF = 1.0 - clamp(abs(dot(figN, figVd)), 0.0, 1.0);',
  '    float figRim2 = figRimF * figRimF;',
  '    figEm += figFx.x * vec3(1.0, 0.74, 0.28) * (0.03 + 0.35 * figRim2 + 0.9 * figRim2 * figRim2);',
  '  }',
  '  vFigLit += figEm;',
  '  vFigLit2 += figEm;',
  '}',
].join('\n');

/** Fragment stage: the vertex light, the medallion symbol mask of the mid base (as figBaseColorGlsl), the frame chunks. */
function figVlitFragMain() {
  const D = FIG_BASE_DIM;
  return [
    'void main() {',
    '  vec4 diffuseColor = vec4( 1.0 );',
    '  vec3 outgoingLight = vFigLit;',
    '  if (vFigMed > 0.5) {',
    `    vec2 lu = vec2(vFigLocal.x / ${(2 * D.medR).toFixed(4)} + 0.5, (vFigLocal.y - ${D.medY.toFixed(4)}) / ${(2 * D.medR).toFixed(4)} + 0.5);`,
    '    lu = clamp(lu, 0.02, 0.98);',
    '    float cell = floor(vFigBaseCat.w + 0.5);',
    '    vec2 au = vec2((mod(cell, 8.0) + lu.x) / 8.0, 1.0 - (floor(cell / 8.0) + 1.0) * 0.25 + lu.y * 0.25);',
    '    float figSym = smoothstep(0.35, 0.65, texture2D(uFigAtlas, au).r);',
    '    outgoingLight = mix(vFigLit, vFigLit2, figSym);',
    '  }',
    '  #include <opaque_fragment>',
    '  #include <tonemapping_fragment>',
    '  #include <colorspace_fragment>',
    '  #include <fog_fragment>',
    '  #include <premultiplied_alpha_fragment>',
    '  #include <dithering_fragment>',
    '}',
  ].join('\n');
}

/**
 * Turns a batch figure material (figPatchMaterial(mat, 'figure', true)) into the per-pixel twin of the per-vertex lit
 * batches: it draws only the handles whose shading path (transform texel 14) is per pixel and collapses the others.
 */
function figPatchPerPixelTwin(mat) {
  const inner = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, renderer) => {
    inner(sh, renderer);
    // Members of the per-vertex draw leave right away (one texel fetch per collapsed vertex).
    sh.vertexShader = sh.vertexShader.replace('mat4 figM = figXfMatrix(figHnd, figPart);', [
      'if (figXfTexel(figHnd, 14).x < 0.5) { gl_Position = vec4(0.0, 0.0, -2.0, 1.0); return; }',
      'mat4 figM = figXfMatrix(figHnd, figPart);',
    ].join('\n'));
  };
  mat.customProgramCacheKey = () => 'fig-packed-figure-batch-pp-v2';
  return mat;
}

/**
 * Turns a batch figure material (figPatchMaterial(mat, 'figure', true)) into the per-vertex lit batch variant. The
 * PMREM defines that three only gives the fragment stage are added to the vertex stage from the program parameters
 * (envMapCubeUVHeight), exactly as three computes them.
 */
function figPatchVertexLit(mat) {
  const inner = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, renderer) => {
    inner(sh, renderer);
    sh.uniforms.uFigPxH = FIG_UNIFORMS.pxH;
    sh.uniforms.uFigGeoK = FIG_UNIFORMS.geoK;
    let defs = '';
    const h = sh.envMap ? sh.envMapCubeUVHeight : null;
    if (h) {
      const maxMip = Math.log2(h) - 2;
      const texelWidth = 1.0 / (3 * Math.max(Math.pow(2, maxMip), 7 * 16));
      defs = ['#define ENVMAP_TYPE_CUBE_UV', `#define CUBEUV_TEXEL_WIDTH ${texelWidth}`, `#define CUBEUV_TEXEL_HEIGHT ${1.0 / h}`, `#define CUBEUV_MAX_MIP ${maxMip}.0`].join('\n');
    }
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `${defs}\n#include <common>\n${FIG_VLIT_VERT_HEAD}`)
      // Members of the per-pixel twin leave right away (one texel fetch per collapsed vertex).
      .replace('mat4 figM = figXfMatrix(figHnd, figPart);', [
        'if (figXfTexel(figHnd, 14).x > 0.5) { gl_Position = vec4(0.0, 0.0, -2.0, 1.0); return; }',
        'mat4 figM = figXfMatrix(figHnd, figPart);',
      ].join('\n'))
      .replace('#include <fog_vertex>', `#include <fog_vertex>\n${FIG_VLIT_VERT_MAIN}`);
    const at = sh.fragmentShader.indexOf('void main() {');
    sh.fragmentShader = sh.fragmentShader.slice(0, at).replace('#include <common>', '#include <common>\nvarying vec3 vFigLit;\nvarying vec3 vFigLit2;\nvarying float vFigMed;')
      + figVlitFragMain();
  };
  mat.customProgramCacheKey = () => 'fig-packed-figure-batch-vlit-v5';
  return mat;
}

/** Before each per-vertex lit batch draw: the pixel height of the target (dynamic resolution, composer target). */
function figVlitBeforeRender(renderer) {
  const rt = renderer.getRenderTarget();
  FIG_UNIFORMS.pxH.value = rt ? rt.height : renderer.getContext().drawingBufferHeight;
}

/**
 * kind: 'figure' | 'ghost' | 'base'; side: THREE.DoubleSide only for the full-detail figure (robes, sleeves and cloaks
 * are open cloth sheets with their own back-face AO; the mid and far LODs are closed enough for front faces only).
 */
function figMakeMaterial(kind, physical, side = THREE.FrontSide, batch = false, name = '') {
  const common = { roughness: 0.5, metalness: 0, envMapIntensity: 1.0, side };
  let m;
  if (kind === 'ghost') m = new THREE.MeshStandardMaterial({ ...common, transparent: true, depthWrite: true });
  else if (physical) m = new THREE.MeshPhysicalMaterial({ ...common, clearcoat: 1, clearcoatRoughness: 0.12 });
  else m = new THREE.MeshStandardMaterial(common);
  m.name = name;
  return figPatchMaterial(m, kind, batch);
}

/**
 * Depth-only pre-pass for translucent figures (ghosts, the cloak): drawn just before the ghost colour pass (both in
 * the transparent list), so only the frontmost ghost surface is shaded and inner faces no longer shine through as
 * hard-edged shards. `batch`: the region-batch variant (transform texture).
 */
function figGhostDepthMaterial(batch = false) {
  const key = batch ? 'ghostDepthBatch' : 'ghostDepth';
  if (!FIG_MATERIALS[key]) {
    const m = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true, transparent: true, side: THREE.FrontSide });
    m.name = `fig:${key}`;
    if (batch) {
      m.onBeforeCompile = (sh) => {
        sh.uniforms.uFigXf = FIG_UNIFORMS.xf;
        sh.uniforms.uFigBaseQMin = FIG_UNIFORMS.baseQMin;
        sh.uniforms.uFigBaseQSize = FIG_UNIFORMS.baseQSize;
        sh.vertexShader = sh.vertexShader
          .replace('#include <common>', `#include <common>\n${FIG_BATCH_VERT_HEAD}`)
          .replace('#include <begin_vertex>', [
            'int figId = int(aHid * 65535.0 + 0.5);',
            'int figHnd = figId / 4;',
            'mat4 figM = figXfMatrix(figHnd, figId - figHnd * 4);',
            'vec3 transformed = (figM * vec4(position, 1.0)).xyz;',
          ].join('\n'));
      };
      m.customProgramCacheKey = () => 'fig-ghost-depth-batch-v1';
    }
    FIG_MATERIALS[key] = m;
  }
  return FIG_MATERIALS[key];
}

/**
 * Aim outline: an inverted hull of the packed figure / base geometry (front faces culled), pushed out along the
 * screen-space normal by a constant width and a hair behind the figure in depth, so only a glowing band around the
 * silhouette shows. Drawn in the transparent list after the ghost passes (their depth pre-pass hides the hull inside
 * translucent figures). uAmount fades it in and out.
 */
function figOutlineMaterial() {
  if (!FIG_MATERIALS.outline) {
    FIG_MATERIALS.outline = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(1.25, 0.92, 0.36) }, uAmount: { value: 0 }, uWidth: { value: 0.0072 } },
      vertexShader: [
        'attribute vec2 aOct;',
        'uniform float uWidth;',
        'vec3 figOctDecode(vec2 e) {',
        '  vec3 v = vec3(e, 1.0 - abs(e.x) - abs(e.y));',
        '  if (v.z < 0.0) v.xy = (1.0 - abs(v.yx)) * vec2(v.x >= 0.0 ? 1.0 : -1.0, v.y >= 0.0 ? 1.0 : -1.0);',
        '  return normalize(v);',
        '}',
        'void main() {',
        '  mat3 im = mat3(instanceMatrix);',
        '  vec3 n = figOctDecode(aOct) / vec3(dot(im[0], im[0]), dot(im[1], im[1]), dot(im[2], im[2]));',
        '  vec3 vn = normalMatrix * (im * n);',
        '  vec4 clip = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);',
        '  vec2 d = vn.xy;',
        '  float l = length(d);',
        '  d = l > 1e-5 ? d / l : vec2(0.0);',
        '  d.x *= projectionMatrix[0][0] / projectionMatrix[1][1];',
        '  clip.xy += d * uWidth * clip.w;',
        '  clip.z += 0.0004 * clip.w;',
        '  gl_Position = clip;',
        '}',
      ].join('\n'),
      fragmentShader: [
        'uniform vec3 uColor;',
        'uniform float uAmount;',
        'void main() {',
        '  gl_FragColor = vec4(uColor, uAmount);',
        '}',
      ].join('\n'),
      side: THREE.BackSide, transparent: true, depthWrite: false, depthTest: true, fog: false, toneMapped: false,
    });
    FIG_MATERIALS.outline.name = 'fig:outline';
  }
  return FIG_MATERIALS.outline;
}

/**
 * DESIGN.md 16.5: creates the shared materials once and applies the tier (PERF-PLAN 2.1 ids or the legacy preset
 * names). Keys: figure (= figure0), figureKit, figureLod, figureBatch (unused since the two-draw batches),
 * figureBatchVlit / figureBatchPP (the two draws of an opaque region batch: per vertex for small figurines below Magas,
 * per pixel for large ones; figureBatchVlitOn), glass, glassKit, glassBatch, base (= base0), baseLod.
 */
function initFigureMaterials(opts = { quality: 'magas' }) {
  if (!FIG_MATERIALS.figurePhys) {
    FIG_MATERIALS.figurePhys = figMakeMaterial('figure', true, THREE.DoubleSide, false, 'fig:figure0-phys');
    FIG_MATERIALS.figureStd = figMakeMaterial('figure', false, THREE.DoubleSide, false, 'fig:figure0-std');
    FIG_MATERIALS.figureLod = figMakeMaterial('figure', false, THREE.FrontSide, false, 'fig:figure-lod');
    FIG_MATERIALS.figureBatch = figMakeMaterial('figure', false, THREE.FrontSide, true, 'fig:figure-batch');
    FIG_MATERIALS.figureBatchVlit = figPatchVertexLit(figMakeMaterial('figure', false, THREE.FrontSide, true, 'fig:figure-batch-vlit'));
    FIG_MATERIALS.figureBatchPP = figPatchPerPixelTwin(figMakeMaterial('figure', false, THREE.FrontSide, true, 'fig:figure-batch-pp'));
    FIG_MATERIALS.basePhys = figMakeMaterial('base', true, THREE.FrontSide, false, 'fig:base0-phys');
    FIG_MATERIALS.baseStd = figMakeMaterial('base', false, THREE.FrontSide, false, 'fig:base-std');
    FIG_MATERIALS.glass = figMakeMaterial('ghost', false, THREE.FrontSide, false, 'fig:glass');
    FIG_MATERIALS.glassBatch = figMakeMaterial('ghost', false, THREE.FrontSide, true, 'fig:glass-batch');
    FIG_MATERIALS.glassKit = FIG_MATERIALS.glass;
    FIG_MATERIALS.envMap = null;
  }
  figApplyQuality((opts && opts.quality) || FIG_MATERIALS.quality || 'magas');
  return FIG_MATERIALS;
}

/** Clearcoat (Physical) only on the Magas tier and only for the full-detail figure and base (PERF-PLAN F8). */
function figApplyQuality(q) {
  const tier = figTierId(q);
  const phys = tier === 'magas';
  FIG_MATERIALS.quality = tier;
  FIG_MATERIALS.figure = phys ? FIG_MATERIALS.figurePhys : FIG_MATERIALS.figureStd;
  FIG_MATERIALS.figure0 = FIG_MATERIALS.figure;
  FIG_MATERIALS.figureKit = FIG_MATERIALS.figure;
  FIG_MATERIALS.base = phys ? FIG_MATERIALS.basePhys : FIG_MATERIALS.baseStd;
  FIG_MATERIALS.base0 = FIG_MATERIALS.base;
  FIG_MATERIALS.baseLod = FIG_MATERIALS.baseStd;
  // Opaque region batches: small figurines lit per vertex where the tier asks for it (FIG_TIER ppMid / ppFar); the
  // per-pixel twin draws the others.
  FIG_MATERIALS.figureBatchVlitOn = typeof FIG_TIER !== 'undefined' && FIG_TIER[tier] ? FIG_TIER[tier].ppMid > 0 : false;
  for (const s of figSnitchList) s.setQuality(tier);
}

/** Image-based lighting for the figure, base and glass materials (W passes the tier's PMREM or null). */
function figSetEnvMap(tex) {
  const t = tex || null;
  FIG_MATERIALS.envMap = t;
  for (const k of ['figurePhys', 'figureStd', 'figureLod', 'figureBatch', 'figureBatchVlit', 'figureBatchPP', 'basePhys', 'baseStd', 'glass', 'glassBatch']) {
    const m = FIG_MATERIALS[k];
    if (!m || m.envMap === t) continue;
    m.envMap = t;
    m.needsUpdate = true;
  }
}

/** Packs a palette material table into the aPbr bytes (glow wins over back-face AO). */
function figPbrByte(m, back) {
  if (m && m.glow > 0) return 201 + Math.round(Math.min(1, m.glow) * 54);
  return Math.round((back / 255) * 200);
}

/* ---- 24-figures-kit.js ---- */
/* ==== 24-figures-kit.js — figure rendering: the LOD kit for every figurine in the game, the single-design instancer,
   external (artist-made) model support and the free-flying Snitch.

   Rendering per frame (DECISIONS.md 5, PERF-PLAN.md 2.4 and F1-F11):
   - every visible handle gets a LOD from its projected height in pixels (zoom included, hysteresis, tier table and
     governor detail level in 27-figures-perf.js); covered pile figurines are capped (the gameplay passes the depth);
   - static handles (pose unchanged for a few frames: settled pile figurines, seated shelf figurines, figurines on the
     floor) are drawn at the mid or far LOD by region batches: one mesh per pile sector, shelf section, tower or floor
     cell with a real bounding sphere, rebuilt time-sliced when its members or their LOD class change. A batch takes
     the world transform and the effects of each member from the per-handle transform texture, so a member that is
     promoted (full detail, aimed, picked up) is collapsed there at once without touching the batch;
   - everything else (full detail, moving, aimed, held, members whose batch is not rebuilt yet) is CPU frustum-culled
     and drawn by one InstancedMesh per design and LOD plus one base InstancedMesh per LOD;
   - the aim highlight (setRim) is a per-instance rim glow in figInst.x plus an outline hull (mid LOD, 2 draws);
   - impostor band (szoba/TERV.md b.2, L3): a static shelf figurine with an impostor quad (setImpostorReady, kept by
     29-figures-impostor.js) that is shorter than FIG_TIER.timp on screen is drawn by its impostor quad only (transform
     texel 15 = its screen-door alpha, cross-faded over FIG_PERF.impFadeS); a content type whose pack is not resident
     (28-figures-stream.js, "cold") is drawn as its impostor at any distance, or not at all without a quad. ==== */

const figM1 = new THREE.Matrix4();
const figM2 = new THREE.Matrix4();
const figM3 = new THREE.Matrix4();
const figM4 = new THREE.Matrix4();
const figV1 = new THREE.Vector3();
const figV2 = new THREE.Vector3();
const figS1 = new THREE.Vector3();
const figQ1 = new THREE.Quaternion();
const figPS = new THREE.Matrix4();
const figFrustum = new THREE.Frustum();
const figSphere = new THREE.Sphere();
const figCol1 = new THREE.Color();
/** Attributes an instanced geometry shares with its design LOD geometry (never disposed with it). */
const FIG_SHARED_ATTRS = ['position', 'aOct', 'aCol', 'aPbr'];
/** Snitch flyers alive (their gold switches between Physical and Standard with the tier). */
const figSnitchList = [];

/** Geometry for one InstancedMesh: shares the packed attributes of `src` and adds its own instance attributes. */
function figInstGeometry(src, attrs) {
  const g = new THREE.BufferGeometry();
  for (const k of FIG_SHARED_ATTRS) g.setAttribute(k, src.attributes[k]);
  g.setIndex(src.index);
  for (const k of Object.keys(attrs)) g.setAttribute(k, attrs[k]);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
  return g;
}

function figInstAttr(cap, size) {
  const a = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, cap) * size), size);
  a.setUsage(THREE.DynamicDrawUsage);
  a.onUpload(figMarkUploaded);
  return a;
}

function figInstanced(geo, mat, cap) {
  const m = new THREE.InstancedMesh(geo, mat, Math.max(1, cap));
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.instanceMatrix.onUpload(figMarkUploaded);
  m.count = 0;
  m.frustumCulled = false;
  m.castShadow = false;
  m.receiveShadow = true;
  m.matrixAutoUpdate = false;
  return m;
}

/** Marks the first `n` instances of an attribute for upload (only the used range goes to the GPU). Returns bytes. */
function figUpload(attr, n, itemSize) {
  if (n <= 0) return 0;
  attr.clearUpdateRanges();
  attr.addUpdateRange(0, n * itemSize);
  attr.needsUpdate = true;
  return n * itemSize * 4;
}

/** Local matrix of a design LOD: lift onto the base, cm -> m, dequantisation. */
function figLocalMatrix(entry, baseH, out = new THREE.Matrix4()) {
  out.makeTranslation(0, baseH, 0);
  figM3.makeScale(FIG_CM, FIG_CM, FIG_CM);
  out.multiply(figM3).multiply(entry.dequant);
  return out;
}

/**
 * Instanced geometry source of the far LOD: float positions in cm (no dequantisation), so the instanced normals are the
 * true ones, exactly as the far LOD was always drawn.
 */
function figFarInstGeometry(e) {
  if (e.farGeo) return e.farGeo;
  const p = e.geometry.attributes.position;
  if (!p.normalized) {
    e.farGeo = e.geometry;
    return e.farGeo;
  }
  const far = e.far || figFloatCopy(e);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(far.pos, 3).onUpload(figMarkUploaded));
  for (const k of ['aOct', 'aCol', 'aPbr']) g.setAttribute(k, e.geometry.attributes[k]);
  g.setIndex(e.geometry.index);
  e.farGeo = g;
  return g;
}

/** A degenerate one-triangle geometry in the packed layout (program warm-up only). */
function figWarmGeometry(batch) {
  const g = new THREE.BufferGeometry();
  // The figures' vertex layout (u16x4 position, figPackedGeometry), so the warm-up draw builds the same input layout.
  g.setAttribute('position', new THREE.BufferAttribute(new Uint16Array(12), 4, true));
  g.setAttribute('aOct', new THREE.BufferAttribute(new Int16Array(6), 2, true));
  g.setAttribute('aCol', new THREE.BufferAttribute(new Uint8Array(12), 4, true));
  g.setAttribute('aPbr', new THREE.BufferAttribute(new Uint8Array(12), 4, true));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array([0, 1, 2]), 1));
  if (batch) {
    // The region batches' vertex record (figBatchGeometry): interleaved u16x4 position + handle id.
    const ib = new THREE.InterleavedBuffer(new Uint16Array(12), 4);
    g.setAttribute('position', new THREE.InterleavedBufferAttribute(ib, 4, 0, true));
    g.setAttribute('aHid', new THREE.InterleavedBufferAttribute(ib, 1, 3, true));
  } else {
    g.setAttribute('figInst', figInstAttr(1, 4));
    g.setAttribute('figBaseCat', figInstAttr(1, 4));
  }
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
  return g;
}

/* ---- external material patch (glow / flash / shimmer on artist-made models) -------------------------- */

function figPatchExternal(mat) {
  mat.envMapIntensity = 1.0;
  for (const k of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']) if (mat[k]) mat[k].anisotropy = 8;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uFigTime = FIG_UNIFORMS.time;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec4 figInst;\nvarying vec4 vFigInst;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvFigInst = figInst;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec4 vFigInst;\nuniform float uFigTime;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>\n${FIG_RIM_GLSL}\ntotalEmissiveRadiance += vFigInst.y * vec3(1.0, 0.82, 0.45) * 0.55 + vFigInst.z * vec3(1.2) + vFigInst.w * vec3(1.0, 0.78, 0.35) * 0.6 * (0.5 + 0.5 * sin(uFigTime * 6.0 + vViewPosition.y * 40.0));`);
  };
  mat.customProgramCacheKey = () => `fig-ext-${mat.uuid}`;
  mat.needsUpdate = true;
  return mat;
}

/* ---- the kit -------------------------------------------------------------------------------------- */

/**
 * DESIGN.md 16.5 high-level renderer. designOf[h] = design id of handle h. Every handle starts HIDDEN.
 * opts: { quality: tier id (PERF-PLAN 2.1), deferBatches }. Extras beyond the design API
 * (PERF-PLAN 5.2): setCamera, update(t, camera), setQuality, setDetailLevel, setViewport, setEnvMap, buildDeferred,
 * setWarmup, warmupObjects, onContextRestored, setCover, setFocus, registerExternalFigure, whenLoaded, gpuMemory.
 */
function createFigureKit(scene, designOf, opts = {}) {
  initFigureMaterials(opts);
  figStartLoading();
  const n = designOf.length;
  const keepCpu = figKeepCpu();
  const recs = [];
  const recById = {};
  if (n > FIG_MAX_HANDLES) throw new Error(`[figures] ${n} handles, at most ${FIG_MAX_HANDLES}`);
  const designIdx = new Int16Array(n);
  for (let h = 0; h < n; h++) {
    const id = designOf[h];
    let r = recById[id];
    if (!r) {
      const d = FIG_BY_ID[id];
      if (!d) throw new Error(`[figures] unknown design ${id}`);
      const look = figBaseLook(d);
      figCol1.set(look.color);
      figCol1.convertSRGBToLinear();
      r = recById[id] = {
        id, d, met: getFigureMetrics(id), ghost: !!d.translucent, handles: [], index: recs.length, meshes: [null, null, null],
        depth: null, cnt: [0, 0, 0], sig: [0, 0, 0], prevSig: [0, 0, 0], dirty: [0, 0, 0], fxd: [0, 0, 0], force: [1, 1, 1], tris: [0, 0, 0],
        local: [new THREE.Matrix4(), new THREE.Matrix4(), new THREE.Matrix4()], qlocal: [null, new THREE.Matrix4(), new THREE.Matrix4()],
        bsrc: [null, null, null], gen: 0, ext: null, catIndex: look.shimmer, cell: look.cell,
        ringLin: [figCol1.r, figCol1.g, figCol1.b], hasBase: !d.ownBase, baseScale: d.ownBase ? 1 : d.baseR / 30,
        // A content type (28-figures-stream.js) is cold until its pack is resident: impostor or nothing, never a placeholder.
        content: !!d.content, cold: !!d.content && !figGeo(id).baked,
      };
      recs.push(r);
    }
    designIdx[h] = r.index;
    r.handles.push(h);
  }

  /* Tier, governor detail level, viewport and the adaptive triangle-budget factor */
  let tier = figTierId(opts.quality);
  let T = FIG_TIER[tier];
  let detail = 0;
  let viewH = 0;
  let adapt = 1;

  /* Per-handle state */
  const mode = new Uint8Array(n);
  const hm = new Float32Array(n * 16);
  const pos = new Float32Array(n * 3);
  const quat = new Float32Array(n * 4);
  const scl = new Float32Array(n).fill(1);
  const poseDirty = new Uint8Array(n).fill(1);
  const fx = new Float32Array(n * 2);
  const rim = new Float32Array(n);
  const fxDirty = new Uint8Array(n).fill(1);
  const baseOn = new Uint8Array(n).fill(1);
  const lod = new Int8Array(n).fill(-1);
  const fin = new Int8Array(n).fill(-1);
  const chunkOk = new Uint8Array(n);
  const center = new Float32Array(n * 4);
  const still = new Uint8Array(n);
  const dyn = new Uint16Array(n);
  const cover = new Uint8Array(n);
  const focus = new Uint8Array(n);
  const dist = new Float32Array(n);
  const regOk = new Uint8Array(n);
  const wantBase = new Uint8Array(n);
  const drawF = new Uint8Array(n);
  const drawB = new Uint8Array(n);
  const xfState = new Uint8Array(n);
  const xfDirty = new Uint8Array(n).fill(1);
  /* Shading path of a batched handle (transform texel 14: 1 = per-pixel twin draw) and its last pixel height */
  const shadePP = new Uint8Array(n);
  const hpxA = new Float32Array(n);
  /* A two-deep covered pile figurine shown at LOD1 because it is large on screen (hysteresis state, FIG_PERF.cover2Up) */
  const c2up = new Uint8Array(n);
  /* Shelf depth rank (setShelfRank) and the per-pixel wish of a batched handle (hysteresis state of its own height) */
  const rank = new Uint8Array(n);
  const ppWish = new Uint8Array(n);
  /* Per handle and batch kind (FIG_KIND_*): region chunk, wanted chunk this frame, built chunk, its part, base flag */
  const reg = new Int32Array(n * 4).fill(-1);
  const want = new Int32Array(n * 4).fill(-1);
  const mem = new Int32Array(n * 4).fill(-1);
  const memPart = new Int16Array(n * 4);
  const memBase = new Uint8Array(n * 4);
  const nextE = new Int32Array(n * 4).fill(-1);
  const cand0 = new Float64Array(n);
  const cand1 = new Float64Array(n);
  /* Impostor band: quad available, wanted this frame, screen-door alpha (0 geometry … 1 impostor), last written alpha */
  const impOk = new Uint8Array(n);
  const impW = new Uint8Array(n);
  const impA = new Float32Array(n);
  const impXf = new Float32Array(n);
  let impMode = 'auto';
  const shimmer = new Float32Array(FIG_SHIMMER_SLOTS);
  const shimmerPrev = new Float32Array(FIG_SHIMMER_SLOTS);
  for (let h = 0; h < n; h++) quat[h * 4 + 3] = 1;
  const meshes = [];
  const group = new THREE.Group();
  group.name = 'figures';
  group.matrixAutoUpdate = false;
  scene.add(group);

  /* Transform / effect texture of the region batches; the category texel never changes */
  const xf = figCreateXf(n);
  FIG_UNIFORMS.xf.value = xf.tex;
  for (let h = 0; h < n; h++) {
    const r = recs[designIdx[h]];
    xf.cat(h, r.ringLin[0], r.ringLin[1], r.ringLin[2], r.cell);
  }

  /* Batch sources of the bases (mid and far); the medallion lookup needs the mid base's quantisation box */
  const baseSrc = [null, figBatchSource(figBuildBase(1), false), figBatchSource(figBuildBase(2), false)];
  {
    const e = baseSrc[1].D.elements;
    FIG_UNIFORMS.baseQMin.value.set(e[12], e[13], e[14]);
    FIG_UNIFORMS.baseQSize.value.set(e[0], e[5], e[10]);
  }

  function figMatFor(r, l) {
    if (r.ghost) return FIG_MATERIALS.glass;
    return l === 0 ? FIG_MATERIALS.figure0 : FIG_MATERIALS.figureLod;
  }

  function buildRecMeshes(r) {
    const geo = figGeo(r.id);
    for (let l = 0; l < 3; l++) {
      const e = geo.lods[l];
      let src;
      if (l < 2) {
        src = e.geometry;
        figLocalMatrix(e, r.met.baseH, r.local[l]);
      } else {
        src = figFarInstGeometry(e);
        r.local[2].makeTranslation(0, r.met.baseH, 0).multiply(figM3.makeScale(FIG_CM, FIG_CM, FIG_CM));
        if (src === e.geometry) r.local[2].multiply(e.dequant);
      }
      const g = figInstGeometry(src, { figInst: figInstAttr(r.handles.length, 4) });
      const old = r.meshes[l];
      if (old) {
        const og = old.geometry;
        old.geometry = g;
        if (r.depth) r.depth[l].geometry = g;
        figDisposeOwn(og, FIG_SHARED_ATTRS);
      } else {
        const m = figInstanced(g, figMatFor(r, l), r.handles.length);
        m.name = `fig:${r.id}:${l}`;
        m.renderOrder = r.ghost ? 2 : 0;
        m.visible = false;
        r.meshes[l] = m;
        meshes.push(m);
        group.add(m);
        if (r.ghost) {
          // Depth pre-pass twin: shares the geometry and the instance matrices of the ghost mesh.
          const dm = figInstanced(g, figGhostDepthMaterial(false), 1);
          dm.instanceMatrix = m.instanceMatrix;
          dm.name = `fig:${r.id}:${l}:depth`;
          dm.renderOrder = 1;
          dm.visible = false;
          dm.receiveShadow = false;
          if (!r.depth) r.depth = [null, null, null];
          r.depth[l] = dm;
          group.add(dm);
        }
      }
      r.tris[l] = e.tris;
      r.force[l] = 1;
    }
    r.bsrc[1] = figBatchSource(geo.lods[1], false);
    r.bsrc[2] = figBatchSource(geo.lods[2], true);
    for (const c of [1, 2]) {
      r.qlocal[c].makeTranslation(0, r.met.baseH, 0).multiply(figM3.makeScale(FIG_CM, FIG_CM, FIG_CM)).multiply(r.bsrc[c].D);
    }
    r.gen++;
  }
  for (const r of recs) buildRecMeshes(r);

  /* Bases: near, mid and far instanced meshes (static handles carry their base in the region batch) */
  const bases = [0, 1, 2].map((l) => {
    const b = figBuildBase(l);
    const cat = figInstAttr(n, 4);
    const inst = figInstAttr(n, 4);
    const m = figInstanced(figInstGeometry(b.geometry, { figBaseCat: cat, figInst: inst }), l === 0 ? FIG_MATERIALS.base0 : FIG_MATERIALS.baseLod, n);
    m.name = `fig:base:${l}`;
    m.visible = false;
    meshes.push(m);
    group.add(m);
    return { mesh: m, cat, inst, cnt: 0, tris: b.tris, sig: 0, prevSig: 0, dirty: 0, fxd: 0, force: 1 };
  });
  const baseLocal = new THREE.Matrix4();

  /* Aim outline: the inverted hull (mid LOD) of the one highlighted handle (figure and base; 2 draws only while aiming) */
  const outline = [0, 1].map((k) => {
    const m = new THREE.InstancedMesh(new THREE.BufferGeometry(), figOutlineMaterial(), 1);
    m.name = `fig:outline:${k}`;
    m.frustumCulled = false;
    m.matrixAutoUpdate = false;
    m.renderOrder = 3;
    m.visible = false;
    group.add(m);
    return m;
  });

  /* Program warm-up (PERF-PLAN F2): one degenerate one-triangle mesh per figure program, drawn only while on */
  const warmInstGeo = figWarmGeometry(false);
  const warmBatchGeo = figWarmGeometry(true);
  const warmDefs = [
    [() => FIG_MATERIALS.figure0, false], [() => FIG_MATERIALS.figureLod, false], [() => FIG_MATERIALS.figureBatchPP, true],
    [() => (FIG_MATERIALS.figureBatchVlitOn ? FIG_MATERIALS.figureBatchVlit : FIG_MATERIALS.figureBatchPP), true],
    [() => FIG_MATERIALS.base0, false], [() => FIG_MATERIALS.baseLod, false], [() => FIG_MATERIALS.glass, false],
    [() => FIG_MATERIALS.glassBatch, true], [() => figGhostDepthMaterial(false), false], [() => figGhostDepthMaterial(true), true],
    [() => figOutlineMaterial(), false],
  ];
  const warm = warmDefs.map(([mat, batch]) => {
    let m;
    if (batch) {
      m = new THREE.Mesh(warmBatchGeo, mat());
      m.matrixAutoUpdate = false;
    } else {
      m = figInstanced(warmInstGeo, mat(), 1);
      m.count = 1;
    }
    m.frustumCulled = false;
    m.name = 'fig:warm';
    m.visible = true;
    m.renderOrder = -1;
