    group.add(m);
    return m;
  });
  let warmOn = true;
  let warmAuto = true;
  let warmFrames = 0;
  function setWarm(on) {
    warmOn = !!on;
    warm.forEach((m, i) => {
      m.material = warmDefs[i][0]();
      m.visible = warmOn;
    });
  }

  /* ---- region chunks -------------------------------------------------------------------------------- */
  const chunks = [];
  const chunkByKey = new Map();
  let budgetOverride = 0;
  let pendingChunks = 0;
  let job = null;
  let nowS = 0;
  const regionShow = { on: false, helpers: [] };

  function chunkId(key, kind) {
    const k = `${kind}|${key}`;
    let c = chunkByKey.get(k);
    if (!c) {
      c = figNewChunk(chunks.length, k, kind);
      chunks.push(c);
      chunkByKey.set(k, c);
    }
    return c.id;
  }

  /** Region of a static handle from its centre: the gameplay resolver (pile sector, shelf section...) or a grid cell. */
  function resolveRegion(h) {
    const x = center[h * 4];
    const y = center[h * 4 + 1];
    const z = center[h * 4 + 2];
    let key = null;
    if (typeof regionKeyFor === 'function') {
      try {
        key = regionKeyFor(x, y, z);
      } catch {
        key = null;
      }
    }
    if (!key) key = figGridKey(x, z);
    const o = h * 4;
    reg[o + FIG_KIND_MID] = chunkId(key, FIG_KIND_MID);
    reg[o + FIG_KIND_FAR] = chunkId(key, FIG_KIND_FAR);
    if (recs[designIdx[h]].ghost) {
      const bar = key.indexOf('|');
      const grp = bar >= 0 ? key.slice(0, bar) : key;
      reg[o + FIG_KIND_GMID] = chunkId(grp, FIG_KIND_GMID);
      reg[o + FIG_KIND_GFAR] = chunkId(grp, FIG_KIND_GFAR);
    }
    regOk[h] = 1;
  }

  /** True when a handle's bounding sphere lies inside the sphere of the batch part that holds it (entry e). */
  function insidePart(h, e) {
    const c = chunks[mem[e]];
    const p = c ? c.parts[memPart[e]] : null;
    if (!p) return false;
    const s = p.sphere;
    const dx = center[h * 4] - s.center.x;
    const dy = center[h * 4 + 1] - s.center.y;
    const dz = center[h * 4 + 2] - s.center.z;
    return Math.sqrt(dx * dx + dy * dy + dz * dz) + center[h * 4 + 3] <= s.radius + 0.01;
  }

  /** Class (1 mid, 2 far) a batch can draw an entry pair at: the wanted one if built there, else the other one, else 0. */
  function drawableClass(h, kMid, cls, needBase) {
    const o = h * 4;
    const kp = cls === 2 ? kMid + 1 : kMid;
    const ka = kp ^ 1;
    if (reg[o + kp] >= 0 && mem[o + kp] === reg[o + kp] && (!needBase || memBase[o + kp])) return cls;
    if (reg[o + ka] >= 0 && mem[o + ka] === reg[o + ka] && (!needBase || memBase[o + ka])) return 3 - cls;
    return 0;
  }

  let buildKind = 0;
  const entryOf = (h, out) => {
    const r = recs[designIdx[h]];
    const cls = FIG_KIND_CLS[buildKind];
    if (FIG_KIND_GHOST[buildKind]) {
      out.fig = r.bsrc[cls];
      out.base = null;
    } else {
      out.fig = r.ghost ? null : r.bsrc[cls];
      out.base = wantBase[h] && r.hasBase ? baseSrc[cls] : null;
    }
  };

  function chunkDirty(c) {
    return c.force || c.wantA !== c.builtA || c.wantB !== c.builtB || c.wantN !== c.builtN;
  }

  /**
   * Starts the (time-sliced) rebuild of one chunk from this frame's wanted entries. One rebuild runs at a time; the old
   * meshes keep drawing the old members until it lands.
   */
  function startJob(c) {
    buildKind = c.kind;
    const why = c.force ? 'force' : c.urgent ? 'urgent' : c.adds ? 'adds' : c.compact ? 'compact' : 'drop';
    FIG_STATS.reasons[why] = (FIG_STATS.reasons[why] || 0) + 1;
    const cls = FIG_KIND_CLS[c.kind];
    const caps = c.parts.map((p) => p.cap);
    job = { c, j: figChunkJob(c.head, nextE, c.wantN, entryOf, keepCpu, cls === 2 ? 0 : 2, cls === 2 ? 1 : 3, caps), A: c.wantA, B: c.wantB, N: c.wantN };
  }

  function disposePart(p) {
    group.remove(p.mesh);
    if (p.depth) group.remove(p.depth);
    if (p.pp) group.remove(p.pp);
    figBatchRecycle(p.mesh.geometry);
    p.mesh.geometry.dispose();
  }

  /**
   * Lands the finished rebuild: every part that fits its predecessor's capacity is written into that part's geometry
   * and meshes (the GL buffers are reused, F2); other parts get new ones and the leftovers are disposed. Then the
   * chunk's membership switches.
   */
  function landJob() {
    const c = job.c;
    const ghost = FIG_KIND_GHOST[c.kind];
    const res = job.j.finish(center);
    let bytes = 0;
    let up = 0;
    const old = c.parts;
    const parts = [];
    for (let i = 0; i < res.parts.length; i++) {
      const np = res.parts[i];
      const op = old[i];
      if (op && np.reuse && op.cap && op.cap.nv === np.cap.nv && op.cap.ni === np.cap.ni) {
        figBatchUpdate(op.mesh.geometry, np);
        op.sphere = np.sphere;
        op.tris = np.tris;
        op.bytes = np.bytes;
        parts.push(op);
        FIG_STATS.reused++;
      } else {
        if (op) disposePart(op);
        parts.push(makePart(c, figBatchGeometry(np, keepCpu), np, i, ghost));
      }
      bytes += np.bytes;
      up += np.usedBytes;
    }
    for (let i = res.parts.length; i < old.length; i++) disposePart(old[i]);
    c.parts = parts;
    landMembers(c, res, bytes, up);
  }

  /** The meshes of a new batch part: the per-vertex lit draw and its per-pixel twin (or a ghost and its depth pass). */
  function makePart(c, geometry, p, i, ghost) {
    const mesh = new THREE.Mesh(geometry, ghost ? FIG_MATERIALS.glassBatch : FIG_MATERIALS.figureBatchVlit);
    if (!ghost) mesh.onBeforeRender = figVlitBeforeRender;
    mesh.name = `fig:batch:${c.key}:${i}`;
    mesh.matrixAutoUpdate = false;
    mesh.frustumCulled = true;
    mesh.receiveShadow = true;
    mesh.renderOrder = ghost ? 2 : 0;
    group.add(mesh);
    let depth = null;
    let pp = null;
    if (ghost) {
      depth = new THREE.Mesh(geometry, figGhostDepthMaterial(true));
      depth.name = `fig:batch:${c.key}:${i}:depth`;
      depth.matrixAutoUpdate = false;
      depth.renderOrder = 1;
      group.add(depth);
    } else {
      // Per-pixel twin (same geometry): draws the members that are large on screen; each draw collapses the others.
      pp = new THREE.Mesh(geometry, FIG_MATERIALS.figureBatchPP);
      pp.name = `fig:batch:${c.key}:${i}:pp`;
      pp.matrixAutoUpdate = false;
      pp.frustumCulled = true;
      pp.receiveShadow = true;
      pp.renderOrder = 0;
      // Until the next update counts the members per path: both draws (each collapses the other set), only the
      // per-pixel one where the per-vertex path is off (Magas: its program is not compiled there).
      pp.visible = true;
      mesh.visible = !!FIG_MATERIALS.figureBatchVlitOn;
      group.add(pp);
    }
    return { mesh, depth, pp, nVL: 0, nPP: 0, sphere: p.sphere, tris: p.tris, bytes: p.bytes, cap: p.cap };
  }

  /** Switches a landed chunk's membership to the rebuilt member list. */
  function landMembers(c, res, bytes, up) {
    c.tris = c.parts.reduce((s, p) => s + p.tris, 0);
    if (c.members) {
      for (let k = 0; k < c.members.length; k++) {
        const e = c.members[k] * 4 + c.kind;
        if (mem[e] === c.id) mem[e] = -1;
      }
    }
    c.members = res.handles;
    for (let k = 0; k < res.handles.length; k++) {
      const h = res.handles[k];
      const e = h * 4 + c.kind;
      mem[e] = c.id;
      memPart[e] = res.partOf[k];
      memBase[e] = res.baseOf[k];
      xfDirty[h] = 1;
    }
    c.builtA = job.A;
    c.builtB = job.B;
    c.builtN = job.N;
    c.force = false;
    c.compact = false;
    c.lastBuild = nowS;
    c.bytes = bytes;
    FIG_STATS.regionRebuilds++;
    frameUpload += up;
    job = null;
    if (regionShow.on) showRegions(true);
  }

  /** Debug: wireframe spheres around every batch part (one colour per chunk). */
  function showRegions(on) {
    for (const hlp of regionShow.helpers) {
      group.remove(hlp);
      hlp.geometry.dispose();
      hlp.material.dispose();
    }
    regionShow.helpers.length = 0;
    regionShow.on = !!on;
    if (!on) return;
    for (const c of chunks) {
      for (const p of c.parts) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL((c.id * 0.137) % 1, 0.8, 0.55), wireframe: true, fog: false }));
        m.position.copy(p.sphere.center);
        m.scale.setScalar(p.sphere.radius);
        m.updateMatrix();
        m.name = 'fig:region-helper';
        group.add(m);
        regionShow.helpers.push(m);
      }
    }
  }

  /* Baked figures arriving after the kit was built: swap geometries; the batches rebuild through the design generation */
  const listener = {
    onDesignLoaded(id) {
      const r = recById[id];
      if (!r) return;
      r.met = getFigureMetrics(id);
      r.cold = false;
      buildRecMeshes(r);
      for (const h of r.handles) poseDirty[h] = 1;
    },
    /** The stream dropped the design's geometry: a content type turns cold, any other design shows its placeholder. */
    onDesignEvicted(id) {
      const r = recById[id];
      if (!r) return;
      if (r.content) {
        r.cold = true;
        r.bsrc[1] = null;
        r.bsrc[2] = null;
        r.gen++;
        for (let l = 0; l < 3; l++) {
          r.meshes[l].count = 0;
          r.meshes[l].visible = false;
          if (r.depth) r.depth[l].visible = false;
        }
      } else buildRecMeshes(r);
      for (const h of r.handles) poseDirty[h] = 1;
    },
    onAllLoaded() {},
  };
  FIG_LOAD.listeners.add(listener);

  let cam = null;
  const camPos = new THREE.Vector3();
  const info = {
    meshes: 0, drawCallsMax: 0, instances: n, loose: 0, shelf: 0, externalIds: [], trisEstimate: 0, near: 0, mid: 0, far: 0, culled: 0, batched: 0, loaded: 0, baked: 0,
    impostors: 0, cold: 0,
  };
  const extList = [];
  let lastT = 0;
  let forceLod = -1;
  let primed = false;
  let batching = true;
  let frameUpload = 0;

  function defaultViewH() {
    const dpr = typeof devicePixelRatio === 'number' && devicePixelRatio > 0 ? devicePixelRatio : 1;
    return (typeof innerHeight === 'number' && innerHeight > 0 ? innerHeight : 1080) * dpr;
  }

  /** Writes the transform rows of a batched handle: the figure part at class f, the base part at class b (0 = none). */
  function writeRows(h, r, f, b) {
    xf.zero(h);
    figM2.fromArray(hm, h * 16);
    if (f) {
      figM1.multiplyMatrices(figM2, r.qlocal[f]);
      xf.rows(h, f === 2 ? 0 : 2, figM1.elements);
    }
    if (b) {
      baseLocal.makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM).multiply(baseSrc[b].D);
      figM1.multiplyMatrices(figM2, baseLocal);
      xf.rows(h, b === 2 ? 1 : 3, figM1.elements);
    }
  }

  const kit = {
    group,
    setPose(h, position, quaternion, scale = 1) {
      // The impostor quad sits where the figurine stood when its batch was built: a moved figurine is geometry only.
      if (impOk[h]) kit.setImpostorReady(h, false);
      const o = h * 3;
      pos[o] = position.x;
      pos[o + 1] = position.y;
      pos[o + 2] = position.z;
      const q = h * 4;
      quat[q] = quaternion.x;
      quat[q + 1] = quaternion.y;
      quat[q + 2] = quaternion.z;
      quat[q + 3] = quaternion.w;
      scl[h] = scale;
      poseDirty[h] = 1;
    },
    setMode(h, m) {
      if (mode[h] === m) return;
      mode[h] = m;
      fxDirty[h] = 1;
    },
    setBaseVisible(h, visible) {
      const v = visible ? 1 : 0;
      if (baseOn[h] === v) return;
      baseOn[h] = v;
      poseDirty[h] = 1;
    },
    setFx(h, glow, flash) {
      if (fx[h * 2] === glow && fx[h * 2 + 1] === flash) return;
      fx[h * 2] = glow;
      fx[h * 2 + 1] = flash;
      fxDirty[h] = 1;
    },
    /** Aim highlight: rim glow amount 0..1 (0 = off). A highlighted handle is drawn instanced, at least at the mid LOD. */
    setRim(h, amount) {
      if (rim[h] === amount) return;
      rim[h] = amount;
      fxDirty[h] = 1;
    },
    /** Pile cover depth (PERF-PLAN F6): 0 free, 1 something rests on it, 2 what rests on it is itself covered. */
    setCover(h, depth) {
      cover[h] = Math.max(0, Math.min(2, depth | 0));
    },
    /**
     * Shelf depth rank (1e, NOTES-1e.md): 1 = a copy stands right in front of this shelved one, so it is mostly hidden
     * and drawn at the mid LOD at most (unless it is aimed); 0 = front row or nothing in front.
     */
    setShelfRank(h, r) {
      rank[h] = r ? 1 : 0;
    },
    /** The held figurine shown in the hand: full detail on every tier, never batched. */
    setFocus(h, on) {
      focus[h] = on ? 1 : 0;
    },
    /** Shelf shimmer of a legacy category key, or of a district ('district_I' … 'district_X'). */
    setCategoryShimmer(categoryKey, amount) {
      const i = figShimmerSlot(categoryKey);
      if (i < 0) return;
      shimmer[i] = amount;
    },
    /**
     * Impostor band: `on` = handle h has an impostor quad at its current pose (29-figures-impostor.js). Off clears its
     * alpha at once (the quad is never drawn for it again until it is set again).
     */
    setImpostorReady(h, on) {
      const v = on ? 1 : 0;
      if (impOk[h] === v) return;
      impOk[h] = v;
      if (!v) {
        impW[h] = 0;
        impA[h] = 0;
        if (impXf[h] !== 0) {
          impXf[h] = 0;
          xf.imp(h, 0);
        }
      }
      poseDirty[h] = poseDirty[h] || 0;
    },
    /** 'auto' (the tier's timp band), 'off' (geometry only, impostors only for cold types) or 'force' (every ready
     *  static figurine is an impostor): for the on / off screenshot comparisons (TERV b.6). */
    setImpostorMode(m) {
      impMode = m === 'off' || m === 'force' ? m : 'auto';
    },
    setCamera(camera) {
      cam = camera;
    },
    /** Kept for compatibility: the pixel-height LOD reads the zoom from the projection matrix. */
    setLodZoom() {},
    /** Development / preview: draw every handle at one LOD (0, 1, 2), or -1 for the pixel-height LOD. */
    setForceLod(l) {
      forceLod = l;
      for (let h = 0; h < n; h++) poseDirty[h] = 1;
    },
    /** Governor detail step 0..2 (thresholds x 1.25^n, max counts x 0.7^n); never changes a shader program. */
    setDetailLevel(level) {
      detail = Math.max(0, Math.min(2, level | 0));
    },
    /** Scale-1 drawing-buffer size in pixels (dynamic resolution does not change the LOD). */
    setViewport(w, h) {
      if (h > 0) viewH = h;
    },
    setEnvMap(tex) {
      figSetEnvMap(tex);
    },
    setWarmup(on) {
      warmAuto = false;
      setWarm(on);
    },
    /** One mesh per figure program of the current tier (instanced and batch variants), for staged compiling. */
    warmupObjects() {
      setWarm(warmOn);
      return warm.slice();
    },
    /** After a restored WebGL context: every dynamic buffer and the transform texture upload again. */
    onContextRestored() {
      for (const r of recs) r.force.fill(1);
      for (const b of bases) b.force = 1;
      for (const e of extList) e.force = 1;
      xf.dirty = true;
      xf.full = true;
      if (!keepCpu) for (const c of chunks) c.force = true;
    },
    /**
     * Builds the region batches before the first frame (boot step 8): every handle posed so far counts as settled, and
     * the batches are built in slices of about budgetMs with `await yieldFn()` between them.
     */
    async buildDeferred(yieldFn, budgetMs = 6) {
      const prev = budgetOverride;
      budgetOverride = Math.max(0.5, budgetMs);
      try {
        for (let i = 0; i < 600; i++) {
          kit.update(lastT, null);
          if (!pendingChunks && !job) break;
          if (yieldFn) await yieldFn();
        }
      } finally {
        budgetOverride = prev;
      }
    },
    /** Once per frame after all pose / mode changes. */
    update(t = lastT, camera = null) {
      const tStart = performance.now();
      const dtImp = Math.max(0, Math.min(0.25, t - lastT));
      lastT = t;
      nowS = tStart / 1000;
      FIG_UNIFORMS.time.value = t;
      if (camera) cam = camera;
      frameUpload = 0;
      if (warmAuto && ++warmFrames > 10) {
        warmAuto = false;
        setWarm(false);
      }
      const stillOnPose = primed ? 0 : FIG_PERF.still;
      const haveCam = !!cam;
      let P5 = 1;
      if (haveCam) {
        cam.updateMatrixWorld();
        figPS.multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
        figFrustum.setFromProjectionMatrix(figPS);
        camPos.setFromMatrixPosition(cam.matrixWorld);
        P5 = cam.projectionMatrix.elements[5];
      }
      const halfH = 0.5 * Math.max(viewH > 0 ? viewH : defaultViewH(), T.minH || 0);
      const mult = adapt * Math.pow(1.25, detail);
      const t0 = T.t0 * mult;
      const t1 = T.t1 * mult;
      const aimT0 = Math.min(T.t0, FIG_PERF.aimT0) * mult;
      const hy = FIG_PERF.hyst;
      const tPre = t1 * (1 + hy) * FIG_PERF.prefetch;
      const max0 = Math.max(1, Math.round(T.max0 * Math.pow(0.7, detail)));
      const max1 = Math.max(4, Math.round(T.max1 * Math.pow(0.7, detail)));
      const tImp = impMode === 'off' ? 0 : impMode === 'force' ? Infinity : (T.timp || 0) * mult;
      const impStep = dtImp / FIG_PERF.impFadeS;
      let nImp = 0;
      let nCold = 0;
      const keepFrames = Math.round(FIG_PERF.keepDynS * 60);
      // Upload tracking: each instanced mesh keeps a signature of the handles it drew (in order) plus a dirty flag
      // for changed poses / effects, so an unchanged view uploads nothing.
      for (const r of recs) {
        for (let l = 0; l < 3; l++) {
          r.cnt[l] = 0;
          r.sig[l] = 0;
          r.dirty[l] = r.force[l];
          r.fxd[l] = 0;
        }
      }
      for (const b of bases) {
        b.cnt = 0;
        b.sig = 0;
        b.dirty = b.force;
        b.fxd = 0;
      }
      for (const e of extList) {
        e.cnt = 0;
        e.sig = 0;
        e.dirty = e.force === 0 ? 0 : 1;
      }
      for (const c of chunks) {
        c.wantA = 0;
        c.wantB = 0;
        c.wantN = 0;
        c.adds = 0;
        c.urgent = 0;
        c.live = 0;
        c.lazy = 0;
        c.lazyTris = 0;
        c.liveTris = 0;
        c.head = -1;
        for (const p of c.parts) {
          p.nVL = 0;
          p.nPP = 0;
          // A part is drawn per pixel as a whole when most of its members ask for it (hysteresis 60 % on / 40 % off).
          const share = p.wN ? p.wP / p.wN : 0;
          p.ppOn = share >= (p.ppOn ? 0.4 : 0.6) ? 1 : 0;
          p.wP = 0;
          p.wN = 0;
        }
      }
      for (let i = 0; i < shimmer.length; i++) {
        if (shimmer[i] !== shimmerPrev[i]) {
          shimmerPrev[i] = shimmer[i];
          for (const r of recs) if (r.catIndex === i) for (const h of r.handles) if (mode[h] === FIG_MODE.SHELF) fxDirty[h] = 1;
        }
      }

      /* Pass 1: pose, pixel height, LOD, static detection, wanted batch membership, batch drawability */
      let n0 = 0;
      let n1 = 0;
      for (let h = 0; h < n; h++) {
        const o4 = h * 4;
        want[o4] = -1;
        want[o4 + 1] = -1;
        want[o4 + 2] = -1;
        want[o4 + 3] = -1;
        chunkOk[h] = 0;
        const m = mode[h];
        if (m === FIG_MODE.HIDDEN) {
          lod[h] = -1;
          fin[h] = -1;
          still[h] = 0;
          continue;
        }
        const r = recs[designIdx[h]];
        const s = scl[h];
        if (poseDirty[h]) {
          figV1.set(pos[h * 3], pos[h * 3 + 1], pos[h * 3 + 2]);
          figQ1.set(quat[h * 4], quat[h * 4 + 1], quat[h * 4 + 2], quat[h * 4 + 3]);
          figM2.compose(figV1, figQ1, figS1.set(s, s, s));
          figM2.toArray(hm, h * 16);
          figV2.set(0, r.met.centerY, 0).applyMatrix4(figM2);
          center[h * 4] = figV2.x;
          center[h * 4 + 1] = figV2.y;
          center[h * 4 + 2] = figV2.z;
          center[h * 4 + 3] = Math.max(r.met.totalH * 0.6, r.met.radius * 1.2) * s;
          still[h] = stillOnPose;
          regOk[h] = 0;
          xfDirty[h] = 1;
        } else if (still[h] < 255) still[h]++;
        let Lr = 1;
        let hpx = 1e9;
        if (haveCam) {
          const dx = center[h * 4] - camPos.x;
          const dy = center[h * 4 + 1] - camPos.y;
          const dz = center[h * 4 + 2] - camPos.z;
          const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          dist[h] = d;
          hpx = (r.met.totalH * s * halfH * P5) / Math.max(d, 0.05);
          const prev = lod[h];
          if (prev === 0) Lr = hpx >= t0 * (1 - hy) ? 0 : hpx >= t1 ? 1 : 2;
          else if (prev === 1) Lr = hpx >= t0 * (1 + hy) ? 0 : hpx < t1 * (1 - hy) ? 2 : 1;
          else if (prev === 2) Lr = hpx >= t0 * (1 + hy) ? 0 : hpx >= t1 * (1 + hy) ? 1 : 2;
          else Lr = hpx >= t0 ? 0 : hpx >= t1 ? 1 : 2;
        } else dist[h] = 0;
        lod[h] = Lr;
        hpxA[h] = hpx;
        // Impostor band (L3): a ready, settled shelf figurine below timp on screen (hysteresis), or a cold content type.
        if (impOk[h] || r.cold) {
          let w = 0;
          if (r.cold) w = impOk[h];
          else if (tImp > 0 && m === FIG_MODE.SHELF && still[h] >= FIG_PERF.still && !rim[h] && !focus[h] && !r.ext && forceLod < 0) {
            w = hpx < tImp * (impW[h] ? 1 + hy : 1 - hy) ? 1 : 0;
          }
          impW[h] = w;
          const a = r.cold ? w : w ? Math.min(1, impA[h] + impStep) : Math.max(0, impA[h] - impStep);
          impA[h] = a;
          if (impXf[h] !== a) {
            impXf[h] = a;
            xf.imp(h, a);
          }
          if (r.cold || (w && a >= 1)) {
            // Drawn by its impostor quad only (or not at all): no batch membership, no instance.
            fin[h] = -3;
            if (r.cold) nCold++;
            if (w) nImp++;
            continue;
          }
        }
        let L = Lr;
        const cv = cover[h];
        let noBase = 0;
        if (cv >= 2) {
          // Buried two deep: far LOD, except while it is large on screen (zoomed in, or a pile right in front of the
          // camera) on the tiers whose one-deep cap is LOD1: from cover2Up x t0 (with the LOD hysteresis) LOD1,
          // because the far LOD shows faceted bases and blocky robes at that size (integration, DECISIONS.md 14).
          // The base stays unless the tier drops it (cover2NoBase; base discs carry the look of the porous pile).
          let up = 0;
          if (T.cover1 === 1 && haveCam) up = hpx >= t0 * FIG_PERF.cover2Up * (c2up[h] ? 1 - hy : 1 + hy) ? 1 : 0;
          c2up[h] = up;
          L = up ? 1 : 2;
          noBase = T.cover2NoBase && L === 2 ? 1 : 0;
        } else if (cv === 1 && L < T.cover1) L = T.cover1;
        // A shelved copy with another one right in front of it: the mid LOD at most (1e; its silhouette hides).
        if (L === 0 && rank[h] && m === FIG_MODE.SHELF) L = 1;
        if (rim[h] > 0) {
          L = Math.min(L, 1);
          if (haveCam && hpx >= aimT0) L = 0;
        }
        if (focus[h]) L = 0;
        if (r.ext) L = Math.min(L, 1);
        if (forceLod >= 0) L = forceLod;
        const cls = L === 2 ? 2 : 1;
        const capFar = (cv >= 2 && L === 2) || (cv === 1 && T.cover1 === 2);
        const baseW = r.hasBase && baseOn[h] && !noBase ? 1 : 0;
        wantBase[h] = baseW;
        const isStatic = batching && still[h] >= FIG_PERF.still && rim[h] === 0 && !focus[h] && !r.ext && forceLod !== 0;
        let keepDyn = false;
        if (isStatic) {
          dyn[h] = 0;
          if (!regOk[h]) resolveRegion(h);
        } else {
          if (dyn[h] < 65535) dyn[h]++;
          // A member that only wobbles (aimed pop, hop) keeps its place in the batches while it stays inside them.
          keepDyn = batching && (dyn[h] < keepFrames || rim[h] > 0) && !focus[h] && !r.ext;
        }
        // Wanted batch entries: mid batch when mid (or full detail, or about to become mid), far batch when far;
        // current members stay (lazily) until their batch is compacted, so an LOD switch back only toggles rows.
        const kFig = r.ghost ? FIG_KIND_GMID : FIG_KIND_MID;
        for (let kind = 0; kind < 4; kind++) {
          const e = o4 + kind;
          const cid = reg[e];
          if (cid < 0) continue;
          const ghostKind = FIG_KIND_GHOST[kind];
          if (ghostKind !== r.ghost && (ghostKind || !baseW)) continue;
          const c = chunks[cid];
          const member = mem[e] === cid;
          let w = false;
          if (isStatic) {
            // (no prefetch for pile figurines the cover rule keeps far)
            const kc = FIG_KIND_CLS[kind];
            w = kc === 1 ? L <= 1 || (hpx >= tPre && !capFar) : L === 2;
            // A member this batch still draws (at the old LOD, until its new batch lands) is never dropped.
            const drawnHere = member && (ghostKind || !r.ghost ? (xfState[h] & 3) === kc : (xfState[h] >> 2) === kc);
            if (!w && member && (drawnHere || !c.compact)) {
              w = true;
              if (!drawnHere) {
                c.lazy++;
                c.lazyTris += (ghostKind || !r.ghost ? r.bsrc[kc].tris : 0) + (!ghostKind && baseW ? baseSrc[kc].tris : 0);
              }
            }
          } else if (keepDyn && member && insidePart(h, e)) w = true;
          if (!w) continue;
          want[e] = cid;
          const key = ((h * 2 + baseW) * 64 + (r.gen & 63)) | 0;
          c.wantA = (c.wantA + figMix(key)) | 0;
          c.wantB = (c.wantB ^ figMix(key ^ 0x5bd1e995)) | 0;
          c.wantN++;
          nextE[e] = c.head;
          c.head = e;
          if (!member) c.adds++;
        }
        if (isStatic) {
          let fc = drawableClass(h, kFig, cls, !r.ghost && baseW === 1);
          let bc = 0;
          if (r.ghost && baseW) bc = drawableClass(h, FIG_KIND_MID, cls, true);
          else if (baseW) bc = fc;
          let ok = fc > 0 && (!baseW || bc > 0);
          // A settled member that moved out of its part's sphere would be culled wrongly: rebuild, draw it instanced.
          if (ok && xfDirty[h]) {
            const ef = o4 + kFig + (fc === 2 ? 1 : 0);
            if (!insidePart(h, ef)) {
              chunks[mem[ef]].force = true;
              ok = false;
            }
            if (ok && r.ghost && bc) {
              const eb = o4 + FIG_KIND_MID + (bc === 2 ? 1 : 0);
              if (!insidePart(h, eb)) {
                chunks[mem[eb]].force = true;
                ok = false;
              }
            }
          }
          if (!ok) {
            fc = 0;
            bc = 0;
            for (let kind = 0; kind < 4; kind++) if (want[o4 + kind] >= 0 && mem[o4 + kind] !== want[o4 + kind]) chunks[want[o4 + kind]].urgent++;
          }
          drawF[h] = fc;
          drawB[h] = bc;
          chunkOk[h] = ok ? 1 : 0;
        }
        if (L === 0) {
          fin[h] = 0;
          // Full-detail priority (1e): the held figurine, then the aimed one, then by distance weighted by the offset
          // from the screen centre (what the player looks at keeps the detail when the cap bites).
          let key = 0;
          if (!focus[h]) {
            let off = 0;
            if (haveCam) {
              figV2.set(center[h * 4], center[h * 4 + 1], center[h * 4 + 2]).applyMatrix4(figPS);
              off = Math.min(2, Math.hypot(figV2.x, figV2.y));
            }
            key = rim[h] > 0 ? 1 : Math.floor(dist[h] * (1 + 0.75 * off) * 1000) + 2;
          }
          cand0[n0++] = key * FIG_HANDLE_MUL + h;
        } else if (chunkOk[h]) fin[h] = -2;
        else {
          fin[h] = L;
          if (L === 1) cand1[n1++] = Math.floor(dist[h] * 1000) * FIG_HANDLE_MUL + h;
        }
      }
      // Full-detail cap (count and, 1e, the tier's full-detail triangle budget tri0): the lowest priority are demoted
      // (to their batch when they are members, else to the mid LOD).
      const tri0 = T.tri0 ? T.tri0 * Math.pow(0.7, detail) : Infinity;
      let keep0 = Math.min(n0, max0);
      if (n0 > 1 && tri0 < Infinity) {
        const c0 = cand0.subarray(0, n0);
        c0.sort();
        let acc = 0;
        for (let i = 0; i < keep0; i++) {
          const h = c0[i] % FIG_HANDLE_MUL;
          acc += recs[designIdx[h]].tris[0];
          if (acc > tri0 && i > 0 && !focus[h]) {
            keep0 = i;
            break;
          }
        }
      } else if (n0 > max0) cand0.subarray(0, n0).sort();
      FIG_STATS.cap0 = n0 - keep0;
      if (n0 > keep0) {
        const c0 = cand0.subarray(0, n0);
        for (let i = keep0; i < n0; i++) {
          const h = c0[i] % FIG_HANDLE_MUL;
          if (focus[h]) continue;
          if (chunkOk[h]) fin[h] = -2;
          else {
            fin[h] = 1;
            cand1[n1++] = Math.floor(dist[h] * 1000) * FIG_HANDLE_MUL + h;
          }
        }
      }
      // Mid-LOD instance cap (moving figurines): the farthest drop to the far LOD.
      if (n1 > max1) {
        const c1 = cand1.subarray(0, n1);
        c1.sort();
        for (let i = max1; i < n1; i++) fin[c1[i] % FIG_HANDLE_MUL] = 2;
      }

      /* Pass 2: transform texture rows of batched handles, instanced writes for the rest */
      let nNear = 0;
      let nMid = 0;
      let nFar = 0;
      let nCull = 0;
      let nBatch = 0;
      let nCovered = 0;
      let bMid = 0;
      let olH = -1;
      let olV = 0.02;
      let loose = 0;
      let shelf = 0;
      let instTris = 0;
      for (let h = 0; h < n; h++) {
        const L = fin[h];
        if (L === -1 || L === -3) {
          // -3: posed but drawn by its impostor quad (or by nothing while cold); its pose and effects count as seen.
          if (L === -3) {
            poseDirty[h] = 0;
            fxDirty[h] = 0;
          }
          if (xfState[h]) {
            xf.zero(h);
            xfState[h] = 0;
          }
          continue;
        }
        const m = mode[h];
        if (m === FIG_MODE.LOOSE) loose++;
        else shelf++;
        if (cover[h]) nCovered++;
        const r = recs[designIdx[h]];
        const glow = fx[h * 2];
        const flash = fx[h * 2 + 1];
        const shim = m === FIG_MODE.SHELF ? shimmer[r.catIndex] : 0;
        const dirtyH = poseDirty[h] | fxDirty[h];
        const fxCh = fxDirty[h];
        // An effects-only change (a pulsing glint, the aim rim) uploads only the effects attribute (F3).
        const poseH = poseDirty[h];
        poseDirty[h] = 0;
        fxDirty[h] = 0;
        if (L === -2) {
          const f = drawF[h];
          const b = drawB[h];
          const st = f | (b << 2);
          // Effects texel only for batched handles (instanced ones carry their effects per instance).
          if (fxCh || xfState[h] !== st) xf.fx(h, rim[h], glow, flash, shim);
          if (xfState[h] !== st || xfDirty[h]) {
            writeRows(h, r, f, b);
            xfState[h] = st;
            xfDirty[h] = 0;
          }
          const o4 = h * 4;
          const kFig = r.ghost ? FIG_KIND_GMID : FIG_KIND_MID;
          const cf = chunks[mem[o4 + kFig + (f === 2 ? 1 : 0)]];
          cf.live++;
          cf.liveTris += r.bsrc[f].tris + (b && !r.ghost ? baseSrc[b].tris : 0);
          if (r.ghost && b) {
            const cb = chunks[mem[o4 + FIG_KIND_MID + (b === 2 ? 1 : 0)]];
            cb.live++;
            cb.liveTris += baseSrc[b].tris;
          }
          nBatch++;
          if (f === 1) bMid++;
          // Shading path of its opaque part (figure and base, or a ghost's base): per vertex while small on screen,
          // per pixel when large or on Magas (hysteresis as the LOD); the part's two draws each collapse the other set.
          const oe = r.ghost ? (b ? o4 + FIG_KIND_MID + (b === 2 ? 1 : 0) : -1) : o4 + kFig + (f === 2 ? 1 : 0);
          if (oe >= 0) {
            const op = chunks[mem[oe]].parts[memPart[oe]];
            let pp = 1;
            if (FIG_MATERIALS.figureBatchVlitOn) {
              const tp = (r.ghost ? b : f) === 2 ? T.ppFar : T.ppMid;
              // A covered pile figurine (something rests on it; NOTES-piles-economy.md 9) is mostly hidden by the
              // ones on top: it never asks for per-pixel shading, so a zoomed pile's batches stay per vertex.
              const wish = !cover[h] && hpxA[h] >= tp * (ppWish[h] ? 1 - FIG_PERF.hyst : 1 + FIG_PERF.hyst) ? 1 : 0;
              ppWish[h] = wish;
              // One shading path per batch part (1e): a part whose members mostly ask for per-pixel shading is drawn
              // per pixel as a whole, so it is not drawn twice (each of the two draws vertex-shades the whole part); a
              // part with only a few large members keeps the two draws (per-pixel shading of all would cost more).
              pp = wish;
              if (op) {
                op.wN = (op.wN || 0) + 1;
                if (wish) op.wP = (op.wP || 0) + 1;
                else if (op.ppOn) pp = 1;
              }
            }
            if (pp !== shadePP[h]) {
              shadePP[h] = pp;
              xf.mode(h, pp);
            }
            if (op) {
              if (pp) op.nPP++;
              else op.nVL++;
            }
          }
          continue;
        }
        if (xfState[h]) {
          xf.zero(h);
          xfState[h] = 0;
        }
        if (haveCam) {
          figSphere.center.set(center[h * 4], center[h * 4 + 1], center[h * 4 + 2]);
          figSphere.radius = center[h * 4 + 3];
          if (!figFrustum.intersectsSphere(figSphere)) {
            nCull++;
            continue;
          }
        }
        figM2.fromArray(hm, h * 16);
        if (rim[h] > olV && !r.ext) {
          olV = rim[h];
          olH = h;
        }
        if (r.ext) {
          const e = r.ext;
          const k = e.cnt++;
          e.sig = (Math.imul(e.sig, 31) + h + 1) | 0;
          if (dirtyH) e.dirty = 1;
          for (const em of e.meshes) {
            figM2.toArray(em.instanceMatrix.array, k * 16);
            const a = em.geometry.attributes.figInst.array;
            a[k * 4] = rim[h];
            a[k * 4 + 1] = glow;
            a[k * 4 + 2] = flash;
            a[k * 4 + 3] = shim;
          }
          instTris += e.tris;
        } else {
          const k = r.cnt[L]++;
          r.sig[L] = (Math.imul(r.sig[L], 31) + h + 1) | 0;
          if (poseH) r.dirty[L] = 1;
          else if (fxCh) r.fxd[L] = 1;
          const mesh = r.meshes[L];
          figM1.multiplyMatrices(figM2, r.local[L]);
          figM1.toArray(mesh.instanceMatrix.array, k * 16);
          const a = mesh.geometry.attributes.figInst.array;
          a[k * 4] = rim[h];
          a[k * 4 + 1] = glow;
          a[k * 4 + 2] = flash;
          a[k * 4 + 3] = shim;
          instTris += r.tris[L] * (r.ghost ? 2 : 1);
        }
        if (L === 0) nNear++;
        else if (L === 1) nMid++;
        else nFar++;
        if (wantBase[h]) {
          const b = bases[L];
          const k = b.cnt++;
          b.sig = (Math.imul(b.sig, 31) + h + 1) | 0;
          if (poseH) b.dirty = 1;
          else if (fxCh) b.fxd = 1;
          baseLocal.makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM);
          figM1.multiplyMatrices(figM2, baseLocal);
          figM1.toArray(b.mesh.instanceMatrix.array, k * 16);
          const c = b.cat.array;
          c[k * 4] = r.ringLin[0];
          c[k * 4 + 1] = r.ringLin[1];
          c[k * 4 + 2] = r.ringLin[2];
          c[k * 4 + 3] = r.cell;
          const a = b.inst.array;
          a[k * 4] = rim[h];
          a[k * 4 + 1] = glow * 0.5;
          a[k * 4 + 2] = flash * 0.5;
          a[k * 4 + 3] = 0;
          instTris += b.tris;
        }
      }
      let draws = 0;
      for (const r of recs) {
        for (let l = 0; l < 3; l++) {
          const mesh = r.meshes[l];
          const c = r.cold ? 0 : r.cnt[l];
          mesh.count = c;
          mesh.visible = c > 0 && !r.ext;
          if (r.depth) {
            r.depth[l].count = c;
            r.depth[l].visible = mesh.visible;
          }
          if (c > 0) {
            if (r.dirty[l] || r.sig[l] !== r.prevSig[l]) {
              frameUpload += figUpload(mesh.instanceMatrix, c, 16) + figUpload(mesh.geometry.attributes.figInst, c, 4);
              r.prevSig[l] = r.sig[l];
              r.force[l] = 0;
            } else if (r.fxd[l]) frameUpload += figUpload(mesh.geometry.attributes.figInst, c, 4);
            draws += r.ghost ? 2 : 1;
          } else r.force[l] = 1; // handles may move while undrawn: upload again when the mesh reappears
        }
      }
      for (const e of extList) {
        const up = e.dirty || e.sig !== e.prevSig;
        for (const em of e.meshes) {
          em.count = e.cnt;
          em.visible = e.cnt > 0;
          if (e.cnt > 0) {
            if (up) frameUpload += figUpload(em.instanceMatrix, e.cnt, 16) + figUpload(em.geometry.attributes.figInst, e.cnt, 4);
            draws++;
          }
        }
        if (up && e.cnt > 0) {
          e.prevSig = e.sig;
          e.force = 0;
        } else if (e.cnt === 0) e.force = 1;
      }
      for (const b of bases) {
        b.mesh.count = b.cnt;
        b.mesh.visible = b.cnt > 0;
        if (b.cnt > 0) {
          if (b.dirty || b.sig !== b.prevSig) {
            frameUpload += figUpload(b.mesh.instanceMatrix, b.cnt, 16) + figUpload(b.cat, b.cnt, 4) + figUpload(b.inst, b.cnt, 4);
            b.prevSig = b.sig;
            b.force = 0;
          } else if (b.fxd) frameUpload += figUpload(b.inst, b.cnt, 4);
          draws++;
        } else b.force = 1;
      }
      // Aim outline around the most highlighted visible handle (figure, then its base), mid-LOD hull.
      outline[0].visible = false;
      outline[1].visible = false;
      if (olH >= 0) {
        const r = recs[designIdx[olH]];
        figM2.fromArray(hm, olH * 16);
        outline[0].geometry = r.meshes[1].geometry;
        figM1.multiplyMatrices(figM2, r.local[1]);
        outline[0].setMatrixAt(0, figM1);
        outline[0].instanceMatrix.needsUpdate = true;
        outline[0].visible = true;
        draws++;
        instTris += r.tris[1];
        if (wantBase[olH]) {
          outline[1].geometry = bases[1].mesh.geometry;
          baseLocal.makeScale(r.baseScale * FIG_CM, FIG_CM, r.baseScale * FIG_CM);
          figM1.multiplyMatrices(figM2, baseLocal);
          outline[1].setMatrixAt(0, figM1);
          outline[1].instanceMatrix.needsUpdate = true;
          outline[1].visible = true;
          draws++;
          instTris += bases[1].tris;
        }
        FIG_MATERIALS.outline.uniforms.uAmount.value = Math.min(1, olV);
      }
      if (warmOn) draws += warm.length;

      /* Region batches: visibility, statistics, compaction and the time-sliced rebuilds (highest priority first) */
      let chunkTris = 0;
      let liveTris = 0;
      let inView = 0;
      let liveChunks = 0;
      for (const c of chunks) {
        c.inView = false;
        if (c.parts.length) liveChunks++;
        const gh = FIG_KIND_GHOST[c.kind];
        let cx = 0;
        let cy = 0;
        let cz = 0;
        for (const p of c.parts) {
          const vis = !haveCam || figFrustum.intersectsSphere(p.sphere);
          // Opaque parts: the per-vertex draw and the per-pixel twin only when they have members to draw.
          let nd = 2;
          if (!gh) {
            p.mesh.visible = p.nVL > 0;
            p.pp.visible = p.nPP > 0;
            nd = (p.nVL > 0 ? 1 : 0) + (p.nPP > 0 ? 1 : 0);
          }
          if (vis) {
            c.inView = true;
            draws += nd;
            chunkTris += p.tris * nd;
          }
          cx = p.sphere.center.x;
          cy = p.sphere.center.y;
          cz = p.sphere.center.z;
        }
        if (!c.parts.length && c.head >= 0) {
          const hh = c.head >> 2;
          cx = center[hh * 4];
          cy = center[hh * 4 + 1];
          cz = center[hh * 4 + 2];
          if (haveCam) {
            figSphere.center.set(cx, cy, cz);
            figSphere.radius = 1.5;
            c.inView = figFrustum.intersectsSphere(figSphere);
          }
        }
        if (c.inView) {
          inView++;
          liveTris += c.liveTris;
        }
        c.dist = haveCam ? Math.hypot(cx - camPos.x, cy - camPos.y, cz - camPos.z) : 0;
        // Compaction: a batch that holds many members it no longer draws (their triangles are collapsed but still
        // vertex-shaded) drops the ones it keeps only lazily on its next rebuild.
        const nm = c.members ? c.members.length : 0;
        if (nm && !c.compact) {
          const age = nowS - c.lastBuild;
          const waste = c.lazyTris;
          if (age > FIG_PERF.compactS && ((waste > FIG_PERF.compactTris && waste > c.tris * FIG_PERF.compactShare) || c.lazy > nm * 0.5)) c.compact = true;
          else if (age > FIG_PERF.compactFastS && waste > FIG_PERF.compactFastTris) c.compact = true;
        }
      }
      // F7: static figurines no batch can draw yet are drawn instanced (draw calls and triangles over budget after
      // picks and throws): the more of them, the larger the rebuild budget (up to twice the tier's), and the chunks
      // that hold most of them go first.
      let stragglers = 0;
      for (const c of chunks) stragglers += c.urgent;
      const budget = budgetOverride > 0 ? budgetOverride : T.budgetMs * (1 + Math.min(1, stragglers / 40));
      const tb = performance.now();
      const deadline = tb + budget;
      pendingChunks = 0;
      for (let guard = 0; guard <= chunks.length; guard++) {
        if (job) {
          // Continue the rebuild in flight (members copied until the frame's rebuild budget is spent).
          if (job.j.step(deadline)) landJob();
          if (performance.now() > deadline) break;
          continue;
        }
        let best = null;
        let bestScore = Infinity;
        let pending = 0;
        for (const c of chunks) {
          if (!chunkDirty(c)) continue;
          pending++;
          if (!budgetOverride && !c.force && !c.urgent) {
            const wait = c.adds ? (FIG_KIND_CLS[c.kind] === 2 ? FIG_PERF.minRebuildFarS : FIG_PERF.minRebuildS) : c.lazyTris > FIG_PERF.compactFastTris ? FIG_PERF.compactFastS : FIG_PERF.compactS;
            if (nowS - c.lastBuild < wait) continue;
          }
          const score = (c.inView ? 0 : 100) + c.dist - (c.urgent ? 50 + Math.min(40, c.urgent * 2) : 0) - (c.adds ? 20 : 0);
          if (score < bestScore) {
            bestScore = score;
            best = c;
          }
        }
        pendingChunks = pending;
        if (!best) break;
        startJob(best);
      }
      if (job) pendingChunks = Math.max(1, pendingChunks);
      const rebuildMs = performance.now() - tb;
      // Triangle budget: thresholds rise 10 % per frame while over it, and fall back 2 % per frame well below it.
      // Measured on the drawn triangles (members a batch holds for an LOD switch but does not draw are collapsed).
      const figTris = instTris + chunkTris;
      const drawnTris = instTris + liveTris;
      // 1e: the processed triangles count (figTris: collapsed members are vertex-shaded too), the per-view cap.
      if (forceLod < 0) {
        if (figTris > T.tris) adapt = Math.min(4, adapt * 1.1);
        else if (figTris < T.tris * 0.85) adapt = Math.max(1, adapt * 0.98);
      }
      frameUpload += xf.flush();
      info.near = nNear;
      info.mid = nMid + bMid;
      info.far = nFar + (nBatch - bMid);
      info.culled = nCull;
      info.batched = nBatch;
      info.loose = loose;
      info.shelf = shelf;
      info.trisEstimate = figTris;
      info.drawCallsMax = draws;
      info.impostors = nImp;
      info.cold = nCold;
      FIG_STATS.kit = kit;
      FIG_STATS.draws = draws;
      FIG_STATS.tris = figTris;
      FIG_STATS.instTris = instTris;
      FIG_STATS.chunkTris = chunkTris;
      FIG_STATS.liveTris = drawnTris;
      FIG_STATS.lod0 = nNear;
      FIG_STATS.lod1 = nMid + bMid;
      FIG_STATS.far = nFar + (nBatch - bMid);
      FIG_STATS.batched = nBatch;
      FIG_STATS.covered = nCovered;
      FIG_STATS.culled = nCull;
      FIG_STATS.rebuildMs = rebuildMs;
      FIG_STATS.uploadBytesFrame = frameUpload;
      FIG_STATS.chunks = liveChunks;
      FIG_STATS.chunksInView = inView;
      FIG_STATS.dirtyChunks = pendingChunks;
      FIG_STATS.adapt = adapt;
      FIG_STATS.impostors = nImp;
      FIG_STATS.cold = nCold;
      primed = true;
      FIG_STATS.updateMs = performance.now() - tStart - rebuildMs;
    },
    setQuality(q) {
      figApplyQuality(q);
      tier = figTierId(q);
      T = FIG_TIER[tier];
      adapt = 1;
      for (const r of recs) for (let l = 0; l < 3; l++) if (r.meshes[l]) r.meshes[l].material = figMatFor(r, l);
      bases.forEach((b, l) => {
        b.mesh.material = l === 0 ? FIG_MATERIALS.base0 : FIG_MATERIALS.baseLod;
      });
      setWarm(warmOn);
    },
    /** Replaces the procedural figure of a design with an external one (pose-space geometry, metres). */
    registerExternalFigure(designId, ext) {
      const r = recById[designId];
      if (!r || !ext || !ext.meshesByMaterial || !ext.meshesByMaterial.length) return false;
      if (r.ext) return true;
      const cap = r.handles.length;
      const e = { id: designId, meshes: [], cnt: 0, tris: ext.tris || 0, sig: 0, prevSig: 0, dirty: 1, force: 1 };
      for (const part of ext.meshesByMaterial) {
        const g = part.geometry.clone();
        g.setAttribute('figInst', figInstAttr(cap, 4));
        g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e4);
        figPatchExternal(part.material);
        const m = figInstanced(g, part.material, cap);
        m.name = `fig:ext:${designId}`;
        m.visible = false;
        e.meshes.push(m);
        meshes.push(m);
        group.add(m);
      }
      r.ext = e;
      extList.push(e);
      for (const h of r.handles) {
        lod[h] = -1;
        poseDirty[h] = 1;
      }
      info.externalIds.push(designId);
      return true;
    },
    /** Loads the models listed in assets/figures/index.json one at a time. Resolves the applied ids; never rejects. */
    async loadExternalModels() {
      const applied = [];
      try {
        const index = await loadExternalFigureIndex();
        for (const id of Object.keys(index)) {
          if (!recById[id] || recById[id].ext) continue;
          const ext = await loadExternalFigure(id);
          if (ext && kit.registerExternalFigure(id, ext)) applied.push(id);
          await new Promise((res) => requestAnimationFrame(() => res()));
        }
      } catch (err) {
        console.warn('[figures] external models', err);
      }
      return applied;
    },
    whenLoaded() {
      return figWhenLoaded();
    },
    getInfo() {
      let m = recs.length * 3 + bases.length + extList.reduce((s, e) => s + e.meshes.length, 0);
      for (const c of chunks) m += c.parts.length;
      info.meshes = m;
      info.loaded = FIG_LOAD.loaded;
      info.baked = FIG_LOAD.total;
      return info;
    },
    /** GPU bytes of every figure buffer (geometry, instance data, batches) and texture (PERF-PLAN 5.5). */
    gpuMemory() {
      const seen = new Set();
      let buffers = 0;
      let cpu = 0;
      const addAttr = (a) => {
        // Interleaved attributes share one buffer: count it once.
        const d = a && a.isInterleavedBufferAttribute ? a.data : a;
        if (d && !seen.has(d)) {
          seen.add(d);
          buffers += figAttrBytes(a);
          if (d.array) cpu += d.array.byteLength;
        }
      };
      const addMesh = (m) => {
        const g = m.geometry;
        for (const k in g.attributes) addAttr(g.attributes[k]);
        addAttr(g.index);
        if (m.isInstancedMesh) addAttr(m.instanceMatrix);
      };
      for (const r of recs) {
        // A cold content type's buffers were disposed with its pack (their attributes still carry the uploaded flag).
        if (r.cold) continue;
        for (const m of r.meshes) if (m) addMesh(m);
        if (r.depth) for (const m of r.depth) if (m) addMesh(m);
      }
      for (const b of bases) addMesh(b.mesh);
      for (const m of outline) addAttr(m.instanceMatrix);
      for (const m of warm) addMesh(m);
      for (const e of extList) for (const m of e.meshes) addMesh(m);
      for (const c of chunks) {
        for (const p of c.parts) {
          buffers += p.bytes;
          if (keepCpu) cpu += p.bytes;
        }
      }
      // CPU side also: the design LODs no mesh references (batch sources, float copies) and the transform texture.
      for (const r of recs) {
        if (r.cold) continue;
        const geo = figGeo(r.id);
        for (const e of geo.lods) {
          for (const k in e.geometry.attributes) {
            const a = e.geometry.attributes[k];
            if (!seen.has(a)) {
              seen.add(a);
              if (a.array) cpu += a.array.byteLength;
            }
          }
          if (e.far && !seen.has(e.far)) {
            seen.add(e.far);
            cpu += e.far.pos.byteLength + e.far.nrm.byteLength;
          }
          for (const bs of [e.bsrcC, e.bsrcI]) {
            if (bs && !seen.has(bs)) {
              seen.add(bs);
              cpu += bs.cpuBytes;
            }
          }
        }
      }
      cpu += xf.data.byteLength;
      const textures = xf.bytes + (figAtlasTex ? figAtlasTex.figBytes || 0 : 0);
      return { buffers, textures, cpu };
    },
    /** Development diagnostics (PERF-PLAN 5.6). */
    debug: {
      /** Region batches on / off (off: every handle is drawn instanced; for comparisons). */
      batching(on) {
        batching = !!on;
      },
      forceLod(l) {
        kit.setForceLod(l);
      },
      showRegions(on) {
        showRegions(on);
      },
      stats() {
        return {
          ...figureRenderStats(),
          tier, detail, viewH,
          chunkList: chunks.filter((c) => c.parts.length || c.wantN).map((c) => ({
            key: c.key, members: c.members ? c.members.length : 0, want: c.wantN, live: c.live, parts: c.parts.length, tris: c.parts.reduce((s, p) => s + p.tris, 0),
            kb: Math.round(c.bytes / 1024), inView: c.inView, dist: +c.dist.toFixed(2), dirty: chunkDirty(c), compact: c.compact,
            r: c.parts.length ? +Math.max(...c.parts.map((p) => p.sphere.radius)).toFixed(2) : 0,
          })),
        };
      },
      handle(h) {
        const o = h * 4;
        return {
          mode: mode[h], lod: lod[h], fin: fin[h], still: still[h], cover: cover[h], focus: focus[h], dist: dist[h],
          reg: [reg[o], reg[o + 1], reg[o + 2], reg[o + 3]], want: [want[o], want[o + 1], want[o + 2], want[o + 3]],
          mem: [mem[o], mem[o + 1], mem[o + 2], mem[o + 3]], drawF: drawF[h], drawB: drawB[h], xf: xfState[h],
          imp: { ok: impOk[h], want: impW[h], alpha: impA[h] }, cold: recs[designIdx[h]].cold,
        };
      },
    },
    dispose() {
      FIG_LOAD.listeners.delete(listener);
      scene.remove(group);
      for (const ms of meshes) {
        figDisposeOwn(ms.geometry, FIG_SHARED_ATTRS);
        ms.dispose();
      }
      for (const c of chunks) for (const p of c.parts) p.mesh.geometry.dispose();
      warmInstGeo.dispose();
      warmBatchGeo.dispose();
      xf.tex.dispose();
      if (FIG_STATS.kit === kit) FIG_STATS.kit = null;
    },
  };
  FIG_STATS.kit = kit;
  return kit;
}

const figIdentity = new THREE.Matrix4();

/** Float copy of a decoded LOD entry (for the far batch), positions and normals already dequantised to cm. */
function figFloatCopy(e) {
  if (e.far) return e.far;
  const g = e.geometry;
  const p = g.attributes.position;
  const nV = p.count;
  const fp = new Float32Array(nV * 3);
  const fn = new Float32Array(nV * 3);
  const oct = g.attributes.aOct.array;
  for (let v = 0; v < nV; v++) {
    figV1.set(p.getX(v), p.getY(v), p.getZ(v)).applyMatrix4(e.dequant);
    fp[v * 3] = figV1.x;
    fp[v * 3 + 1] = figV1.y;
    fp[v * 3 + 2] = figV1.z;
    figOctDecode(oct[v * 2], oct[v * 2 + 1], fn, v * 3);
  }
  e.far = { pos: fp, nrm: fn, col: g.attributes.aCol.array, pbr: g.attributes.aPbr.array, index: g.index.array };
  return e.far;
}

/* ---- single-design instancer (preview, finale casting) ------------------------------------------- */

/**
 * DESIGN.md 16.5 low-level instancer: full-detail figure (+ base) of one design, capacity maxCount; opts.lod 1 draws
 * the mid LOD instead (finale casting below the Magas tier). setInstance(i, matrix) takes a pose-space -> world matrix
 * (base bottom centre).
 */
function createFigureInstancer(scene, designId, maxCount, opts = { withBase: true }) {
  initFigureMaterials();
  figStartLoading();
  const d = FIG_BY_ID[designId];
  if (!d) throw new Error(`[figures] unknown design ${designId}`);
  const cap = Math.max(1, maxCount);
  const mats = new Float32Array(cap * 16);
  const local = new THREE.Matrix4();
  const inst = figInstAttr(cap, 4);
  const geo = figGeo(designId);
  const lodI = opts.lod === 1 ? 1 : 0;
  let met = getFigureMetrics(designId);
  figLocalMatrix(geo.lods[lodI], met.baseH, local);
  const figMat = d.translucent ? FIG_MATERIALS.glass : lodI ? FIG_MATERIALS.figureLod : FIG_MATERIALS.figure;
  const fig = figInstanced(figInstGeometry(geo.lods[lodI].geometry, { figInst: inst }), figMat, cap);
  fig.name = `fig:instancer:${designId}`;
  const meshes = [fig];
  let depth = null;
  if (d.translucent) {
    // Same depth pre-pass as in the kit (see figGhostDepthMaterial).
    fig.renderOrder = 2;
    depth = figInstanced(fig.geometry, figGhostDepthMaterial(false), 1);
    depth.instanceMatrix = fig.instanceMatrix;
    depth.renderOrder = 1;
    depth.name = `fig:instancer-depth:${designId}`;
    meshes.push(depth);
  }
  let base = null;
  let baseCat = null;
  if (opts.withBase !== false && !d.ownBase) {
    baseCat = figInstAttr(cap, 4);
    const cat = FIG_CATEGORIES[FIG_CATEGORY_INDEX[d.category]];
    figCol1.set(cat ? cat.color : '#8e8169').convertSRGBToLinear();
    for (let i = 0; i < cap; i++) baseCat.setXYZW(i, figCol1.r, figCol1.g, figCol1.b, cat ? cat.index : 0);
    base = figInstanced(figInstGeometry(figBuildBase(lodI).geometry, { figBaseCat: baseCat, figInst: figInstAttr(cap, 4) }), lodI ? FIG_MATERIALS.baseLod : FIG_MATERIALS.base, cap);
    base.name = `fig:instancer-base:${designId}`;
    meshes.push(base);
  }
  for (const m of meshes) scene.add(m);
  const baseLocal = new THREE.Matrix4().makeScale((d.baseR / 30) * FIG_CM, FIG_CM, (d.baseR / 30) * FIG_CM);
  let count = 0;
  let maxSet = 0;
  function writeAll() {
    for (let i = 0; i < maxSet; i++) {
      figM2.fromArray(mats, i * 16);
      figM1.multiplyMatrices(figM2, local).toArray(fig.instanceMatrix.array, i * 16);
      if (base) figM1.multiplyMatrices(figM2, baseLocal).toArray(base.instanceMatrix.array, i * 16);
    }
    fig.instanceMatrix.needsUpdate = true;
    if (base) base.instanceMatrix.needsUpdate = true;
  }
  const listener = {
    onDesignLoaded(id) {
      if (id !== designId) return;
      met = getFigureMetrics(designId);
      figLocalMatrix(geo.lods[lodI], met.baseH, local);
      const old = fig.geometry;
      fig.geometry = figInstGeometry(geo.lods[lodI].geometry, { figInst: inst });
      if (depth) depth.geometry = fig.geometry;
      // The instance attribute moves to the new geometry: only the old shared attributes are detached.
      figDisposeOwn(old, [...FIG_SHARED_ATTRS, 'figInst']);
      writeAll();
    },
  };
  FIG_LOAD.listeners.add(listener);
  return {
    meshes,
    get count() {
      return count;
    },
    set count(v) {
      count = Math.max(0, Math.min(cap, v));
      for (const m of meshes) m.count = count;
    },
    setInstance(i, matrix) {
      if (i < 0 || i >= cap) return;
      matrix.toArray(mats, i * 16);
      if (i + 1 > maxSet) maxSet = i + 1;
      figM1.multiplyMatrices(matrix, local).toArray(fig.instanceMatrix.array, i * 16);
      if (base) figM1.multiplyMatrices(matrix, baseLocal).toArray(base.instanceMatrix.array, i * 16);
    },
    setFx(i, glow, flash) {
      inst.setXYZW(i, 0, glow, flash, 0);
      inst.needsUpdate = true;
    },
    commit() {
      fig.instanceMatrix.needsUpdate = true;
      if (base) base.instanceMatrix.needsUpdate = true;
    },
    dispose() {
      FIG_LOAD.listeners.delete(listener);
      for (const m of meshes) scene.remove(m);
      // The design and base geometries are shared with the kit (their CPU arrays may be released): dispose only
      // this instancer's own instance attributes and vertex arrays.
      figDisposeOwn(fig.geometry, FIG_SHARED_ATTRS);
      fig.dispose();
      if (depth) depth.dispose();
      if (base) {
        figDisposeOwn(base.geometry, FIG_SHARED_ATTRS);
        base.dispose();
      }
    },
  };
}

/* ---- external models --------------------------------------------------------------------------- */

let figExtIndexPromise = null;
let figGltfLoaderPromise = null;

/** Fetches assets/figures/index.json once. Resolves { [designId]: { file, tris, materials } } ({} on any failure). */
function loadExternalFigureIndex() {
  if (!figExtIndexPromise) {
    figExtIndexPromise = fetch('assets/figures/index.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : { models: {} }))
      .then((j) => (j && j.models) || {})
      .catch(() => ({}));
  }
  return figExtIndexPromise;
}

/**
 * Loads and normalises one external model: bottom centre at the origin, height = the procedural figure height,
 * lifted onto the game's base (ownBase designs: scaled to the total height, no lift), merged per material.
 * Resolves null on any failure (console.warn only).
 */
async function loadExternalFigure(designId) {
  try {
    const index = await loadExternalFigureIndex();
    const entry = index[designId];
    if (!entry) return null;
    if (!figGltfLoaderPromise) figGltfLoaderPromise = import('three/addons/loaders/GLTFLoader.js').then((m) => new m.GLTFLoader());
    const loader = await figGltfLoaderPromise;
    const gltf = await loader.loadAsync(`assets/figures/${entry.file}`);
    const d = FIG_BY_ID[designId];
    const met = getFigureMetrics(designId);
    const root = gltf.scene;
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    if (!(size.y > 1e-6)) throw new Error('empty model');
    const targetH = d.ownBase ? met.totalH : met.figH;
    const s = targetH / size.y;
    const norm = new THREE.Matrix4().makeTranslation(0, d.ownBase ? 0 : met.baseH, 0)
      .multiply(new THREE.Matrix4().makeScale(s, s, s))
      .multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
    const byMat = new Map();
    let tris = 0;
    root.traverse((o) => {
      if (!o.isMesh) return;
      if (o.isSkinnedMesh || Array.isArray(o.material)) throw new Error('skinned or multi-material mesh');
      const g = o.geometry.clone();
      for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv', 'color'].includes(k)) g.deleteAttribute(k);
      g.morphAttributes = {};
      g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(norm, o.matrixWorld));
      if (!g.attributes.normal) g.computeVertexNormals();
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      if (!byMat.has(o.material)) byMat.set(o.material, []);
      byMat.get(o.material).push(g);
    });
    if (!byMat.size) throw new Error('no meshes');
    if (byMat.size > 4) throw new Error(`${byMat.size} materials (at most 4)`);
    const meshesByMaterial = [];
    for (const [material, geos] of byMat) {
      if (!material.isMeshStandardMaterial) throw new Error('unsupported material type');
      const common = Object.keys(geos[0].attributes).filter((k) => geos.every((g) => g.attributes[k]));
      for (const g of geos) for (const k of Object.keys(g.attributes)) if (!common.includes(k)) g.deleteAttribute(k);
      const list = geos.every((g) => g.index) ? geos : geos.map((g) => (g.index ? g.toNonIndexed() : g));
      const merged = list.length > 1 ? mergeGeometries(list, false) : list[0];
      if (!merged) throw new Error('merge failed');
      meshesByMaterial.push({ geometry: merged, material });
    }
    return { meshesByMaterial, height: targetH, tris };
  } catch (err) {
    console.warn('[figures] external model failed', designId, err);
    return null;
  }
}

/* ---- the free-flying Snitch ------------------------------------------------------------------------ */

/**
 * DESIGN.md 16.5: walnut-sized polished gold ball with two fluttering feather wings (2 draws, no base). The gold is
 * Physical (clearcoat) only on the Magas tier; the translucent wings render in a single pass (PERF-PLAN F8).
 */
function createSnitchFlyer(scene) {
  const group = new THREE.Group();
  group.name = 'fig:snitch';
  // Modelled at the original statuette scale; follows the global figurine scale like every other figure.
  group.scale.setScalar(FIG_SCALE);
  const goldPhys = new THREE.MeshPhysicalMaterial({ color: 0xe0b24a, metalness: 1, roughness: 0.16, clearcoat: 0.6, emissive: 0x3a2606, emissiveIntensity: 0.6 });
  const goldStd = new THREE.MeshStandardMaterial({ color: 0xe0b24a, metalness: 1, roughness: 0.16, emissive: 0x3a2606, emissiveIntensity: 0.6 });
  goldPhys.name = 'fig:snitch-gold-phys';
  goldStd.name = 'fig:snitch-gold';
  const R = 0.017;
  const ballGeo = new THREE.SphereGeometry(R, 24, 16);
  const seam1 = new THREE.TorusGeometry(R * 1.01, R * 0.05, 6, 32);
  const seam2 = seam1.clone().rotateY(Math.PI / 2);
  const ball = new THREE.Mesh(mergeGeometries([ballGeo, seam1, seam2].map((g) => (g.index ? g.toNonIndexed() : g)), false), figTierId(FIG_MATERIALS.quality) === 'magas' ? goldPhys : goldStd);
  group.add(ball);
  /* Feather wing: a curved blade with scalloped trailing edge, ribs from vertex shading */
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.012, 0.012, 0.05, 0.02, 0.075, 0.012);
  const scallops = 6;
  for (let i = 0; i < scallops; i++) {
    const t0 = i / scallops;
    const t1 = (i + 1) / scallops;
    const x0 = 0.075 * (1 - t0);
    const x1 = 0.075 * (1 - t1);
    shape.quadraticCurveTo((x0 + x1) / 2, -0.012 - 0.004 * Math.sin(Math.PI * t0), x1, -0.002 * (1 - t1));
  }
  const wingGeo = new THREE.ShapeGeometry(shape, 6);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0xf6ecd2, metalness: 0.35, roughness: 0.35, side: THREE.DoubleSide, transparent: true, opacity: 0.88, emissive: 0x2a2008 });
  wingMat.forceSinglePass = true;
  wingMat.name = 'fig:snitch-wing';
  const wingL = new THREE.Mesh(wingGeo, wingMat);
  const wingR = new THREE.Mesh(wingGeo, wingMat);
  const pivotL = new THREE.Group();
  const pivotR = new THREE.Group();
  pivotL.position.set(R * 0.8, R * 0.3, -R * 0.2);
  pivotR.position.set(-R * 0.8, R * 0.3, -R * 0.2);
  wingR.scale.x = -1;
  pivotL.add(wingL);
  pivotR.add(wingR);
  group.add(pivotL, pivotR);
  scene.add(group);
  const flyer = {
    object3D: group,
    update(t, flapping = true) {
      const a = flapping ? 0.25 + 0.55 * Math.sin(t * 62) : 0.5;
      pivotL.rotation.set(-0.35, 0.25, a);
      pivotR.rotation.set(-0.35, -0.25, -a);
    },
    setQuality(q) {
      ball.material = figTierId(q) === 'magas' ? goldPhys : goldStd;
    },
    dispose() {
      const i = figSnitchList.indexOf(flyer);
      if (i >= 0) figSnitchList.splice(i, 1);
      scene.remove(group);
      ball.geometry.dispose();
      wingGeo.dispose();
      goldPhys.dispose();
      goldStd.dispose();
      wingMat.dispose();
    },
  };
  figSnitchList.push(flyer);
  return flyer;
}

/* ---- 27-figures-perf.js ---- */
/* ==== 27-figures-perf.js — figure performance layer (PERF-PLAN.md 2.4, F1-F7, F11): quality tiers and the
   pixel-height LOD table, the per-handle transform / effect texture, the batch sources (mid and far LODs and the bases
   in the batch vertex layout), region batches (static figurines merged per pile sector, shelf section, tower or floor
   cell: one draw each, culled by a real bounding sphere) and the figure render statistics. The kit (24) drives it. ==== */

/** Quality tier ids in ascending cost (PERF-PLAN 2.1). */
const FIG_TIER_IDS = ['konnyu', 'kozepes', 'magas'];

/**
 * Pixel-height LOD per tier (PERF-PLAN 2.4). hPx = projected height of the whole figurine (base included) at the
 * scale-1 drawing-buffer height. t0 / t1: LOD0 / LOD1 from this height; max0: LOD0 instances (farthest demoted first);
 * max1: mid-LOD instances drawn instanced (moving figurines; static ones use the region batches); tris: figure triangle
 * budget per frame, counted as processed (instanced + every batch part in view; both thresholds rise by 10 % per frame
 * while it is exceeded and fall back by 2 % per frame); tri0: full-detail triangle budget per frame (1e: the held, the
 * aimed and the figurines nearest the screen centre keep their full detail first); cover1:
 * LOD cap of a pile figurine with something on it (1 = at most LOD1, 2 = far with its base). A figurine under a covered
 * one is far, or LOD1 from FIG_PERF.cover2Up × t0 where cover1 is 1 (integration: zoomed piles showed faceted far
 * bases and blocky robes); cover2NoBase also drops its base. budgetMs: region-batch rebuild time per frame; minH: the
 * pixel heights are measured at least at this buffer height. ppMid / ppFar (integration): batched figurines at least
 * this tall (px, mid / far LOD) are shaded per pixel, smaller ones per vertex (figureBatchVlit; 0 = per pixel only;
 * Infinity = per vertex only): an invisible saving of about 5-10 % GPU on the weak-GPU proxy, so Könnyű uses it too;
 * Magas shades per pixel. The thresholds are tuned down from the plan's starting values (300 / 90 px) to about where
 * the old distance LOD switched at 1080p: at 300 / 90 px the shelf close-up lost the scarf stripes and faces (full
 * detail ended at 0.75 m) and pile figurines turned far at 1.5 m (decision 14). Könnyű keeps the old Xbox tier's LOD
 * table (szoba/TERV.md c).
 *
 * timp (szoba/TERV.md b.2, L3): a static figurine that has an impostor quad (29-figures-impostor.js) and is shorter than
 * this on screen is drawn as its impostor instead of geometry (±FIG_PERF.hyst, dithered cross-fade of FIG_PERF.impFadeS);
 * 0 disables the band.
 */
const FIG_TIER = {
  konnyu: { t0: 200, t1: 60, max0: 24, max1: 160, tris: 750000, tri0: 110000, cover1: 1, cover2NoBase: false, budgetMs: 2, minH: 0, ppMid: 140, ppFar: 80, timp: 34 },
  kozepes: { t0: 180, t1: 52, max0: 32, max1: 220, tris: 1000000, tri0: 150000, cover1: 1, cover2NoBase: false, budgetMs: 2, minH: 0, ppMid: 140, ppFar: 80, timp: 30 },
  magas: { t0: 150, t1: 45, max0: 64, max1: 320, tris: 1600000, tri0: 320000, cover1: 1, cover2NoBase: false, budgetMs: 2.5, minH: 0, ppMid: 0, ppFar: 0, timp: 26 },
};
/**
 * hyst: LOD hysteresis (± share of the threshold); aimT0: the aimed figure's LOD0 height; still: frames a pose must
 * hold to be batched; maxVerts: vertices per batch part (u16 indices); prefetch: a figurine joins its mid batch from
 * this share of the mid upgrade height on (a small margin: every prefetched member costs collapsed vertices);
 * minRebuildS / minRebuildFarS: minimum age of a mid / far batch before it is rebuilt for new members that another
 * batch can still draw meanwhile (at the old LOD; members nothing can draw rebuild at once);
 * compactS / compactTris / compactShare: a batch older than compactS that holds more than compactTris triangles and
 * more than compactShare of its triangles for members it keeps only lazily (no longer wanted), or keeps half its
 * members lazily, drops them (compactFastS / compactFastTris: sooner when that waste is large, e.g. after a jump or a
 * zoom); keepDynS: a member that moves stays in its batch this long while inside it; gridM: floor cell size without a
 * world resolver.
 */
const FIG_PERF = {
  hyst: 0.12, aimT0: 300, still: 10, maxVerts: 60000, prefetch: 0.9, minRebuildS: 0.5, minRebuildFarS: 0.5, compactS: 0.75,
  compactTris: 10000, compactShare: 0.2, compactFastS: 0.25, compactFastTris: 60000, keepDynS: 2, gridM: 3,
  // Batch part capacity (F2): headroom of a new part, and the least share of its capacity a rebuild must fill to reuse it.
  capGrow: 1.2, capShrink: 0.4,
  // A pile figurine buried two deep is drawn at LOD1 instead of far from this share of t0 (integration, decision 14).
  cover2Up: 0.7,
  // Impostor band (szoba/TERV.md b.2): duration of the dithered cross-fade between the geometry and the impostor quad.
  impFadeS: 0.25,
};
/** Sort key multiplier of the per-frame LOD candidate lists (distance in mm × this + handle): up to 65,536 handles. */
const FIG_HANDLE_MUL = 65536;
/** Most handles one kit can have: the batch vertex record carries handle × 4 + part in a normalised u16 (aHid). */
const FIG_MAX_HANDLES = 16383;
/** Shimmer slots of the kit: the legacy categories at their index, the districts from 16 on (figShimmerSlot). */
const FIG_SHIMMER_SLOTS = 32;

/** Shimmer slot of a legacy category key or a district key ('district_I' … 'district_X'); -1 when unknown. */
function figShimmerSlot(key) {
  if (FIG_CATEGORY_INDEX[key] !== undefined) return FIG_CATEGORY_INDEX[key];
  const m = /^district_(.+)$/.exec(key || '');
  if (m && typeof FIG_DISTRICT_INDEX !== 'undefined' && FIG_DISTRICT_INDEX[m[1]] !== undefined) return 16 + FIG_DISTRICT_INDEX[m[1]];
  return -1;
}
/** Batch kinds per region: opaque mid / far (figures with their bases; for translucent designs only the bases) and
 *  translucent mid / far (per region group). Their LOD class and translucency: */
const FIG_KIND_MID = 0;
const FIG_KIND_FAR = 1;
const FIG_KIND_GMID = 2;
const FIG_KIND_GFAR = 3;
const FIG_KIND_CLS = [1, 2, 1, 2];
const FIG_KIND_GHOST = [false, false, true, true];

/** Maps a tier id to itself; anything unknown is the PC default. */
function figTierId(q) {
  return FIG_TIER[q] ? q : 'kozepes';
}

/* ---- render statistics ---------------------------------------------------------------------------------------- */

/** Filled by the kit every frame (PERF-PLAN 5.2 / F4). */
const FIG_STATS = {
  draws: 0, tris: 0, lod0: 0, lod1: 0, far: 0, batched: 0, covered: 0, culled: 0, regionRebuilds: 0, reused: 0, rebuildMs: 0, xfRows: 0,
  uploadBytesFrame: 0, reasons: {}, liveTris: 0, chunks: 0, chunksInView: 0, chunkTris: 0, instTris: 0, dirtyChunks: 0, adapt: 1, updateMs: 0, cap0: 0, kit: null,
};

/**
 * PERF-PLAN 5.2: figure draw calls and triangles of the last frame (true counts: drawn instances plus the index ranges
 * of the region batches in view), LOD counts, batched / covered / culled handles, region rebuilds (total) and the last
 * frame's rebuild time, GPU bytes of every figure buffer and texture, bytes uploaded last frame, the figure programs.
 */
function figureRenderStats() {
  const k = FIG_STATS.kit;
  const mem = k && k.gpuMemory ? k.gpuMemory() : { buffers: 0, textures: 0, cpu: 0 };
  const programs = [];
  for (const key of ['figure0', 'figureLod', 'figureBatchVlit', 'figureBatchPP', 'base0', 'baseLod', 'glass', 'glassBatch', 'ghostDepth', 'ghostDepthBatch', 'outline']) {
    if (key === 'figureBatchVlit' && !FIG_MATERIALS.figureBatchVlitOn) continue;
    const m = FIG_MATERIALS[key];
    if (m && !programs.includes(m.name)) programs.push(m.name);
  }
  return {
    draws: FIG_STATS.draws, tris: FIG_STATS.tris, lod0: FIG_STATS.lod0, lod1: FIG_STATS.lod1, far: FIG_STATS.far,
    batched: FIG_STATS.batched, covered: FIG_STATS.covered, culled: FIG_STATS.culled, regionRebuilds: FIG_STATS.regionRebuilds, reused: FIG_STATS.reused,
    rebuildMs: +FIG_STATS.rebuildMs.toFixed(2), gpuBytes: mem.buffers + mem.textures, gpuBufferBytes: mem.buffers,
    gpuTextureBytes: mem.textures, cpuBytes: mem.cpu, uploadBytesFrame: FIG_STATS.uploadBytesFrame, programs,
    chunks: FIG_STATS.chunks, chunksInView: FIG_STATS.chunksInView, chunkTris: FIG_STATS.chunkTris, instTris: FIG_STATS.instTris,
    drawnTris: FIG_STATS.liveTris,
    dirtyChunks: FIG_STATS.dirtyChunks, adapt: +FIG_STATS.adapt.toFixed(3), updateMs: +FIG_STATS.updateMs.toFixed(3),
  };
}

/* ---- per-handle transform / effect texture -------------------------------------------------------------------- */

/** Handles per texture row and texels per handle (the batch shader in 23-figures-mat.js hard-codes 32 and 16). */
const FIG_XF_HPR = 32;
const FIG_XF_TPH = 16;

/**
 * Partial texture upload hook, set by the game (90-main.js: texSubImage2D on three's own texture object):
 * fn(texture, data, width, firstRow, rows) → true when done, false when the texture is not on the GPU yet (then the
 * whole texture uploads through three). The figure preview has none.
 */
const FIG_XF_UPLOAD = { fn: null };

/**
 * RGBA32F texture with 16 texels per handle: matrix rows of the 4 batch parts (far figure 0-2, far base 3-5, mid
 * figure 6-8, mid base 9-11), effects (12), the category (13), the shading path (14.x: 0 per vertex, 1 per pixel) and
 * the impostor alpha (15.x: 0 = no impostor quad, 1 = the quad is fully drawn; between = the dithered cross-fade).
 * Rows are written for the parts a region batch draws and zeroed otherwise (the batch then collapses them), so an LOD
 * switch between batches is a row toggle.
 */
function figCreateXf(n) {
  const w = FIG_XF_HPR * FIG_XF_TPH;
  const h = Math.max(1, Math.ceil(n / FIG_XF_HPR));
  const data = new Float32Array(w * h * 4);
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  tex.name = 'fig:xf';
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  const off = (hd, k) => (Math.floor(hd / FIG_XF_HPR) * w + (hd % FIG_XF_HPR) * FIG_XF_TPH + k) * 4;
  // Dirty row range (F3): a pulsing legendary or the aim rim changes one handle's effects texel every frame; only the
  // rows (32 handles, 8 KB each) that changed upload, not the whole 196 KB texture.
  // Dirty rows are kept one by one: the pulsing legendaries are spread over the whole texture, so a min-max range
  // was nearly all of it.
  const rowDirty = new Uint8Array(h);
  let nDirty = 0;
  const mark = (hd) => {
    const r = Math.floor(hd / FIG_XF_HPR);
    if (!rowDirty[r]) {
      rowDirty[r] = 1;
      nDirty++;
    }
    xf.dirty = true;
  };
  const xf = {
    tex, data, dirty: false, full: true, bytes: w * h * 16,
    /** Writes the three affine rows of a THREE.Matrix4 (column-major elements) for a part (0-3, see above). */
    rows(hd, part, e) {
      let o = off(hd, part * 3);
      for (let r = 0; r < 3; r++, o += 4) {
        data[o] = e[r];
        data[o + 1] = e[4 + r];
        data[o + 2] = e[8 + r];
        data[o + 3] = e[12 + r];
      }
      mark(hd);
    },
    zero(hd) {
      const o = off(hd, 0);
      data.fill(0, o, o + 48);
      mark(hd);
    },
    fx(hd, a, b, c, d) {
      const o = off(hd, 12);
      if (data[o] === a && data[o + 1] === b && data[o + 2] === c && data[o + 3] === d) return;
      data[o] = a;
      data[o + 1] = b;
      data[o + 2] = c;
      data[o + 3] = d;
      mark(hd);
    },
    /** Shading path of a batched handle: 0 = the per-vertex lit draw, 1 = the per-pixel twin draw. */
    mode(hd, v) {
      data[off(hd, 14)] = v;
      mark(hd);
    },
    /** Impostor screen-door alpha of a handle (29-figures-impostor.js reads it in its quad shader). */
    imp(hd, a) {
      data[off(hd, 15)] = a;
      mark(hd);
    },
    cat(hd, r, g, b, i) {
      const o = off(hd, 13);
      data[o] = r;
      data[o + 1] = g;
      data[o + 2] = b;
      data[o + 3] = i;
      mark(hd);
    },
    /** Uploads what changed (the dirty rows, or everything after a restore); returns the uploaded bytes. */
    flush() {
      if (!xf.dirty) return 0;
      xf.dirty = false;
      const n = nDirty;
      nDirty = 0;
      let ok = !xf.full && n > 0 && n < h * 0.5 && !!FIG_XF_UPLOAD.fn;
      let rows = 0;
      // Runs of consecutive dirty rows, one sub-upload each.
      for (let r = 0; r < h; r++) {
        if (!rowDirty[r]) continue;
        let e = r;
        while (e + 1 < h && rowDirty[e + 1]) e++;
        for (let k = r; k <= e; k++) rowDirty[k] = 0;
        if (ok) {
          try {
            ok = FIG_XF_UPLOAD.fn(tex, data, w, r, e - r + 1);
          } catch {
            ok = false;
          }
          rows += e - r + 1;
        }
        r = e;
      }
      if (ok) {
        FIG_STATS.xfRows += rows;
        return rows * w * 16;
      }
      xf.full = false;
      tex.needsUpdate = true;
      return xf.bytes;
    },
  };
  return xf;
}

/* ---- batch sources ------------------------------------------------------------------------------------------- */

/**
 * One LOD of a design (or base) in the batch vertex layout: u16 positions normalised inside a box (D = the
 * dequantisation, folded into the handle's matrix rows), oct normals, paint, PBR bytes and the index. Normals are
 * prepared so that the batch shader (three's instanced-normal formula on matrix x D) reproduces exactly what the
 * instanced path draws for this entry (`correct` = true: the true normals, as the old far batch drew them).
 */
function figBatchSource(entry, correct) {
  const slot = correct ? 'bsrcC' : 'bsrcI';
  if (entry[slot]) return entry[slot];
  const g = entry.geometry;
  const p = g.attributes.position;
  const nV = p.count;
  const oct = g.attributes.aOct.array;
  let pos;
  let D;
  let inst = [1, 1, 1];
  // Stride of the position records: 4 for the padded baked figures, 3 for the quantised float meshes below.
  let ps = 3;
  if (p.normalized && p.array instanceof Uint16Array) {
    pos = p.array;
    ps = p.itemSize;
    D = entry.dequant;
    inst = [D.elements[0], D.elements[5], D.elements[10]];
  } else {
    // Float positions (bases, placeholders): quantise into their bounding box.
    const src = p.array;
    const mn = [Infinity, Infinity, Infinity];
    const mx = [-Infinity, -Infinity, -Infinity];
    for (let v = 0; v < nV; v++) {
      for (let c = 0; c < 3; c++) {
        const x = src[v * 3 + c];
        if (x < mn[c]) mn[c] = x;
        if (x > mx[c]) mx[c] = x;
      }
    }
    for (let c = 0; c < 3; c++) if (mx[c] - mn[c] < 1e-6) mx[c] = mn[c] + 1e-6;
    pos = new Uint16Array(nV * 3);
    for (let v = 0; v < nV; v++) {
      for (let c = 0; c < 3; c++) pos[v * 3 + c] = Math.round(((src[v * 3 + c] - mn[c]) / (mx[c] - mn[c])) * 65535);
    }
    D = new THREE.Matrix4().makeTranslation(mn[0], mn[1], mn[2]).multiply(new THREE.Matrix4().makeScale(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]));
  }
  const ds = [D.elements[0], D.elements[5], D.elements[10]];
  // Wanted world normal: R n (correct) or R inst^-1 n (instanced look). The batch gives R D^-1 n', so n' = D x wanted.
  const f = correct ? ds : [ds[0] / inst[0], ds[1] / inst[1], ds[2] / inst[2]];
  let octOut = oct;
  if (Math.abs(f[0] - f[1]) > 1e-9 * f[0] || Math.abs(f[0] - f[2]) > 1e-9 * f[0]) {
    octOut = new Int16Array(nV * 2);
    const tmp = [0, 0, 0];
    for (let v = 0; v < nV; v++) {
      figOctDecode(oct[v * 2], oct[v * 2 + 1], tmp, 0);
      figOctEncode(tmp[0] * f[0], tmp[1] * f[1], tmp[2] * f[2], octOut, v * 2);
    }
  }
  const index = g.index.array;
  const pbr = figBatchCurvature(pos, ps, D, oct, index, g.attributes.aPbr.array, nV);
  const out = {
    pos, ps, oct: octOut, col: g.attributes.aCol.array, pbr, index, nv: nV, ni: index.length, D,
    tris: index.length / 3, cpuBytes: (pos !== p.array ? pos.byteLength : 0) + (octOut !== oct ? octOut.byteLength : 0) + pbr.byteLength,
  };
  entry[slot] = out;
  return out;
}

/**
 * A copy of the PBR bytes with the clearcoat byte (unused by the Standard batch materials) replaced by the surface
 * curvature at the vertex: the largest normal angle per metre (world, scale 1) along its edges, / 4, up to 255. The
 * per-vertex lit batch shader multiplies it by the pixel footprint to reproduce three's per-pixel specular
 * anti-aliasing (geometryRoughness = normal change per pixel): flat parts stay glossy, creases and coarse LODs rough.
 */
function figBatchCurvature(pos, ps, D, oct, index, srcPbr, nV) {
  const pbr = new Uint8Array(srcPbr.subarray(0, nV * 4));
