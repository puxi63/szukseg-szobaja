  const e = D.elements;
  const curv = new Float32Array(nV);
  const na = [0, 0, 0];
  const nb = [0, 0, 0];
  const k = 1 / 65535;
  const edge = (a, b) => {
    const dx = (pos[a * ps] - pos[b * ps]) * k * e[0];
    const dy = (pos[a * ps + 1] - pos[b * ps + 1]) * k * e[5];
    const dz = (pos[a * ps + 2] - pos[b * ps + 2]) * k * e[10];
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz) * FIG_CM;
    if (len < 1e-6) return;
    figOctDecode(oct[a * 2], oct[a * 2 + 1], na, 0);
    figOctDecode(oct[b * 2], oct[b * 2 + 1], nb, 0);
    const c = Math.acos(Math.max(-1, Math.min(1, na[0] * nb[0] + na[1] * nb[1] + na[2] * nb[2]))) / len;
    if (c > curv[a]) curv[a] = c;
    if (c > curv[b]) curv[b] = c;
  };
  for (let t = 0; t + 2 < index.length; t += 3) {
    const a = index[t];
    const b = index[t + 1];
    const c = index[t + 2];
    edge(a, b);
    edge(b, c);
    edge(c, a);
  }
  for (let v = 0; v < nV; v++) pbr[v * 4 + 2] = Math.min(255, Math.round(curv[v] / 4));
  return pbr;
}

/* ---- region chunks -------------------------------------------------------------------------------------------- */

/** Integer mixing for the order-independent chunk content signatures. */
function figMix(a) {
  let x = a | 0;
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  x = Math.imul(x ^ (x >>> 16), 0x45d9f3b);
  return x ^ (x >>> 16);
}

/** Fallback region key (no world resolver, e.g. the figure preview): 3 m floor cells. */
function figGridKey(x, z) {
  return `g${Math.floor(x / FIG_PERF.gridM)}_${Math.floor(z / FIG_PERF.gridM)}`;
}

/**
 * A region chunk of one kind (FIG_KIND_*): up to a few mesh parts (each below 65,536 vertices, u16 indices) of the same
 * material. want* / built* are order-independent signatures of the wanted and the built entries; adds = wanted entries
 * not built yet, urgent = of those, entries whose handle no batch can draw yet; live = members it draws this frame.
 */
function figNewChunk(id, key, kind) {
  return {
    id, key, kind, parts: [], members: null, builtA: 0, builtB: 0, builtN: 0, wantA: 0, wantB: 0, wantN: 0, adds: 0, urgent: 0,
    live: 0, lazy: 0, lazyTris: 0, liveTris: 0, tris: 0, compact: false, force: false, head: -1, lastBuild: -1e9, inView: false, dist: 0, bytes: 0,
  };
}

/**
 * Time-sliced build of a chunk's mesh parts from its entry list (entry e = handle * 4 + kind, linked through nextE).
 * The entries are snapshotted at once: entryOf(h, out) fills out = { fig: source | null, base: source | null };
 * figPart / basePart are the transform-texture parts (0-3) of the figure and the base in this batch. step(deadline)
 * copies members until performance.now() passes the deadline (at least one member per call) and returns true when
 * done; finish(centers) computes each part's bounding sphere from the current centres (x, y, z, r) and returns
 * { parts: [{ A, nv, ni, cap, reuse, tris, sphere, bytes, usedBytes }], handles, partOf, baseOf } (per member: part
 * index, base built). The kit turns a part into a geometry (figBatchGeometry) or writes it into the chunk's existing
 * part geometry (figBatchUpdate).
 *
 * caps[i] = { nv, ni }: capacity of the chunk's current part i (F2). A new part that fits (and fills at least
 * FIG_PERF.capShrink of it) is built at exactly that capacity, so the kit can swap its arrays into the existing GL
 * buffers (bufferSubData of the used range) instead of a new geometry per rebuild; a new or outgrown part gets
 * FIG_PERF.capGrow headroom. The vertex record is interleaved u16x4: position xyz plus the handle id in w (XB-7).
 */
function figChunkJob(head, nextE, count, entryOf, keepCpu, figPart, basePart, caps = []) {
  const handles = new Int32Array(count);
  const partOf = new Int32Array(count);
  const baseOf = new Uint8Array(count);
  const ent = { fig: null, base: null };
  const parts = [];
  let cur = null;
  let k = 0;
  for (let e = head; e >= 0; e = nextE[e]) {
    const h = e >> 2;
    entryOf(h, ent);
    const nv = (ent.fig ? ent.fig.nv : 0) + (ent.base ? ent.base.nv : 0);
    const ni = (ent.fig ? ent.fig.ni : 0) + (ent.base ? ent.base.ni : 0);
    if (!nv) continue;
    if (!cur || cur.nv + nv > FIG_PERF.maxVerts) {
      cur = { list: [], nv: 0, ni: 0, arrays: null, i: 0, vo: 0, io: 0, cap: null, reuse: false };
      parts.push(cur);
    }
    cur.list.push(h, ent.fig, ent.base);
    cur.nv += nv;
    cur.ni += ni;
    handles[k] = h;
    partOf[k] = parts.length - 1;
    baseOf[k] = ent.base ? 1 : 0;
    k++;
  }
  let pi = 0;
  const job = {
    bytes: 0,
    step(deadline) {
      let first = true;
      while (pi < parts.length) {
        const p = parts[pi];
        if (!p.arrays) {
          const c = caps[pi];
          p.reuse = !!c && c.nv >= p.nv && c.ni >= p.ni && p.nv >= c.nv * FIG_PERF.capShrink;
          const cv = p.reuse ? c.nv : Math.min(65536, figCapStep(p.nv * FIG_PERF.capGrow));
          const ci = p.reuse ? c.ni : figCapStep(p.ni * FIG_PERF.capGrow);
          p.cap = { nv: cv, ni: ci };
          p.arrays = {
            ph: figPoolTake(Uint16Array, cv * 4), oct: figPoolTake(Int16Array, cv * 2), col: figPoolTake(Uint8Array, cv * 4),
            pbr: figPoolTake(Uint8Array, cv * 4), idx: figPoolTake(Uint16Array, ci),
          };
        }
        const A = p.arrays;
        const L = p.list;
        while (p.i < L.length) {
          if (!first && performance.now() > deadline) return false;
          first = false;
          const h = L[p.i];
          for (let part = 0; part < 2; part++) {
            const s = part === 0 ? L[p.i + 1] : L[p.i + 2];
            if (!s) continue;
            const vo = p.vo;
            const hid = h * 4 + (part === 0 ? figPart : basePart);
            const sp = s.pos;
            const st = s.ps;
            const ph = A.ph;
            for (let v = 0, j = 0, o = vo * 4; v < s.nv; v++, j += st, o += 4) {
              ph[o] = sp[j];
              ph[o + 1] = sp[j + 1];
              ph[o + 2] = sp[j + 2];
              ph[o + 3] = hid;
            }
            A.oct.set(s.oct, vo * 2);
            A.col.set(s.col.subarray(0, s.nv * 4), vo * 4);
            A.pbr.set(s.pbr.subarray(0, s.nv * 4), vo * 4);
            const si = s.index;
            const idx = A.idx;
            const io = p.io;
            for (let j = 0; j < si.length; j++) idx[io + j] = si[j] + vo;
            p.vo += s.nv;
            p.io += si.length;
          }
          p.i += 3;
        }
        pi++;
      }
      return true;
    },
    finish(centers) {
      const out = [];
      for (const p of parts) {
        const L = p.list;
        let sx = 0;
        let sy = 0;
        let sz = 0;
        for (let i = 0; i < L.length; i += 3) {
          const h = L[i];
          sx += centers[h * 4];
          sy += centers[h * 4 + 1];
          sz += centers[h * 4 + 2];
        }
        const nm = L.length / 3;
        const sphere = new THREE.Sphere(new THREE.Vector3(sx / nm, sy / nm, sz / nm), 0);
        let r = 0;
        for (let i = 0; i < L.length; i += 3) {
          const h = L[i];
          const dx = centers[h * 4] - sphere.center.x;
          const dy = centers[h * 4 + 1] - sphere.center.y;
          const dz = centers[h * 4 + 2] - sphere.center.z;
          r = Math.max(r, Math.sqrt(dx * dx + dy * dy + dz * dz) + centers[h * 4 + 3]);
        }
        sphere.radius = r;
        out.push({
          A: p.arrays, nv: p.nv, ni: p.ni, cap: p.cap, reuse: p.reuse, tris: p.ni / 3, sphere,
          bytes: p.cap.nv * FIG_BATCH_VB + p.cap.ni * 2, usedBytes: p.nv * FIG_BATCH_VB + p.ni * 2,
        });
      }
      return { parts: out, handles: handles.subarray(0, k), partOf: partOf.subarray(0, k), baseOf: baseOf.subarray(0, k) };
    },
  };
  return job;
}

/** Bytes per region-batch vertex: position + handle (u16x4), octahedral normal (i16x2), paint and PBR (u8x4 each). */
const FIG_BATCH_VB = 8 + 4 + 4 + 4;

/**
 * Pool of region-batch staging arrays (XB-1 / F2): a rebuilt part of the same capacity takes the arrays its last build
 * gave back after their upload, instead of new ones. About 18 rebuilds a second while walking otherwise left several
 * MB of dead ArrayBuffers per second for the garbage collector (their memory only returns at the next GC).
 */
const FIG_POOL = { map: new Map(), bytes: 0, max: 6 * 1048576, hits: 0, misses: 0 };

/** Capacity steps of new batch parts: quarter octaves from 1024 (19 % apart), so pooled arrays fit other parts too. */
function figCapStep(n) {
  let c = 1024;
  let i = 0;
  while (c < n) c = Math.round(1024 * 2 ** (++i / 4));
  return c;
}

function figPoolKey(Ctor, n) {
  return `${Ctor === Uint16Array ? 'u16' : Ctor === Int16Array ? 'i16' : 'u8'}:${n}`;
}

/** A staging array of `n` elements (stale contents: the job overwrites the used range, the rest is never drawn). */
function figPoolTake(Ctor, n) {
  const list = FIG_POOL.map.get(figPoolKey(Ctor, n));
  if (list && list.length) {
    const a = list.pop();
    FIG_POOL.bytes -= a.byteLength;
    FIG_POOL.hits++;
    return a;
  }
  FIG_POOL.misses++;
  return new Ctor(n);
}

function figPoolGive(a) {
  if (!a || FIG_POOL.bytes + a.byteLength > FIG_POOL.max) return;
  const Ctor = a instanceof Uint16Array ? Uint16Array : a instanceof Int16Array ? Int16Array : a instanceof Uint8Array ? Uint8Array : null;
  if (!Ctor) return;
  const k = figPoolKey(Ctor, a.length);
  let list = FIG_POOL.map.get(k);
  if (!list) FIG_POOL.map.set(k, (list = []));
  list.push(a);
  FIG_POOL.bytes += a.byteLength;
}

/** onUpload callback of the batch buffers without CPU copies: the array goes back to the pool once the GPU has it. */
function figPoolRelease() {
  this.figUp = true;
  if (this.array) {
    this.figBytes = this.array.byteLength;
    figPoolGive(this.array);
  }
  this.array = null;
}

/** Every buffer of a batch geometry (the interleaved record once). */
function figBatchBuffers(g) {
  return [g.attributes.position.data, g.attributes.aOct, g.attributes.aCol, g.attributes.aPbr, g.index];
}

/** Returns a disposed batch geometry's arrays to the pool. */
function figBatchRecycle(g) {
  for (const b of figBatchBuffers(g)) {
    if (b && b.array) {
      figPoolGive(b.array);
      b.array = null;
    }
  }
}

/** A new region-batch geometry for a finished job part, sized to the part's capacity (drawn up to its index count). */
function figBatchGeometry(part, keepCpu) {
  const A = part.A;
  const g = new THREE.BufferGeometry();
  // One interleaved u16x4 record per vertex: xyz normalised position, w the handle id (normalised; the shader scales
  // it back). Both are native D3D11 vertex formats: a 3-component u16 position made ANGLE keep a converted copy of
  // every batch buffer in the GPU process, rebuilt after each rebuild (XB-7).
  const ib = new THREE.InterleavedBuffer(A.ph, 4);
  g.setAttribute('position', new THREE.InterleavedBufferAttribute(ib, 4, 0, true));
  g.setAttribute('aHid', new THREE.InterleavedBufferAttribute(ib, 1, 3, true));
  g.setAttribute('aOct', new THREE.BufferAttribute(A.oct, 2, true));
  g.setAttribute('aCol', new THREE.BufferAttribute(A.col, 4, true));
  g.setAttribute('aPbr', new THREE.BufferAttribute(A.pbr, 4, true));
  g.setIndex(new THREE.BufferAttribute(A.idx, 1));
  g.setDrawRange(0, part.ni);
  g.boundingSphere = part.sphere;
  if (!keepCpu) for (const b of figBatchBuffers(g)) b.onUpload(figPoolRelease);
  return g;
}

/**
 * Writes a rebuilt part into an existing batch geometry of the same capacity (F2): the arrays are swapped in and only
 * the used ranges upload (bufferSubData), so the GL buffers live on instead of a new set per rebuild (about 18 rebuilds
 * a second while walking, each freeing and allocating buffers in the GPU process). Without CPU copies the arrays are
 * released again after the upload (the release callbacks also run on an update).
 */
function figBatchUpdate(g, part) {
  const A = part.A;
  const set = (target, arr, used) => {
    // The replaced array (a CPU copy, or one that never reached the GPU) goes back to the pool.
    if (target.array && target.array !== arr) figPoolGive(target.array);
    target.array = arr;
    target.clearUpdateRanges();
    target.addUpdateRange(0, used);
    target.needsUpdate = true;
  };
  set(g.attributes.position.data, A.ph, part.nv * 4);
  set(g.attributes.aOct, A.oct, part.nv * 2);
  set(g.attributes.aCol, A.col, part.nv * 4);
  set(g.attributes.aPbr, A.pbr, part.nv * 4);
  set(g.index, A.idx, part.ni);
  g.setDrawRange(0, part.ni);
  g.boundingSphere = part.sphere;
}

/* ---- 28-figures-stream.js ---- */
/* ==== 28-figures-stream.js — figure packs and content types (szoba/TERV.md b.5, PERF-PLAN W16 / F12): the binary pack of
   every district (tools/figbake/pack-district.mjs) is fetched and decoded in a Worker into GPU-ready typed arrays
   (transferred back, no base64 in the main heap), turned into geometries a few MB per frame (upload slicing), and kept
   resident per district by an LRU with hot (full + mid + far), warm (mid + far) and cold (impostors only) packs. The
   JSON path of 22-figures-geo.js stays for the figure preview, the impostor bake page and builds without packs.

   Content types (FIG_TYPES and the #stress types of 20-figures-data.js) become designs of their own (FIG_BY_ID[typeKey],
   `mesh` = the baked design, `content` = true) so the kit draws them like any design. ==== */

const FIG_PACK_URL = 'assets/figs/';
/**
 * Stream state. mode 'json' (default: 22-figures-geo.js fetches assets/figures-baked/*.json) or 'packs' (figUseStream).
 * content: 'shop' (the old shop's designs, every pack hot, never evicted), 'test' (the catalogued district types) or
 * 'stress' (the 500 palette-swap types, stress packs when the build has them). cap: hot + warm packs at once (the
 * LRU limit, TERV b.5); keepS: an unwanted pack stays this long before it may be evicted; uploadBytes / pumpMs: geometry
 * bytes handed to the renderer and main-thread time per pump (≈ per frame); releaseFull: the full-detail CPU arrays are
 * dropped after upload.
 */
const FIG_STREAM = {
  mode: 'json', content: 'shop', index: null, worker: null, packs: new Map(), consumers: new Map(), queue: [], pumping: false,
  cap: 4, keepS: 60, warmAfterS: 20, uploadBytes: 8 * 1048576, pumpMs: 4, releaseFull: true, stressPacks: false, req: 0, initial: null,
  stats: { packsFetched: 0, bytesFetched: 0, designsDecoded: 0, uploadsMB: 0, evictions: 0, demotions: 0, maxPumpMs: 0, lastPackMs: 0, errors: [] },
};

/* ---- content types ---------------------------------------------------------------------------------------- */

/** Key of the #stress type of district k (0 … 9), slot s (0 … 49): 's01_00' … 's10_49' (tools/figbake/lib/districts.mjs). */
function figStressKey(k, s) {
  return `s${String(k + 1).padStart(2, '0')}_${String(s).padStart(2, '0')}`;
}

/**
 * Registers the content types of a mode as designs (FIG_BY_ID) and returns them in district / slot order:
 * 'test' = the catalogued types that have a design (FIG_TYPES), 'stress' = all 500 palette-swap types. Every record
 * copies its mesh design's fields and adds { content, mesh, type, districtLook, slot, hue }. Idempotent.
 */
function figRegisterContent(mode) {
  const out = [];
  const add = (id, mesh, k, slot, nameHu, rarity, hue, type) => {
    let d = FIG_BY_ID[id];
    if (!d) {
      const m = FIG_BY_ID[mesh];
      d = {
        ...m, id, mesh, nameHu: nameHu || m.nameHu, rarity: rarity || m.rarity, copies: FIG_CONTENT.copies, counted: false, wild: null,
        content: true, type, district: k, districtLook: k, slot, hue, index: -1,
      };
      FIG_BY_ID[id] = d;
    }
    out.push(d);
  };
  if (mode === 'stress') {
    const per = FIG_CONTENT.typesPerDistrict;
    for (let k = 0; k < FIG_DISTRICTS.length; k++) {
      const row = FIG_STRESS_TYPES[k] || [];
      for (let s = 0; s * 2 < row.length; s++) {
        const mesh = FIG_DESIGNS[row[s * 2]].id;
        add(figStressKey(k, s), mesh, k, s, `${FIG_BY_ID[mesh].nameHu} ${k + 1}/${s + 1}`, null, row[s * 2 + 1], 'stress');
      }
      if (row.length / 2 !== per) console.warn('[figures] stress district', k, 'has', row.length / 2, 'types');
    }
  } else if (mode === 'test') {
    for (const t of FIG_TYPES) if (t.design && FIG_BY_ID[t.design]) add(t.key, t.design, t.district, t.slot, t.nameHu, t.rarity, 0, 'test');
  }
  return out;
}

/**
 * Pack keys that hold the meshes of district k's content types. 'test' content: a type is drawn with its mesh design,
 * which lives in the pack of that design's home district (a stand-in may come from another one); 'stress' with stress
 * packs and the shop content: the district's own pack. Cached once the pack index is known.
 */
function figPacksOfDistrict(k) {
  const own = `${FIG_STREAM.content === 'stress' && FIG_STREAM.stressPacks ? 's' : 'd'}${String(k + 1).padStart(2, '0')}`;
  const S = FIG_STREAM;
  if (S.content !== 'test' || !S.index) return [own];
  if (!S.districtPacks) {
    S.districtPacks = new Map();
    for (const t of FIG_TYPES) {
      const e = t.design && S.index.designs && S.index.designs[t.design];
      if (!e) continue;
      if (!S.districtPacks.has(t.district)) S.districtPacks.set(t.district, []);
      const list = S.districtPacks.get(t.district);
      if (!list.includes(e.pack)) list.push(e.pack);
    }
  }
  return S.districtPacks.get(k) || [own];
}

/** Pack key of one content type's mesh (test content), else null. */
function figPackOfType(id) {
  const d = FIG_BY_ID[id];
  const S = FIG_STREAM;
  if (!d || !S.index || !S.index.designs) return null;
  const e = S.index.designs[d.mesh || id];
  return e ? e.pack : null;
}

/* ---- the decode worker -------------------------------------------------------------------------------------- */

/**
 * Worker body (run from a Blob URL, so it shares nothing with the page): fetches a pack, checks its magic, and posts
 * every wanted design with its LODs as fresh typed arrays (transferred), plus the float positions and normals of the
 * far LOD (the instanced far geometry and the far batch source need them, figFarInstGeometry). skipFull leaves the full
 * LOD out (a warm pack).
 */
function figStreamWorkerMain() {
  const octDecode = (a, b, out, o) => {
    let x = a / 32767;
    let y = b / 32767;
    const z = 1 - Math.abs(x) - Math.abs(y);
    if (z < 0) {
      const ox = x;
      x = (1 - Math.abs(y)) * (ox >= 0 ? 1 : -1);
      y = (1 - Math.abs(ox)) * (y >= 0 ? 1 : -1);
    }
    const l = Math.hypot(x, y, z) || 1;
    out[o] = x / l;
    out[o + 1] = y / l;
    out[o + 2] = z / l;
  };
  self.onmessage = async (ev) => {
    const m = ev.data;
    if (!m || m.type !== 'pack') return;
    try {
      const t0 = performance.now();
      const res = await fetch(m.url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      const tf = performance.now();
      const dv = new DataView(buf);
      if (buf.byteLength < 8 || dv.getUint32(0, true) !== 0x314b5046) throw new Error('not a figure pack (FPK1)');
      const hl = dv.getUint32(4, true);
      const head = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, hl)));
      const base = 8 + hl;
      const only = m.only ? new Set(m.only) : null;
      let n = 0;
      for (const d of head.designs) {
        if (only && !only.has(d.id)) continue;
        const transfer = [];
        const take = (off, Ctor, len) => {
          const a = new Ctor(len);
          a.set(new Ctor(buf, base + off, len));
          transfer.push(a.buffer);
          return a;
        };
        const farK = d.lods[2].same !== undefined ? d.lods[2].same : 2;
        const lods = d.lods.map((l, k) => {
          if (l.same !== undefined) return { same: l.same };
          if (m.skipFull && k === 0 && farK !== 0 && !d.lods.some((x, j) => j > 0 && x.same === 0)) return { skipped: true };
          const e = {
            nv: l.nv, ni: l.ni, min: l.min, max: l.max,
            pos: take(l.pos, Uint16Array, l.nv * 4), oct: take(l.oct, Int16Array, l.nv * 2), col: take(l.col, Uint8Array, l.nv * 4),
            pbr: take(l.pbr, Uint8Array, l.nv * 4), idx: take(l.idx, l.u32 ? Uint32Array : Uint16Array, l.ni),
          };
          if (k === farK) {
            const fp = new Float32Array(l.nv * 3);
            const fn = new Float32Array(l.nv * 3);
            for (let v = 0; v < l.nv; v++) {
              for (let c = 0; c < 3; c++) fp[v * 3 + c] = l.min[c] + (e.pos[v * 4 + c] / 65535) * (l.max[c] - l.min[c]);
              octDecode(e.oct[v * 2], e.oct[v * 2 + 1], fn, v * 3);
            }
            e.fp = fp;
            e.fn = fn;
            transfer.push(fp.buffer, fn.buffer);
          }
          return e;
        });
        self.postMessage({ type: 'design', key: m.key, req: m.req, id: d.id, mesh: d.mesh, ghost: d.ghost, lods }, transfer);
        n++;
      }
      self.postMessage({ type: 'done', key: m.key, req: m.req, bytes: buf.byteLength, designs: n, fetchMs: tf - t0, decodeMs: performance.now() - tf });
    } catch (err) {
      self.postMessage({ type: 'error', key: m.key, req: m.req, error: String((err && err.message) || err) });
    }
  };
}

function figStreamWorker() {
  if (FIG_STREAM.worker) return FIG_STREAM.worker;
  const src = `(${figStreamWorkerMain.toString()})();`;
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  const w = new Worker(url);
  URL.revokeObjectURL(url);
  w.onmessage = (ev) => figStreamOnMessage(ev.data);
  w.onerror = (ev) => {
    FIG_STREAM.stats.errors.push(`worker: ${ev.message || 'error'}`);
    console.warn('[figures] pack worker failed', ev.message || ev);
  };
  FIG_STREAM.worker = w;
  return w;
}

/* ---- packs, residency and the LRU --------------------------------------------------------------------------- */

/**
 * Switches the figure source to the packs (before the first load: the game's boot step 'figures'). content as in
 * FIG_STREAM; opts.initial: pack keys to load (hot) before the loader counts the figures as loaded (default: every
 * pack of a shop / test content, none for stress); opts.cap overrides the LRU limit (Infinity = never evict).
 */
function figUseStream(content = 'shop', opts = {}) {
  if (FIG_LOAD.started) return false;
  FIG_STREAM.mode = 'packs';
  FIG_STREAM.content = content;
  FIG_STREAM.initial = opts.initial || null;
  FIG_STREAM.cap = opts.cap !== undefined ? opts.cap : content === 'shop' ? Infinity : 4;
  return true;
}

function figPackState(key) {
  let p = FIG_STREAM.packs.get(key);
  if (!p) {
    p = { key, file: '', bytes: 0, ids: [], state: 'cold', level: '', want: '', wantAt: -1e9, hotAt: -1e9, req: 0, loaded: 0, entries: new Map() };
    FIG_STREAM.packs.set(key, p);
  }
  return p;
}

/**
 * The pack loader behind figStartLoading() in pack mode: reads assets/figs/index.json, maps every registered design or
 * content type to its pack (FIG_STREAM.consumers: pack → mesh → ids) and requests the initial packs. Falls back to the
 * JSON path (shop content) when the build has no packs. Resolves like figStartLoading (FIG_LOAD).
 */
function figStreamStart() {
  FIG_LOAD.started = true;
  FIG_LOAD.promise = new Promise((res) => {
    FIG_LOAD.resolve = res;
  });
  FIG_LOAD.t0 = performance.now();
  fetch(`${FIG_PACK_URL}index.json`)
    .then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then((index) => figStreamIndex(index))
    .catch((err) => {
      console.warn('[figures] no figure packs, using the JSON figures', err);
      FIG_STREAM.mode = 'json';
      FIG_LOAD.started = false;
      const p = FIG_LOAD.promise;
      const res = FIG_LOAD.resolve;
      figStartLoading().then(res);
      FIG_LOAD.promise = p;
    });
  return FIG_LOAD.promise;
}

function figStreamIndex(index) {
  // consume(pack, key, id): `key` is the design id inside the pack, `id` the design or content type that shows it.
  FIG_STREAM.index = index;
  const S = FIG_STREAM;
  const consume = (pack, mesh, id) => {
    let m = S.consumers.get(pack);
    if (!m) S.consumers.set(pack, (m = new Map()));
    if (!m.has(mesh)) m.set(mesh, []);
    if (!m.get(mesh).includes(id)) m.get(mesh).push(id);
    const p = figPackState(pack);
    if (!p.ids.includes(id)) p.ids.push(id);
  };
  const setPack = (key, info) => {
    const p = figPackState(key);
    p.file = info.file;
    p.bytes = info.bytes;
  };
  for (const [k, info] of Object.entries(index.packs || {})) setPack(k, info);
  S.stressPacks = !!index.stress;
  if (index.stress) for (const [k, info] of Object.entries(index.stress)) setPack(k, info);
  const ids = [];
  if (S.content === 'shop') {
    for (const d of FIG_DESIGNS) {
      const e = index.designs && index.designs[d.id];
      if (!e || typeof FIG_BAKED_META === 'undefined' || !FIG_BAKED_META[d.id]) continue;
      consume(e.pack, d.id, d.id);
      ids.push(d.id);
    }
  } else {
    // The test content also holds the designs that are a type themselves (their own records, no content fields).
    const list = S.content === 'test' ? figRegisterContent('test') : Object.values(FIG_BY_ID).filter((d) => d.content && d.type === S.content);
    for (const d of list) {
      const mesh = d.mesh || d.id;
      if (d.type === 'stress' && index.stress) consume(`s${String(d.district + 1).padStart(2, '0')}`, d.id, d.id);
      else {
        const e = index.designs && index.designs[mesh];
        if (!e) continue;
        consume(e.pack, mesh, d.id);
      }
      ids.push(d.id);
    }
    if (S.content === 'stress' && !index.stress) console.warn('[figures] this build has no stress packs (node build.mjs --stress): the stress types share their meshes');
  }
  for (const p of S.packs.values()) p.ids = p.ids.filter((id) => ids.includes(id));
  // Initial residency: what the loader waits for.
  let initial = S.initial;
  if (!initial) initial = S.content === 'stress' ? [] : [...S.packs.values()].filter((p) => p.ids.length).map((p) => p.key);
  initial = initial.filter((k) => S.packs.has(k) && S.packs.get(k).ids.length);
  FIG_LOAD.total = initial.reduce((n, k) => n + S.packs.get(k).ids.length, 0);
  S.waitFor = new Set(initial);
  for (const k of initial) figStreamRequest(k, 'hot');
  if (!initial.length) figStreamLoadDone();
}

function figStreamLoadDone() {
  if (FIG_LOAD.done) return;
  FIG_LOAD.done = true;
  FIG_LOAD.ms = Math.round(performance.now() - (FIG_LOAD.t0 || 0));
  for (const l of FIG_LOAD.listeners) l.onAllLoaded?.();
  FIG_LOAD.resolve(FIG_LOAD.loaded);
}

/** Asks the worker for a pack at a level ('hot' = every LOD, 'warm' = mid and far only). */
function figStreamRequest(key, level) {
  const p = FIG_STREAM.packs.get(key);
  if (!p || !p.file || !p.ids.length) return false;
  if (p.state === 'loading' && (p.level === 'hot' || level === 'warm')) return true;
  if (p.state === 'resident' && (p.level === 'hot' || level === 'warm')) return true;
  p.req = ++FIG_STREAM.req;
  p.state = 'loading';
  p.level = level;
  p.loaded = 0;
  const only = FIG_STREAM.content === 'shop' ? null : [...(FIG_STREAM.consumers.get(key) || new Map()).keys()];
  const url = new URL(FIG_PACK_URL + p.file, location.href).href;
  figStreamWorker().postMessage({ type: 'pack', key, url, req: p.req, only, skipFull: level === 'warm' });
  return true;
}

function figStreamOnMessage(m) {
  const S = FIG_STREAM;
  const p = S.packs.get(m.key);
  if (!p || m.req !== p.req) return;
  if (m.type === 'design') {
    S.queue.push(m);
    S.stats.designsDecoded++;
    figStreamSchedulePump();
  } else if (m.type === 'done') {
    S.stats.packsFetched++;
    S.stats.bytesFetched += m.bytes;
    S.stats.lastPackMs = Math.round(m.fetchMs + m.decodeMs);
    S.queue.push({ type: 'done', key: m.key, req: m.req });
    figStreamSchedulePump();
  } else if (m.type === 'error') {
    S.stats.errors.push(`${m.key}: ${m.error}`);
    console.warn('[figures] pack failed', m.key, m.error);
    p.state = 'cold';
    for (const id of p.ids) FIG_LOAD.failed.push(id);
    if (S.waitFor && S.waitFor.delete(m.key) && !S.waitFor.size) figStreamLoadDone();
  }
}

function figStreamSchedulePump() {
  if (FIG_STREAM.pumping) return;
  FIG_STREAM.pumping = true;
  const run = () => {
    FIG_STREAM.pumping = false;
    figStreamPump();
  };
  if (typeof requestAnimationFrame === 'function' && document.visibilityState === 'visible') requestAnimationFrame(run);
  else setTimeout(run, 0);
}

/** Turns decoded designs into geometries, up to uploadBytes per call (the renderer uploads them on their first draw). */
function figStreamPump() {
  const S = FIG_STREAM;
  const t0 = performance.now();
  let bytes = 0;
  // 1e: while no hot pack is loading (the idle street prefetch of warm packs), a quarter of the budget per frame.
  let hotLoading = false;
  for (const q of S.packs.values()) if (q.state === 'loading' && q.level === 'hot') hotLoading = true;
  const capBytes = hotLoading ? S.uploadBytes : S.uploadBytes / 4;
  const capMs = hotLoading ? S.pumpMs : S.pumpMs / 4;
  // Byte and time budget (TERV f.2: no frame over 50 ms at a district change): the kit builds its batch sources in
  // onDesignLoaded, so a pump also stops after pumpMs (at least one design per pump).
  while (S.queue.length && bytes < capBytes && (bytes === 0 || performance.now() - t0 < capMs)) {
    const m = S.queue.shift();
    const p = S.packs.get(m.key);
    if (!p || m.req !== p.req) continue;
    if (m.type === 'done') {
      p.state = 'resident';
      if (p.level === 'hot') p.hotAt = performance.now() / 1000;
      if (S.waitFor && S.waitFor.delete(m.key) && !S.waitFor.size) figStreamLoadDone();
      continue;
    }
    bytes += figStreamAccept(p, m);
  }
  S.stats.uploadsMB += bytes / 1048576;
  S.stats.maxPumpMs = Math.max(S.stats.maxPumpMs, performance.now() - t0);
  if (S.queue.length) figStreamSchedulePump();
}

/** One decoded design → FIG_GEO entries of every consumer id. Returns the bytes handed to the renderer. */
function figStreamAccept(p, m) {
  let bytes = 0;
  const entries = [];
  m.lods.forEach((l) => {
    if (l.same !== undefined || l.skipped) {
      entries.push(null);
      return;
    }
    const geometry = figPackedGeometry(l.pos, true, l.oct, l.col, l.pbr, l.idx, 4);
    const { min, max } = l;
    const dequant = new THREE.Matrix4().makeTranslation(min[0], min[1], min[2]).multiply(new THREE.Matrix4().makeScale(max[0] - min[0], max[1] - min[1], max[2] - min[2]));
    const e = { geometry, dequant, tris: l.ni / 3, verts: l.nv, far: l.fp ? { pos: l.fp, nrm: l.fn, col: l.col, pbr: l.pbr, index: l.idx } : null };
    bytes += l.pos.byteLength + l.oct.byteLength + l.col.byteLength + l.pbr.byteLength + l.idx.byteLength;
    entries.push(e);
  });
  m.lods.forEach((l, k) => {
    if (l.same !== undefined) entries[k] = entries[l.same];
  });
  // A warm pack has no full LOD: the mid LOD stands in for it.
  if (!entries[0]) entries[0] = entries[1];
  if (FIG_STREAM.releaseFull && entries[0] !== entries[1] && entries[0] !== entries[2]) figReleaseAfterUpload(entries[0].geometry);
  // Consumers are keyed by the pack's design id (the mesh id in a district pack, the type key in a stress pack).
  const consumers = (FIG_STREAM.consumers.get(p.key) || new Map()).get(m.id) || (FIG_STREAM.content === 'shop' ? [m.id] : []);
  const old = p.entries.get(m.id);
  p.entries.set(m.id, { lods: entries, level: p.level, ghost: m.ghost });
  for (const id of consumers) {
    const g = figGeo(id);
    g.lods = entries;
    const wasBaked = g.baked;
    g.baked = true;
    g.level = p.level;
    if (!wasBaked) {
      FIG_LOAD.loaded++;
      p.loaded++;
    }
    for (const l of FIG_LOAD.listeners) l.onDesignLoaded?.(id);
  }
  if (old) figStreamDisposeLods(old.lods, entries);
  return bytes;
}

/** Disposes the GPU buffers of replaced or evicted LOD entries (those not in `keep`). */
function figStreamDisposeLods(lods, keep = []) {
  const done = new Set();
  for (const e of lods) {
    if (!e || done.has(e) || keep.includes(e)) continue;
    done.add(e);
    e.geometry.dispose();
    if (e.farGeo && e.farGeo !== e.geometry) e.farGeo.dispose();
    if (e.geometryM) e.geometryM.dispose();
  }
}

/** Drops a resident pack: its consumers fall back to placeholders (the kit draws them as impostors or not at all). */
function figStreamEvict(key) {
  const S = FIG_STREAM;
  const p = S.packs.get(key);
  if (!p || p.state === 'cold') return;
  p.req = ++S.req;
  p.state = 'cold';
  p.level = '';
  for (const [mesh, ent] of p.entries) {
    for (const id of ((S.consumers.get(key) || new Map()).get(mesh) || [mesh])) {
      const g = FIG_GEO[id];
      if (!g) continue;
      const ph = figPlaceholderFor(id);
      g.lods = [ph, ph, ph];
      g.baked = false;
      g.level = '';
      FIG_LOAD.loaded = Math.max(0, FIG_LOAD.loaded - 1);
      for (const l of FIG_LOAD.listeners) l.onDesignEvicted?.(id);
    }
    figStreamDisposeLods(ent.lods);
  }
  p.entries.clear();
  p.loaded = 0;
  S.stats.evictions++;
}

/** Hot → warm: the full LOD of a pack's designs is disposed and the mid LOD stands in (the kit rebuilds its meshes). */
function figStreamDemote(key) {
  const p = FIG_STREAM.packs.get(key);
  if (!p || p.state !== 'resident' || p.level !== 'hot') return;
  p.level = 'warm';
  for (const [mesh, ent] of p.entries) {
    const full = ent.lods[0];
    if (full === ent.lods[1] || full === ent.lods[2]) continue;
    ent.lods = [ent.lods[1], ent.lods[1], ent.lods[2]];
    ent.level = 'warm';
    for (const id of ((FIG_STREAM.consumers.get(p.key) || new Map()).get(mesh) || [mesh])) {
      const g = FIG_GEO[id];
      if (!g) continue;
      g.lods = ent.lods;
      g.level = 'warm';
      for (const l of FIG_LOAD.listeners) l.onDesignLoaded?.(id);
    }
    figStreamDisposeLods([full]);
  }
  FIG_STREAM.stats.demotions++;
}

/**
 * Residency request of the game (once a frame or less): `hot` and `warm` pack keys, most important first. Wanted packs
 * load (a warm one without its full LOD; a warm pack that becomes hot reloads with it); a hot pack that is only warm
 * for warmAfterS drops its full LOD; above `cap` resident packs, the least recently wanted one that has not been wanted
 * for keepS is evicted (TERV b.5: the previous district stays 60 s).
 */
function figStreamWant(hot = [], warm = []) {
  const S = FIG_STREAM;
  if (S.mode !== 'packs' || !S.index) return;
  const now = performance.now() / 1000;
  const levels = new Map();
  for (const k of warm) levels.set(k, 'warm');
  for (const k of hot) levels.set(k, 'hot');
  for (const [k, lv] of levels) {
    const p = S.packs.get(k);
    if (!p || !p.ids.length) continue;
    p.wantAt = now;
    p.want = lv;
    if (lv === 'hot') p.hotAt = now;
  }
  let resident = 0;
  for (const p of S.packs.values()) if (p.state !== 'cold') resident++;
  for (const [k, lv] of levels) {
    const p = S.packs.get(k);
    if (!p || !p.ids.length) continue;
    const need = p.state === 'cold' || (lv === 'hot' && p.level !== 'hot');
    if (!need) continue;
    if (p.state === 'cold' && resident >= S.cap) {
      // Make room: the least recently wanted pack that is not wanted now and has waited keepS.
      let victim = null;
      for (const q of S.packs.values()) {
        if (q.state === 'cold' || levels.has(q.key) || now - q.wantAt < S.keepS) continue;
        if (!victim || q.wantAt < victim.wantAt) victim = q;
      }
      // 1e: a hot request (the location being entered) never waits: then the oldest unwanted pack goes even before
      // keepS, and with none the cap is exceeded for now (the idle street prefetch keeps packs warm up to the cap).
      if (!victim && lv === 'hot') {
        for (const q of S.packs.values()) {
          if (q.state === 'cold' || levels.has(q.key)) continue;
          if (!victim || q.wantAt < victim.wantAt) victim = q;
        }
      }
      if (victim) {
        figStreamEvict(victim.key);
        resident--;
      } else if (lv !== 'hot') continue;
    }
    if (p.state === 'cold') resident++;
    figStreamRequest(k, lv);
  }
  for (const p of S.packs.values()) {
    if (p.state === 'resident' && p.level === 'hot' && !hot.includes(p.key) && now - p.hotAt > S.warmAfterS) figStreamDemote(p.key);
  }
}

/** After a restored WebGL context: released full-detail arrays cannot upload again, so every resident pack reloads. */
function figStreamOnContextRestored() {
  const S = FIG_STREAM;
  if (S.mode !== 'packs') return;
  const again = [];
  for (const p of S.packs.values()) {
    if (p.state === 'cold') continue;
    again.push([p.key, p.level || 'hot']);
    figStreamEvict(p.key);
  }
  for (const [k, lv] of again) figStreamRequest(k, lv);
}

/** Residency and transfer statistics (Teljesítménypanel, harness). */
function figStreamStats() {
  const S = FIG_STREAM;
  const packs = {};
  let designs = 0;
  for (const p of S.packs.values()) {
    if (!p.ids.length) continue;
    packs[p.key] = `${p.state}${p.level ? `:${p.level}` : ''} ${p.loaded}/${p.ids.length}`;
    if (p.state === 'resident') designs += p.loaded;
  }
  return {
    mode: S.mode, content: S.content, stressPacks: S.stressPacks, cap: S.cap, packs, residentDesigns: designs, queue: S.queue.length,
    ...S.stats, uploadsMB: +S.stats.uploadsMB.toFixed(1), maxPumpMs: +S.stats.maxPumpMs.toFixed(2), errors: S.stats.errors.slice(-5),
  };
}

/* ---- 29-figures-impostor.js ---- */
/* ==== 29-figures-impostor.js — far figurines as impostors (szoba/TERV.md b.2 L3, b.6): an atlas of front views baked
   offline (tools/figbake/impostors.mjs: 64 × 128 px per design, mid LOD with its base, orthographic, neutral light) and
   one static quad batch per district, built once from the shelf layout. Every quad is a cylindrical billboard in the
   vertex shader; its handle's impostor alpha comes from texel 15 of the kit's transform texture (FIG_XF), so placing,
   taking or promoting a figurine never rebuilds a batch: alpha 0 collapses the quad, values between 0 and 1 are the
   dithered (screen-door) cross-fade with the geometry, 1 is the full impostor. ==== */

const FIG_IMP_URL = 'assets/figs/';
/** Atlas grid: 32 × 16 cells of 64 × 128 px in 2048 × 2048 (512 cells: 500 types + 12 spare). */
const FIG_IMP_GRID = { cols: 32, rows: 16 };
/** Loaded atlases by name ('impostors', 'impostors-stress'): { tex, cells: { id: [cell, w, h, y0] }, bytes } or a promise. */
const FIG_IMP = { atlases: new Map(), batches: [], tint: { value: new THREE.Color(0.92, 0.92, 0.92) } };

/**
 * Loads an impostor atlas (PNG + JSON cell table) once; resolves { tex, cells } or null when the build has none (the
 * kit then never uses the impostor band). The texture is sRGB with mipmaps; the PNG decode happens off the main thread
 * (createImageBitmap).
 */
function figLoadImpostorAtlas(name = 'impostors') {
  if (FIG_IMP.atlases.has(name)) return FIG_IMP.atlases.get(name);
  const p = Promise.all([
    fetch(`${FIG_IMP_URL}${name}.json`).then((r) => (r.ok ? r.json() : null)),
    fetch(`${FIG_IMP_URL}${name}.png`).then((r) => (r.ok ? r.blob() : null)),
  ]).then(async ([meta, blob]) => {
    if (!meta || !blob) return null;
    const bmp = await createImageBitmap(blob, { imageOrientation: 'flipY', premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
    const tex = new THREE.Texture(bmp);
    tex.name = `fig:${name}`;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.flipY = false;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = 1;
    tex.needsUpdate = true;
    const out = { name, tex, cells: meta.cells, grid: meta.grid || FIG_IMP_GRID, w: bmp.width, h: bmp.height, bytes: Math.round((bmp.width * bmp.height * 4 * 4) / 3) };
    FIG_IMP.atlases.set(name, out);
    return out;
  }).catch((err) => {
    console.warn('[figures] impostor atlas unavailable', name, err);
    return null;
  });
  FIG_IMP.atlases.set(name, p);
  return p;
}

/** The atlas cell of a design or content type: [cell, width m, height m, bottom offset m] or null. */
function figImpostorCell(atlas, d) {
  if (!atlas || !d) return null;
  return atlas.cells[d.id] || (d.mesh ? atlas.cells[d.mesh] : null) || null;
}

const FIG_IMP_VERT = [
  'uniform highp sampler2D uFigXf;',
  'uniform vec3 uImpCam;',
  'uniform vec2 uImpGrid;',
  'attribute vec3 aCenter;',
  'attribute vec2 aCorner;',
  'attribute float aHid;',
  'attribute float aCell;',
  'attribute vec2 aSize;',
  'varying vec2 vImpUv;',
  'varying float vImpA;',
  '#include <common>',
  '#include <fog_pars_vertex>',
  'void main() {',
  '  int hnd = int(aHid + 0.5);',
  '  vImpA = texelFetch(uFigXf, ivec2((hnd % 32) * 16 + 15, hnd / 32), 0).x;',
  '  if (vImpA <= 0.001) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }',
  // Cylindrical billboard: the quad turns about the vertical axis to face the camera (screen right = up × to-camera).
  '  vec2 tc = uImpCam.xz - aCenter.xz;',
  '  vec2 r = normalize(vec2(tc.y, -tc.x) + vec2(1e-6, 0.0));',
  '  vec3 pos = aCenter + vec3(r.x, 0.0, r.y) * (aCorner.x * aSize.x) + vec3(0.0, aCorner.y * aSize.y, 0.0);',
  '  float col = mod(aCell, uImpGrid.x);',
  '  float row = floor(aCell / uImpGrid.x);',
  '  vImpUv = vec2((col + aCorner.x + 0.5) / uImpGrid.x, 1.0 - (row + 1.0 - aCorner.y) / uImpGrid.y);',
  '  vec4 mvPosition = viewMatrix * vec4(pos, 1.0);',
  '  gl_Position = projectionMatrix * mvPosition;',
  '  #include <fog_vertex>',
  '}',
].join('\n');

const FIG_IMP_FRAG = [
  'uniform sampler2D uImpAtlas;',
  'uniform vec3 uImpTint;',
  'varying vec2 vImpUv;',
  'varying float vImpA;',
  '#include <common>',
  '#include <fog_pars_fragment>',
  // 4 × 4 Bayer ordered-dither thresholds in (0, 1).
  'const float FIG_BAYER[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);',
  'float figBayer4(vec2 p) {',
  '  ivec2 q = ivec2(mod(floor(p), 4.0));',
  '  return (FIG_BAYER[q.x + q.y * 4] + 0.5) / 16.0;',
  '}',
  'void main() {',
  '  vec4 t = texture2D(uImpAtlas, vImpUv);',
  // Alpha sharpened by its screen-space gradient: mipmapped alpha keeps its coverage instead of eroding with distance.
  '  float a = (t.a - 0.5) / max(fwidth(t.a), 1e-4) + 0.5;',
  '  if (a < 0.5 || vImpA < figBayer4(gl_FragCoord.xy)) discard;',
  '  gl_FragColor = vec4(t.rgb * uImpTint, 1.0);',
  '  #include <tonemapping_fragment>',
  '  #include <colorspace_fragment>',
  '  #include <fog_fragment>',
  '}',
].join('\n');

function figImpostorMaterial(atlas) {
  const m = new THREE.ShaderMaterial({
    name: 'fig:impostor',
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
      uImpAtlas: { value: atlas.tex }, uImpCam: { value: new THREE.Vector3() }, uImpGrid: { value: new THREE.Vector2(atlas.grid.cols, atlas.grid.rows) },
    }]),
    vertexShader: FIG_IMP_VERT,
    fragmentShader: FIG_IMP_FRAG,
    fog: true,
  });
  // Shared (not copied) uniforms: the kit's transform texture and the impostor tint.
  m.uniforms.uFigXf = FIG_UNIFORMS.xf;
  m.uniforms.uImpTint = FIG_IMP.tint;
  return m;
}

/**
 * Builds the static impostor quad batches of a kit: entries = [{ h, designId, x, y, z, group }] (h = kit handle; the
 * pose of the base bottom centre; group = batch key, the district). One Mesh per group (u16 indices: at most 16,383
 * quads each), a real bounding sphere, and every entry's handle marked impostor-ready in the kit. Returns
 * { meshes, update(camera), stats(), dispose() }; update() once per frame before the draw (camera position).
 */
function createImpostorBatches(scene, kit, entries, atlas) {
  const groups = new Map();
  let missing = 0;
  for (const e of entries) {
    const c = figImpostorCell(atlas, FIG_BY_ID[e.designId]);
    if (!c) {
      missing++;
      continue;
    }
    if (!groups.has(e.group)) groups.set(e.group, []);
    groups.get(e.group).push([e, c]);
  }
  const mat = figImpostorMaterial(atlas);
  const meshes = [];
  const root = new THREE.Group();
  root.name = 'fig:impostors';
  root.matrixAutoUpdate = false;
  let quads = 0;
  for (const [key, list] of groups) {
    for (let start = 0; start < list.length; start += 16383) {
      const part = list.slice(start, start + 16383);
      const nq = part.length;
      const center = new Float32Array(nq * 12);
      const corner = new Float32Array(nq * 8);
      const hid = new Float32Array(nq * 4);
      const cell = new Float32Array(nq * 4);
      const size = new Float32Array(nq * 8);
      const index = new Uint16Array(nq * 6);
      const box = new THREE.Box3();
      const v = new THREE.Vector3();
      part.forEach(([e, c], q) => {
        const [ci, w, h, y0] = c;
        for (let k = 0; k < 4; k++) {
          const o = q * 4 + k;
          center[o * 3] = e.x;
          center[o * 3 + 1] = e.y + y0;
          center[o * 3 + 2] = e.z;
          corner[o * 2] = k === 0 || k === 3 ? -0.5 : 0.5;
          corner[o * 2 + 1] = k < 2 ? 0 : 1;
          hid[o] = e.h;
          cell[o] = ci;
          size[o * 2] = w;
          size[o * 2 + 1] = h;
        }
        index.set([q * 4, q * 4 + 1, q * 4 + 2, q * 4, q * 4 + 2, q * 4 + 3], q * 6);
        const rr = Math.max(w * 0.5, 0.01);
        box.expandByPoint(v.set(e.x - rr, e.y + y0, e.z - rr));
        box.expandByPoint(v.set(e.x + rr, e.y + y0 + h, e.z + rr));
        kit.setImpostorReady(e.h, true);
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('aCenter', new THREE.BufferAttribute(center, 3));
      g.setAttribute('aCorner', new THREE.BufferAttribute(corner, 2));
      g.setAttribute('aHid', new THREE.BufferAttribute(hid, 1));
      g.setAttribute('aCell', new THREE.BufferAttribute(cell, 1));
      g.setAttribute('aSize', new THREE.BufferAttribute(size, 2));
      // three needs a position attribute for its draw range and bounds; the centre is the position.
      g.setAttribute('position', g.attributes.aCenter);
      g.setIndex(new THREE.BufferAttribute(index, 1));
      g.boundingSphere = box.getBoundingSphere(new THREE.Sphere());
      g.boundingBox = box;
      const m = new THREE.Mesh(g, mat);
      m.name = `fig:impostors:${key}`;
      m.matrixAutoUpdate = false;
      m.frustumCulled = true;
      // Opaque band after the figures (front-to-back within the band; impostors are far by definition).
      m.renderOrder = 1;
      m.userData.quads = nq;
      root.add(m);
      meshes.push(m);
      quads += nq;
    }
  }
  scene.add(root);
  const frustum = new THREE.Frustum();
  const pm = new THREE.Matrix4();
  const last = { visible: 0, quadsInView: 0 };
  const batches = {
    root, meshes, material: mat, quads, missing,
    /** Camera position for the billboards, and the per-batch visibility count for the statistics. */
    update(camera) {
      if (!camera) return;
      camera.updateMatrixWorld();
      mat.uniforms.uImpCam.value.setFromMatrixPosition(camera.matrixWorld);
      pm.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      frustum.setFromProjectionMatrix(pm);
      let vis = 0;
      let qv = 0;
      for (const m of meshes) {
        if (m.visible && frustum.intersectsSphere(m.geometry.boundingSphere)) {
          vis++;
          qv += m.userData.quads;
        }
      }
      last.visible = vis;
      last.quadsInView = qv;
    },
    stats() {
      return { batches: meshes.length, quads, missing, batchesInView: last.visible, quadsInView: last.quadsInView, atlas: atlas.name, atlasMB: +(atlas.bytes / 1048576).toFixed(1) };
    },
    dispose() {
      scene.remove(root);
      for (const m of meshes) m.geometry.dispose();
      mat.dispose();
      FIG_IMP.batches = FIG_IMP.batches.filter((b) => b !== batches);
    },
  };
  FIG_IMP.batches.push(batches);
  return batches;
}

/** Statistics of every impostor batch set (harness, performance panel). */
function figImpostorStats() {
  return FIG_IMP.batches.map((b) => b.stats());
}

/* ---- preview-main.js ---- */
/* ==== preview-main.js — figures-preview.html: every design on its base in a grid (one row per category), turning
   slowly, with labels, LOD and lighting switches and an info panel (DESIGN.md 16.12). Top-level names start with "pv".
   URL switches for visual QA: ?only=id,id  ?cat=<key>  ?view=grid|front|three|back|face|top|tv  ?lod=0|1|2
   ?light=shop|studio  ?rot=0  ?ui=0  ?yaw=<deg>  ?base=0 ==== */

const pvQS = new URLSearchParams(location.search);
const pvState = {
  rotate: pvQS.get('rot') !== '0', bases: pvQS.get('base') !== '0', wire: false, tv: pvQS.get('view') === 'tv', light: pvQS.get('light') || 'shop',
  lod: pvQS.has('lod') ? Number(pvQS.get('lod')) : -1, ext: false, t: 0, frames: 0,
  yaw: 0, pitch: 0.18, dist: 3, target: null, drag: null, focus: -1, items: [], labels: [],
};
/** Recipe deviations, shown in the info panel (DESIGN.md 16.6). */
const pvDeviations = [
  'Minden figura offline SDF-szobrászattal készül (TECHNIQUE.md), a recept primitívjei helyett valósághű szobor-arányokkal.',
  'Minden mintából 10 példány van (DECISIONS.md 1.), a címerállatokból 3 × 3 méret, a Házkupából 1.',
  'A talapzat érme-medalionja aranyozott jel sötét lakkmezőn (DESIGN.md 16.8), nem arany az aranyon.',
  'Három részletességi szint (kb. 12k / 2,4k / 0,6k háromszög), a távoli szint egyetlen közös rajzolásban.',
];
/** Grid spacing between figures, at the global figurine scale (FIG_SCALE). */
const pvSp = { x: 0.135 * FIG_SCALE, z: 0.24 * FIG_SCALE };

function pvRows() {
  const only = (pvQS.get('only') || '').split(',').map((s) => s.trim()).filter((s) => FIG_BY_ID[s]);
  if (only.length) return [only];
  const cat = pvQS.get('cat');
  if (cat === 'special') return [FIG_DESIGNS.filter((d) => d.category === 'tower' || d.category === 'special').map((d) => d.id)];
  if (cat && FIG_CATEGORY_INDEX[cat] !== undefined) return [FIG_DESIGNS.filter((d) => d.category === cat).map((d) => d.id)];
  const rows = FIG_CATEGORIES.map((c) => FIG_DESIGNS.filter((d) => d.category === c.key).map((d) => d.id));
  rows.push(FIG_DESIGNS.filter((d) => d.category === 'tower' || d.category === 'special').map((d) => d.id));
  return rows;
}

function pvEnvironment(renderer, warm) {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 6, 10), new THREE.MeshBasicMaterial({ color: warm ? 0x1c140e : 0x3a3a40, side: THREE.BackSide })));
  const blobs = warm
    ? [[2.2, 2, 2, new THREE.Color(6, 3.4, 1.4), 0.7], [-2.5, 1.6, 1.5, new THREE.Color(4, 2.2, 1), 0.5], [-1, 2.6, -3, new THREE.Color(0.6, 0.9, 2.2), 1.0]]
    : [[2, 3, 2, new THREE.Color(5, 5, 5), 1.0], [-3, 2, 1, new THREE.Color(2.5, 2.5, 2.5), 1.2], [0, 3, -3, new THREE.Color(2, 2, 2.2), 1.0]];
  for (const [x, y, z, c, r] of blobs) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), new THREE.MeshBasicMaterial({ color: c }));
    m.position.set(x, y, z);
    env.add(m);
  }
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(env, 0.04).texture;
  pm.dispose();
  return tex;
}

function pvBoot() {
  const canvas = document.getElementById('pvCanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0a0d);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 60);
  const envShop = pvEnvironment(renderer, true);
  const envStudio = pvEnvironment(renderer, false);

  /* Lights: shop = candle-warm points + cool moon; studio = neutral key / fill / rim */
  const shop = new THREE.Group();
  shop.add(new THREE.HemisphereLight(0x3b4a6b, 0x20160e, 0.9));
  const moon = new THREE.DirectionalLight(0x9db4ff, 1.4);
  moon.position.set(-2, 3, -1.5);
  shop.add(moon);
  const candles = [];
  for (const [x, y, z, i] of [[0.9, 0.9, 1.2, 4.5], [-1.1, 0.7, 0.9, 3.2], [0.2, 1.4, -0.6, 2.0]]) {
    const p = new THREE.PointLight(0xffb36b, i, 8, 2);
    p.position.set(x, y, z);
    p.userData.base = i;
    candles.push(p);
    shop.add(p);
  }
  const studio = new THREE.Group();
  studio.add(new THREE.HemisphereLight(0xffffff, 0x404048, 1.1));
  const key = new THREE.DirectionalLight(0xfff4e8, 2.4);
  key.position.set(1.5, 2.5, 2.5);
  studio.add(key);
  const fill = new THREE.DirectionalLight(0xe8f0ff, 0.9);
  fill.position.set(-2.5, 1, 1);
  studio.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1.2);
  rim.position.set(0, 2, -3);
  studio.add(rim);
  scene.add(shop, studio);

  /* Layout */
  const rows = pvRows();
  const designOf = [];
  const items = [];
  rows.forEach((row, ri) => {
    row.forEach((id, i) => {
      const x = (i - (row.length - 1) / 2) * pvSp.x * (rows.length === 1 ? 1.08 : 1);
      const z = -ri * pvSp.z;
      items.push({ h: designOf.length, id, x, z, yaw: 0 });
      designOf.push(id);
    });
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x24170f, roughness: 0.55, metalness: 0 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.0005;
  scene.add(floor);

  initFigureMaterials({ quality: 'magas' });
  const kit = createFigureKit(scene, designOf, { quality: 'magas' });
  kit.setCamera(camera);
  if (pvState.lod >= 0) kit.setForceLod(pvState.lod);
  const q = new THREE.Quaternion();
  const up = new THREE.Vector3(0, 1, 0);
  const p = new THREE.Vector3();
  for (const it of items) {
    kit.setMode(it.h, FIG_MODE.SHELF);
    kit.setPose(it.h, p.set(it.x, 0, it.z), q.identity(), 1);
  }

  /* Camera framing */
  let minX = Infinity;
  let maxX = -Infinity;
  let minZ = Infinity;
  let maxZ = -Infinity;
  let maxH = 0;
  for (const it of items) {
    const m = getFigureMetrics(it.id);
    minX = Math.min(minX, it.x - m.radius);
    maxX = Math.max(maxX, it.x + m.radius);
    minZ = Math.min(minZ, it.z);
    maxZ = Math.max(maxZ, it.z);
    maxH = Math.max(maxH, m.totalH);
  }
  const view = pvQS.get('view') || (items.length <= 8 ? 'three' : 'grid');
  const showUiEarly = pvQS.get('ui') !== '0';
  const cx = (minX + maxX) / 2;
  const cz = (minZ + maxZ) / 2;
  const w = maxX - minX;
  pvState.target = new THREE.Vector3(cx, maxH * 0.5, cz);
  const yawQ = pvQS.has('yaw') ? (Number(pvQS.get('yaw')) * Math.PI) / 180 : null;
  if (view === 'grid') {
    pvState.yaw = 0;
    pvState.pitch = 0.62;
    pvState.target.set(cx, 0.03, cz);
    pvState.dist = Math.max(w, maxZ - minZ) * 1.75 + 0.4;
  } else if (view === 'face') {
    const m = getFigureMetrics(items[0].id);
    pvState.target.set(cx, m.totalH * 0.88, cz);
    pvState.dist = Math.max(0.09, m.figH * 0.55);
    pvState.yaw = -0.3;
    pvState.pitch = 0.05;
  } else if (view === 'top') {
    pvState.yaw = 0.3;
    pvState.pitch = 1.1;
    pvState.dist = Math.max(w, maxH) * 2.6 + 0.12;
  } else {
    pvState.yaw = view === 'front' ? 0 : view === 'back' ? Math.PI : -0.6;
    pvState.pitch = 0.16;
    pvState.dist = Math.max(w * 0.98, maxH * 1.25) / (2 * Math.tan((camera.fov * Math.PI) / 360)) + 0.05;
    /* keep the row clear of the info panel on the left */
    if (showUiEarly && items.length > 2) pvState.target.x -= w * 0.12;
  }
  if (yawQ !== null) pvState.yaw = yawQ;
  if (pvState.tv) {
    camera.fov = 70;
    pvState.dist = 2.5;
    pvState.pitch = 0.32;
  }
  if (view !== 'grid' && pvQS.get('rot') === null) pvState.rotate = false;

  /* Labels */
  const labelRoot = document.getElementById('pvLabels');
  const showUi = pvQS.get('ui') !== '0';
  if (!showUi) document.body.classList.add('pv-shot');
  for (const it of items) {
    const d = FIG_BY_ID[it.id];
    const el = document.createElement('div');
    el.className = 'pv-label';
    labelRoot.appendChild(el);
    it.label = el;
    it.labelText = () => {
      const m = typeof FIG_BAKED_META !== 'undefined' ? FIG_BAKED_META[it.id] : null;
      const tri = m ? m.tris.map((t) => (t >= 1000 ? `${(t / 1000).toFixed(1)}k` : t)).join(' / ') : 'helyettesítő';
      const flags = [d.translucent ? 'áttetsző' : '', kit.getInfo().externalIds.includes(it.id) ? 'külső' : '', m && m.preview ? 'vázlat' : ''].filter(Boolean).join(', ');
      return `<b>${d.nameHu}</b><br><i>${it.id}</i><br>${tri}${flags ? `<br><span class="pv-flag">${flags}</span>` : ''}`;
    };
    el.innerHTML = it.labelText();
    el.hidden = !showUi || items.length > 90;
  }
  pvState.items = items;

  /* Buttons */
  const btns = document.getElementById('pvButtons');
  const mk = (label, get, set) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    const sync = () => b.setAttribute('aria-pressed', String(!!get()));
    b.addEventListener('click', () => {
      set(!get());
      sync();
    });
    sync();
    btns.appendChild(b);
    return b;
  };
  mk('Forgatás', () => pvState.rotate, (v) => { pvState.rotate = v; });
  mk('Alapok', () => pvState.bases, (v) => {
    pvState.bases = v;
    for (const it of items) kit.setBaseVisible(it.h, v);
  });
  mk('Drótváz', () => pvState.wire, (v) => {
    pvState.wire = v;
    for (const m of [FIG_MATERIALS.figurePhys, FIG_MATERIALS.figureStd, FIG_MATERIALS.glass, FIG_MATERIALS.basePhys, FIG_MATERIALS.baseStd]) m.wireframe = v;
  });
  mk('TV-távolság', () => pvState.tv, (v) => {
    pvState.tv = v;
    camera.fov = v ? 70 : 30;
    pvState.dist = v ? 2.5 : 1.2;
    camera.updateProjectionMatrix();
  });
  mk('Külső modellek', () => pvState.ext, (v) => {
    if (!v) return;
    pvState.ext = true;
    kit.loadExternalModels().then((ids) => {
      for (const it of items) it.label.innerHTML = it.labelText();
      pvStatsDirty = true;
      if (!ids.length) console.info('[preview] no external models applied');
    });
  });
  mk('Fény: bolt / stúdió', () => pvState.light === 'shop', (v) => { pvState.light = v ? 'shop' : 'studio'; });
  for (const [label, l] of [['Közeli', 0], ['Közepes', 1], ['Távoli', 2], ['Auto LOD', -1]]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', () => {
      pvState.lod = l;
      kit.setForceLod(l);
    });
    btns.appendChild(b);
  }

  /* Info panel */
  let pvStatsDirty = true;
  const stats = document.getElementById('pvStats');
  function writeStats() {
    const meta = typeof FIG_BAKED_META !== 'undefined' ? FIG_BAKED_META : {};
    const ri = renderer.info;
    const ki = kit.getInfo();
    let rowsHtml = '';
    const groups = [...FIG_CATEGORIES.map((c) => [c.nameHu, FIG_DESIGNS.filter((d) => d.category === c.key)]), ['Torony és különleges', FIG_DESIGNS.filter((d) => d.category === 'tower' || d.category === 'special')]];
    let totMid = 0;
    let totFar = 0;
    let totNear = 0;
    let baked = 0;
    let kb = 0;
    for (const [name, ds] of groups) {
      let t0 = 0;
      let t1 = 0;
      let t2 = 0;
      for (const d of ds) {
        const m = meta[d.id];
        if (!m) continue;
        baked++;
        kb += m.kb;
        t0 += m.tris[0];
        t1 += m.tris[1] || m.tris[0];
        t2 += m.tris[2] || m.tris[0];
        totNear += m.tris[0] * d.copies;
        totMid += (m.verts[1] || m.verts[0]) * d.copies;
        totFar += (m.verts[2] || m.verts[0]) * d.copies;
      }
      rowsHtml += `<tr><td>${name} (${ds.length})</td><td>${(t0 / 1000).toFixed(1)}k / ${(t1 / 1000).toFixed(1)}k / ${(t2 / 1000).toFixed(1)}k</td></tr>`;
    }
    stats.innerHTML = [
      `<h2>Összesítés</h2><table>`,
      `<tr><td>Minták / sütött</td><td>${FIG_DESIGNS.length} / ${baked}</td></tr>`,
      `<tr><td>Számolt figurák</td><td>${FIG_TOTAL_COUNTED}</td></tr>`,
      `<tr><td>Betöltve</td><td>${FIG_LOAD.loaded} / ${FIG_LOAD.total}${FIG_LOAD.failed.length ? ` (hiba: ${FIG_LOAD.failed.length})` : ''}</td></tr>`,
      `<tr><td>Fájlméret összesen</td><td>${(kb / 1024).toFixed(1)} MB</td></tr>`,
      `<tr><td>Rajzolási hívások (most)</td><td>${ri.render.calls}</td></tr>`,
      `<tr><td>Háromszögek (most)</td><td>${ri.render.triangles.toLocaleString('hu-HU')}</td></tr>`,
      `<tr><td>Kit: közeli / közepes / távoli</td><td>${ki.near} / ${ki.mid} / ${ki.far}</td></tr>`,
      `<tr><td>Csúcspontmunka induláskor, mind közepes</td><td>${(totMid / 1e6).toFixed(2)} M</td></tr>`,
      `<tr><td>Csúcspontmunka, mind távoli</td><td>${(totFar / 1e6).toFixed(2)} M</td></tr>`,
      `<tr><td>Ha minden figura közeli lenne</td><td>${(totNear / 1e6).toFixed(1)} M △</td></tr>`,
      `</table><h2>Háromszög / csoport (közeli / közepes / távoli)</h2><table>${rowsHtml}</table>`,
      `<h2>Eltérések a recepttől</h2><ul>${pvDeviations.map((s) => `<li>${s}</li>`).join('')}</ul>`,
    ].join('');
  }

  /* Input: drag orbit, wheel zoom, click focus, keys, gamepad */
  canvas.addEventListener('pointerdown', (e) => {
    pvState.drag = { x: e.clientX, y: e.clientY, moved: 0 };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pvState.drag) return;
    const dx = e.clientX - pvState.drag.x;
    const dy = e.clientY - pvState.drag.y;
    pvState.drag.x = e.clientX;
    pvState.drag.y = e.clientY;
    pvState.drag.moved += Math.abs(dx) + Math.abs(dy);
    pvState.yaw -= dx * 0.006;
    pvState.pitch = Math.max(-0.2, Math.min(1.4, pvState.pitch + dy * 0.005));
  });
  canvas.addEventListener('pointerup', (e) => {
    const drag = pvState.drag;
    pvState.drag = null;
    if (drag && drag.moved < 6) pvPick(e.clientX, e.clientY);
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    pvState.dist = Math.max(0.05, Math.min(20, pvState.dist * Math.exp(e.deltaY * 0.001)));
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') pvState.yaw += 0.1;
    if (e.key === 'ArrowRight') pvState.yaw -= 0.1;
    if (e.key === 'ArrowUp') pvState.pitch = Math.min(1.4, pvState.pitch + 0.08);
    if (e.key === 'ArrowDown') pvState.pitch = Math.max(-0.2, pvState.pitch - 0.08);
  });
  const projV = new THREE.Vector3();
  function pvPick(x, y) {
    let best = -1;
    let bd = 60 * 60;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const m = getFigureMetrics(it.id);
      projV.set(it.x, m.totalH * 0.5, it.z).project(camera);
      const sx = (projV.x * 0.5 + 0.5) * canvas.clientWidth;
      const sy = (-projV.y * 0.5 + 0.5) * canvas.clientHeight;
      const d2 = (sx - x) ** 2 + (sy - y) ** 2;
      if (d2 < bd) {
        bd = d2;
        best = i;
      }
    }
    if (best < 0) return;
    const it = items[best];
    const m = getFigureMetrics(it.id);
    pvState.target.set(it.x, m.totalH * 0.5, it.z);
    pvState.dist = Math.max(0.25, m.totalH * 3.2);
    const d = FIG_BY_ID[it.id];
    document.getElementById('pvFocus').hidden = false;
    document.getElementById('pvFocusName').textContent = d.nameHu;
    document.getElementById('pvFocusTag').textContent = d.tagHu;
  }

  function resize() {
    const wv = canvas.clientWidth;
    const hv = canvas.clientHeight;
    renderer.setSize(wv, hv, false);
    camera.aspect = wv / Math.max(1, hv);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    pvState.t += dt;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const pad of pads) {
      if (!pad) continue;
      const ax = Math.abs(pad.axes[2] || 0) > 0.15 ? pad.axes[2] : 0;
      const ay = Math.abs(pad.axes[3] || 0) > 0.15 ? pad.axes[3] : 0;
      pvState.yaw -= ax * dt * 1.6;
      pvState.pitch = Math.max(-0.2, Math.min(1.4, pvState.pitch + ay * dt * 1.2));
      const zoom = (pad.buttons[7]?.value || 0) - (pad.buttons[6]?.value || 0);
      pvState.dist = Math.max(0.05, Math.min(20, pvState.dist * Math.exp(zoom * dt * 1.5)));
    }
    shop.visible = pvState.light === 'shop';
    studio.visible = !shop.visible;
    scene.environment = shop.visible ? envShop : envStudio;
    for (let i = 0; i < candles.length; i++) candles[i].intensity = candles[i].userData.base * (0.92 + 0.08 * Math.sin(pvState.t * (7 + i) + i * 2));
    if (pvState.rotate) {
      for (const it of items) {
        it.yaw += dt * 0.35;
        kit.setPose(it.h, p.set(it.x, 0, it.z), q.setFromAxisAngle(up, it.yaw), 1);
      }
    }
    const cp = Math.cos(pvState.pitch);
    camera.position.set(
      pvState.target.x + Math.sin(pvState.yaw) * cp * pvState.dist,
      pvState.target.y + Math.sin(pvState.pitch) * pvState.dist,
      pvState.target.z + Math.cos(pvState.yaw) * cp * pvState.dist,
    );
    camera.lookAt(pvState.target);
    camera.updateMatrixWorld();
    kit.update(pvState.t, camera);
    renderer.render(scene, camera);
    if (showUi && items.length <= 90) {
      for (const it of items) {
        projV.set(it.x, -0.004, it.z + 0.03).project(camera);
        const vis = projV.z < 1 && Math.abs(projV.x) < 1.1 && Math.abs(projV.y) < 1.1;
        it.label.hidden = !vis;
        if (vis) {
          it.label.style.left = `${(projV.x * 0.5 + 0.5) * canvas.clientWidth}px`;
          it.label.style.top = `${(-projV.y * 0.5 + 0.5) * canvas.clientHeight}px`;
        }
      }
    }
    pvState.frames++;
    if (pvStatsDirty || pvState.frames % 30 === 0) {
      pvStatsDirty = false;
      writeStats();
    }
    if (FIG_LOAD.done && !window.__pv.ready) {
      pvState.readyFrames = (pvState.readyFrames || 0) + 1;
      if (pvState.readyFrames > 3) {
        window.__pv.ready = true;
        for (const it of items) it.label.innerHTML = it.labelText();
      }
    }
    requestAnimationFrame(frame);
  }
  window.__pv = {
    ready: false,
    info: () => ({ calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, kit: kit.getInfo(), loaded: FIG_LOAD.loaded, failed: FIG_LOAD.failed.slice(), ms: FIG_LOAD.ms }),
    kit,
  };
  requestAnimationFrame(frame);
}

pvBoot();

</script>
</body>
</html>
